# OpenGrep settings.
#
# Named settings.yml, not config.yml, on purpose: `opengrep --config` takes a *rules* file, so
# `opengrep scan --config .opengrep/settings.yml` fails with "One of these properties is missing:
# 'rules'". OpenGrep has no settings-file concept — --config accepts rules only — so something has
# to turn these keys into flags. Rules, which --config does accept, go in .opengrep/rules/.
#
# To run the same scan locally, from actions/scan-opengrep:
#
#   npm run scan -- /path/to/repo           # run it
#   npm run scan -- /path/to/repo --print   # just print the opengrep command
#
# That shares the action's own argument builder, so local and CI cannot drift. It also prints the
# full command, which is roughly:
#
#   opengrep scan --config p/default \
#     --severity ERROR --severity WARNING \
#     --exclude 'actions/*/dist/**' --exclude '**/src/test/**' \
#     --exclude '**/src/testFixtures/**' \
#     --no-error --quiet .
#
# ignore-findings has no flag: those findings are dropped after the scan, each logged with a count.
#
# This file is the only source of scan behaviour — actions/scan-opengrep holds no defaults. A
# repository with no .opengrep/settings.yml of its own falls back to *this* file, which the action
# reads out of its own checkout. Every key below is required; the action fails rather than guessing.

# Rulesets are fetched from the Semgrep registry when the scan runs, so they are always current.
# A bare word is shorthand for a pack: `java` means `p/java`.
rulesets:
  - p/default

# Suppress individual findings, matching a substring of the rule id against a regular expression
# tested on the offending source line. Prefer this over exclude-rules: it silences the case that is
# wrong for us without losing the cases the rule gets right.
#
# The action ships no built-in suppressions, so everything silenced is declared here, in the
# repository it applies to. Any repository wanting the same treatment copies these entries.
ignore-findings:
  # `kestra-io/actions/...@main` is deliberate — this repository publishes those actions and
  # consumers are meant to track main, exactly as .pinact.yaml already allows for the pinning check.
  # Scoped to that prefix on purpose: excluding the whole rule would also have hidden the 7
  # third-party mutable tags it correctly caught on plugin-jdbc (dorny/paths-filter@v4,
  # docker/login-action@v4 and friends), which are worth fixing.
  - rule: github-actions-mutable-action-tag
    match: 'kestra-io/actions/'
    reason: this repository publishes those actions; consumers track @main by design

  # secrets-inherit flags the `secrets: inherit` line, but what makes it acceptable is the `uses:`
  # above it naming who receives the secrets. match-nearest walks back to that line, so inheriting
  # into our own reusable workflows is quiet while inheriting into a third party still reports.
  - rule: secrets-inherit
    match: 'kestra-io/actions/'
    match-nearest: '^\s*uses:'
    within: 20
    reason: secrets are inherited into our own reusable workflows, not a third party

# Rule ids to drop entirely. Reach for ignore-findings first.
exclude-rules: []

# Advisory while the fleet baseline is measured. Set to ERROR to start blocking.
fail-on-severity: none

# auto scans only what a pull request changed and the whole tree everywhere else.
mode: auto

# Severities reported. Findings below these are not collected at all.
severity:
  - ERROR
  - WARNING

# Paths skipped, as --exclude. OpenGrep's built-in .semgrepignore already drops test sources, but
# a repository adding its own .semgrepignore replaces those built-ins rather than extending them,
# so anything that must hold is listed explicitly here.
exclude-paths:
  # Bundled action output is vendored, not ours to fix.
  - 'actions/*/dist/**'
  - '**/src/test/**'
  - '**/src/testFixtures/**'

# Repository-specific rules can go in .opengrep/rules/*.yml. They are loaded in addition to the
# registry packs above, not instead of them.
