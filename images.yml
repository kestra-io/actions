# Container images Kestra ships, scanned daily for vulnerabilities by image-security-scan.yml
# (dispatched by the security controller tower, kestra-io/security-controller-tower) and reported to
# Elastic (logs-trivy-gha) by actions/report-sarif in image mode. One row per image; every enabled
# row × tag is one matrix job. `owner` is the squad the tower opens the issues on.
#
# Tags: kestra and kestra-ee follow the three lines customers run (develop, latest, the 1.3 LTS line:
# `v1.3` is the moving tag of that line; `latest-lts` points at the same build as `latest` today, so it
# is not it). Every other image ships `latest` only.
#
# kestra-ee comes from GCP Artifact Registry (europe-west1-docker.pkg.dev/kestra-host/docker/kestra-ee,
# the GCP_IMAGE_PATH kestra-ee-publish-docker.yml pushes): it is the build registry.kestra.io fronts
# for customers. The workflow authenticates with the GCP_SERVICE_ACCOUNT org secret for any
# *-docker.pkg.dev (Artifact Registry) image. Not ghcr.io/kestra-io/kestra-ee: the same build, but GITHUB_TOKEN of a
# kestra-io/actions run can't read that private package (READ DENIED, 2026-10-29).
# GHCR rows are public and pulled with GITHUB_TOKEN.
#
# Out of scope on purpose: kestra-operator (no longer supported nor shipped), the dockerhub-proxy and
# quay-proxy mirrors on Artifact Registry (upstream images we pull, not ship), per-version tags
# (v1.3.45…) and -slim / -no-plugins variants (subsets of the full image).

images:
  - image: docker.io/kestra/kestra
    tags: [develop, latest, v1.3]
    owner: core-squad

  - image: europe-west1-docker.pkg.dev/kestra-host/docker/kestra-ee
    tags: [develop, latest, v1.3]
    owner: core-squad

  - image: docker.io/kestra/kestractl
    tags: [latest, latest-static]
    owner: plugins-squad

  - image: ghcr.io/kestra-io/kestra-base
    tags: [latest]
    owner: cloud-squad

  - image: ghcr.io/kestra-io/mcp-server-python
    tags: [latest]
    owner: plugins-squad

  - image: ghcr.io/kestra-io/migration-assistant
    tags: [latest]
    owner: core-squad

  - image: ghcr.io/kestra-io/aq
    tags: [latest]
    owner: core-squad

