name: "Push API Reference to website"
description: "This action pushes the API reference changes to the website."

inputs:
  gh-app-id:
    required: true
    description: GitHub App Client ID (pass secrets.GH_BOT_CLIENT_ID from the caller workflow).
  gh-app-private-key:
    required: true
    description: GitHub App private key (pass secrets.GH_BOT_PRIVATE_KEY from the caller workflow).

runs:
  using: composite
  steps:
    - id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.gh-app-id }}
        private-key: ${{ inputs.gh-app-private-key }}
        owner: kestra-io
        repositories: docs

    - name: Checkout - Docs
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: kestra-io/docs
        path: docs
        ref: "main"
        token: ${{ steps.app-token.outputs.token }}

    - name: Artifacts - Download swagger
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: swagger
        path: docs/public/

    - name: GitHub - Push change to docs
      uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
      with:
        commit_message: "feat(docs): update api swagger"
        branch: main
        file_pattern: 'public/*.yml'
        repository: "docs"
