name: 'Publish Java'
description: 'This action uploads the package to maven central or private maven registry'

inputs:
  is-private:
    description: 'Does we push to private maven registry'
    required: true

  # Prefer the individual sonatype-* inputs below. Passing the whole `secrets` context to an action
  # in another repository is a secret-exfiltration shape GitHub's heuristics flag, and a flagged
  # workflow does not run until someone with write access approves it — it held kestra-io/kotlp's
  # v0.1.1 release with zero jobs started.
  secrets:
    description: 'Every secret passed as toJSON. Legacy fallback, only read for keys the individual inputs below do not supply.'
    required: false
    default: '{}'

  sonatype-user:
    description: 'Sonatype username. Takes precedence over secrets.SONATYPE_USER.'
    required: false
    default: ''

  sonatype-password:
    description: 'Sonatype password. Takes precedence over secrets.SONATYPE_PASSWORD.'
    required: false
    default: ''

  sonatype-gpg-keyid:
    description: 'Sonatype GPG key id. Takes precedence over secrets.SONATYPE_GPG_KEYID.'
    required: false
    default: ''

  sonatype-gpg-password:
    description: 'Sonatype GPG password. Takes precedence over secrets.SONATYPE_GPG_PASSWORD.'
    required: false
    default: ''

  sonatype-gpg-file:
    description: 'Base64-encoded Sonatype GPG secret keyring. Takes precedence over secrets.SONATYPE_GPG_FILE.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Clean Up - Pre-release
    - name: Clean Up - Pre-release
      if: ${{ startsWith(github.ref, 'refs/tags/v') }}
      shell: bash
      run: |
        echo "--- Preparing for release ---"
        echo "Removing test certificate directory..."
        sudo rm -rf certs
        echo "---------------------------"

    # Publish
    - name: Publish - Release package with Gradle
      shell: bash
      if: ${{ inputs.is-private == 'true' }}
      env:
        GRADLE_OPTS: >-
          -Dorg.gradle.internal.http.connectionTimeout=120000
          -Dorg.gradle.internal.http.socketTimeout=120000
          -Dorg.gradle.internal.repository.max.retries=8
          -Dorg.gradle.internal.repository.initial.backoff=1000
      run: |
        max_attempts=4
        for attempt in $(seq 1 "$max_attempts"); do
          set +e
          ./gradlew publish --no-daemon --no-parallel --max-workers=1 --stacktrace 2>&1 | tee /tmp/publish.log
          exit_code=${PIPESTATUS[0]}
          set -e

          if [ "$exit_code" -eq 0 ]; then
            exit 0
          fi

          # Tolerate duplicate-version rejection on retries; other failures still surface.
          if grep -q "Component with package url.*already exists" /tmp/publish.log; then
            echo "::warning::Already published; skipping."
            exit 0
          fi

          # Artifact Registry rejects a snapshot upload with a bare 400 when another build is
          # writing the same SNAPSHOT coordinates at that moment — e.g. several PRs merged to
          # main within seconds, each publishing the same x.y.z-SNAPSHOT. Gradle's own
          # repository retries (max.retries above) do not cover 4xx, so back off here instead.
          # A genuinely malformed request fails identically on every attempt and still surfaces.
          if [ "$attempt" -lt "$max_attempts" ] && grep -qE "Received status code (400|429|5[0-9]{2})" /tmp/publish.log; then
            backoff=$(( (2 ** attempt) * 15 + RANDOM % 15 ))
            echo "::warning::Publish failed with a transient status code, retrying in ${backoff}s (attempt ${attempt}/${max_attempts})."
            sleep "$backoff"
            continue
          fi

          exit "$exit_code"
        done

    - name: Publish - Release package to Maven Central
      if: ${{ inputs.is-private == 'false' }}
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ inputs.sonatype-user || fromJson(inputs.secrets).SONATYPE_USER }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ inputs.sonatype-password || fromJson(inputs.secrets).SONATYPE_PASSWORD }}
        SONATYPE_GPG_KEYID: ${{ inputs.sonatype-gpg-keyid || fromJson(inputs.secrets).SONATYPE_GPG_KEYID }}
        SONATYPE_GPG_PASSWORD: ${{ inputs.sonatype-gpg-password || fromJson(inputs.secrets).SONATYPE_GPG_PASSWORD }}
        SONATYPE_GPG_FILE: ${{ inputs.sonatype-gpg-file || fromJson(inputs.secrets).SONATYPE_GPG_FILE }}
      shell: bash
      run: |
        # Neither source supplied credentials: fail here rather than let Gradle report an opaque 401.
        if [ -z "${ORG_GRADLE_PROJECT_mavenCentralUsername}" ] || [ -z "${SONATYPE_GPG_FILE}" ]; then
          echo "::error::No Sonatype credentials. Pass the sonatype-* inputs, or a 'secrets' JSON carrying SONATYPE_USER/SONATYPE_PASSWORD/SONATYPE_GPG_KEYID/SONATYPE_GPG_PASSWORD/SONATYPE_GPG_FILE."
          exit 1
        fi

        mkdir -p ~/.gradle
        echo "signing.keyId=${SONATYPE_GPG_KEYID}" > ~/.gradle/gradle.properties
        echo "signing.password=${SONATYPE_GPG_PASSWORD}" >> ~/.gradle/gradle.properties
        echo "signing.secretKeyRingFile=${HOME}/.gradle/secring.gpg" >> ~/.gradle/gradle.properties
        echo ${SONATYPE_GPG_FILE} | base64 -d > ~/.gradle/secring.gpg

        max_attempts=5
        for attempt in $(seq 1 "$max_attempts"); do
          if ./gradlew publishToMavenCentral 2>&1 | tee /tmp/publish.log; then
            exit 0
          fi

          if grep -q "Component with package url.*already exists" /tmp/publish.log; then
            echo "::warning::Already published to Maven Central; skipping."
            exit 0
          fi

          # A 5xx on the Portal's status poll fails the build with the deployment still
          # open server-side, and it then rejects every re-upload of the same coordinates
          # ("currently being published in another deployment"). Wait on that deployment
          # rather than racing it, since a re-run can only collide with it again.
          blocking=$(grep -oE "another deployment \([0-9a-f-]{36}\)" /tmp/publish.log | grep -oE "[0-9a-f-]{36}")
          if [ -n "$blocking" ]; then
            # The Portal wants base64(user:token) as a bearer token. GitHub masks the raw
            # secrets but not a value derived from them, so register this one.
            portal_token=$(printf '%s:%s' "${ORG_GRADLE_PROJECT_mavenCentralUsername}" "${ORG_GRADLE_PROJECT_mavenCentralPassword}" | base64 | tr -d '\n')
            echo "::add-mask::${portal_token}"
            echo "::warning::Deployment ${blocking} already holds these coordinates, waiting on it."

            # 40 polls x 15s = 10 minutes. An unreadable state leaves $state empty and
            # just polls again, so a transient 5xx here costs one interval, not the build.
            for _ in $(seq 1 40); do
              state=$(curl -sS -m 60 -X POST -H "Authorization: Bearer ${portal_token}" \
                "https://central.sonatype.com/api/v1/publisher/status?id=${blocking}" 2>/dev/null \
                | jq -r '.deploymentState // empty' 2>/dev/null || true)
              echo "Deployment ${blocking} is ${state:-unreadable}."

              case "$state" in
                PUBLISHED)
                  echo "::notice::Deployment ${blocking} published."
                  exit 0
                  ;;
                FAILED)
                  curl -sS -m 60 -o /dev/null -X DELETE -H "Authorization: Bearer ${portal_token}" \
                    "https://central.sonatype.com/api/v1/publisher/deployment/${blocking}" || true
                  echo "::warning::Dropped failed deployment ${blocking}, retrying the upload."
                  break
                  ;;
              esac

              sleep 15
            done

            if [ "$state" = "FAILED" ]; then
              continue
            fi
            echo "::error::Deployment ${blocking} is stuck in ${state:-an unreadable state}. Resolve it at https://central.sonatype.com/publishing/deployments: while it stays open, every re-run collides with it."
            exit 1
          fi

          if [ "$attempt" -lt "$max_attempts" ] && grep -qE "Received status code (403|5[0-9]{2})|403 Forbidden|code: 5[0-9]{2}" /tmp/publish.log; then
            if grep -qE "Received status code 403|403 Forbidden" /tmp/publish.log; then
              # Dump response headers so Sonatype support can identify which WAF layer blocked the request.
              failed_url=$(grep -oP "(?<=Could not GET ')[^']+" /tmp/publish.log | head -1)
              if [ -n "$failed_url" ]; then
                echo "=== 403 response headers (Sonatype diagnostic) ==="
                # -v echoes the request's own Authorization header; keep it out of the log.
                curl -sv -u "${ORG_GRADLE_PROJECT_mavenCentralUsername}:${ORG_GRADLE_PROJECT_mavenCentralPassword}" \
                  -o /dev/null "$failed_url" 2>&1 | grep -E "^[<>*]" | grep -viE "^> *authorization:"
              fi
            fi
            # Sonatype Central Portal throttles under load with a 403, and its gateway
            # returns 5xx often enough to matter; back off with jitter to outlast either.
            backoff=$(( (2 ** attempt) * 30 + RANDOM % 30 ))
            echo "::warning::Publish failed with a transient status code, retrying in ${backoff}s (attempt ${attempt}/${max_attempts})."
            sleep "$backoff"
            continue
          fi

          exit 1
        done
