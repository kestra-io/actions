name: 'Publish Java'
description: 'This action uploads the package to maven central or private maven registry'

inputs:
  is-private:
    description: 'Does we push to private maven registry'
    required: true

  # Prefer the individual sonatype-* inputs below. Passing the whole `secrets` context to an action
  # in another repository is a secret-exfiltration shape GitHub's heuristics flag, and a flagged
  # workflow does not run until someone with write access approves it — it held kestra-io/kotlp's
  # v0.1.1 release with zero jobs started.
  secrets:
    description: 'Every secret passed as toJSON. Legacy fallback, only read for keys the individual inputs below do not supply.'
    required: false
    default: '{}'

  sonatype-user:
    description: 'Sonatype username. Takes precedence over secrets.SONATYPE_USER.'
    required: false
    default: ''

  sonatype-password:
    description: 'Sonatype password. Takes precedence over secrets.SONATYPE_PASSWORD.'
    required: false
    default: ''

  sonatype-gpg-keyid:
    description: 'Sonatype GPG key id. Takes precedence over secrets.SONATYPE_GPG_KEYID.'
    required: false
    default: ''

  sonatype-gpg-password:
    description: 'Sonatype GPG password. Takes precedence over secrets.SONATYPE_GPG_PASSWORD.'
    required: false
    default: ''

  sonatype-gpg-file:
    description: 'Base64-encoded Sonatype GPG secret keyring. Takes precedence over secrets.SONATYPE_GPG_FILE.'
    required: false
    default: ''

  working-directory:
    description: 'Directory holding the Gradle build to publish. Defaults to the workspace root.'
    required: false
    default: '.'

  gradle-args:
    description: >-
      Extra Gradle arguments for the private-registry publish. The default serialises the build
      because the plugin repositories publish the same SNAPSHOT coordinates from several
      concurrent workflows; a repository without that problem should override it. Keep
      --continue in any override: the already-published guard below can only clear a failure
      if Gradle attempted every module rather than stopping at the first rejected upload.
    required: false
    default: '--no-daemon --no-parallel --max-workers=1 --stacktrace --continue'

  registry-token:
    description: >-
      OAuth token able to READ the private registry. Only used to check whether a rejected
      upload is already published, never to publish. Defaults to the MAVEN_REMOTE_TOKEN that
      composite/kestra-ee/setup-maven-proxy exports for the whole job; without either, a
      rejected upload cannot be cleared as a duplicate and the job fails as before.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Clean Up - Pre-release
    - name: Clean Up - Pre-release
      if: ${{ startsWith(github.ref, 'refs/tags/v') }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "--- Preparing for release ---"
        echo "Removing test certificate directory..."
        sudo rm -rf certs
        echo "---------------------------"

    # Publish
    - name: Publish - Release package with Gradle
      shell: bash
      if: ${{ inputs.is-private == 'true' }}
      working-directory: ${{ inputs.working-directory }}
      env:
        GRADLE_ARGS: ${{ inputs.gradle-args }}
        REGISTRY_READ_TOKEN: ${{ inputs.registry-token }}
        GRADLE_OPTS: >-
          -Dorg.gradle.internal.http.connectionTimeout=120000
          -Dorg.gradle.internal.http.socketTimeout=120000
          -Dorg.gradle.internal.repository.max.retries=8
          -Dorg.gradle.internal.repository.initial.backoff=1000
      run: |
        # GCP Artifact Registry answers a re-upload of an existing release artifact with a bare
        # 400 Bad Request - the very same status it returns for a concurrent SNAPSHOT write and
        # for a malformed request, so the status code on its own proves nothing. Confirm instead
        # by reading every rejected coordinate back from the registry.
        #
        # Clearing a build this way is only sound when NOTHING ELSE went wrong, so every failed
        # task must be one of those rejected uploads. A task that failed any other way - a
        # broken pipe mid-upload, a compile or signing error - means something never reached the
        # registry, and no amount of duplicate-checking can clear it. kestra-ee run 32846309046
        # is exactly that: six coordinates rejected as duplicates plus :core-ee: dying on a
        # broken pipe.
        #
        # SNAPSHOT coordinates are deliberately excluded. There a 400 is the concurrent-write
        # race the retry below handles, and finding the artifact present only means some other
        # build won the race - not that THIS build's snapshot was published.
        rejected_uploads_already_in_registry() {
          local failed_tasks urls rejected url file version artifact token code

          urls=$(grep -oE "Could not PUT '[^']+'\. Received status code 400" /tmp/publish.log \
                 | sed -E "s/^Could not PUT '//; s/'\. Received status code 400$//" | sort -u)
          [ -n "$urls" ] || return 1

          # Anything that failed but was not refused with a 400 leaves the build incomplete.
          failed_tasks=$(grep -cE "^Execution failed for task '" /tmp/publish.log | tr -d ' ' || true)
          rejected=$(printf '%s\n' "$urls" | grep -c . | tr -d ' ' || true)
          if [ "${failed_tasks:-0}" -ne "${rejected:-0}" ]; then
            echo "::warning::${failed_tasks} task(s) failed but only ${rejected} were duplicate uploads; something else went wrong."
            return 1
          fi

          token="${REGISTRY_READ_TOKEN:-${MAVEN_REMOTE_TOKEN:-}}"
          if [ -z "$token" ]; then
            echo "::warning::Uploads were rejected, but no registry token is available to check whether they are already published."
            return 1
          fi

          while IFS= read -r url; do
            [ -n "$url" ] || continue
            file=$(basename "$url")
            version=$(basename "$(dirname "$url")")
            artifact=$(basename "$(dirname "$(dirname "$url")")")

            # Only a real .../<artifact>/<version>/<artifact>-<version>* coordinate is immutable
            # enough to prove anything. maven-metadata.xml lands one directory higher - its
            # parent segment is the artifactId, which would sail past the SNAPSHOT check below -
            # and it is rewritten on every publish, so finding one proves nothing at all.
            case "$file" in
              "${artifact}-${version}"*) ;;
              *) echo "::warning::${url} is not a versioned artifact; cannot treat it as already published."; return 1 ;;
            esac
            case "$version" in
              *-SNAPSHOT) return 1 ;;
            esac

            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token}" "$url" || echo 000)
            if [ "$code" != "200" ]; then
              echo "::warning::${url} was rejected but is not in the registry (HTTP ${code}); this is a real publish failure."
              return 1
            fi
            echo "  already published: ${url}"
          done <<< "$urls"
          return 0
        }

        max_attempts=4
        for attempt in $(seq 1 "$max_attempts"); do
          set +e
          # shellcheck disable=SC2086  # GRADLE_ARGS is a deliberate argument list
          ./gradlew publish $GRADLE_ARGS 2>&1 | tee /tmp/publish.log
          exit_code=${PIPESTATUS[0]}
          set -e

          if [ "$exit_code" -eq 0 ]; then
            exit 0
          fi

          # Tolerate a re-run of a release that is already published; anything else still surfaces.
          if rejected_uploads_already_in_registry; then
            echo "::notice::Every rejected upload is already present in the registry at this version; treating as success."
            exit 0
          fi

          # Artifact Registry rejects a snapshot upload with a bare 400 when another build is
          # writing the same SNAPSHOT coordinates at that moment — e.g. several PRs merged to
          # main within seconds, each publishing the same x.y.z-SNAPSHOT. Gradle's own
          # repository retries (max.retries above) do not cover 4xx, so back off here instead.
          # A genuinely malformed request fails identically on every attempt and still surfaces.
          if [ "$attempt" -lt "$max_attempts" ] && grep -qE "Received status code (400|429|5[0-9]{2})" /tmp/publish.log; then
            backoff=$(( (2 ** attempt) * 15 + RANDOM % 15 ))
            echo "::warning::Publish failed with a transient status code, retrying in ${backoff}s (attempt ${attempt}/${max_attempts})."
            sleep "$backoff"
            continue
          fi

          exit "$exit_code"
        done

    - name: Publish - Release package to Maven Central
      if: ${{ inputs.is-private == 'false' }}
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ inputs.sonatype-user || fromJson(inputs.secrets).SONATYPE_USER }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ inputs.sonatype-password || fromJson(inputs.secrets).SONATYPE_PASSWORD }}
        SONATYPE_GPG_KEYID: ${{ inputs.sonatype-gpg-keyid || fromJson(inputs.secrets).SONATYPE_GPG_KEYID }}
        SONATYPE_GPG_PASSWORD: ${{ inputs.sonatype-gpg-password || fromJson(inputs.secrets).SONATYPE_GPG_PASSWORD }}
        SONATYPE_GPG_FILE: ${{ inputs.sonatype-gpg-file || fromJson(inputs.secrets).SONATYPE_GPG_FILE }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # Neither source supplied credentials: fail here rather than let Gradle report an opaque 401.
        if [ -z "${ORG_GRADLE_PROJECT_mavenCentralUsername}" ] || [ -z "${SONATYPE_GPG_FILE}" ]; then
          echo "::error::No Sonatype credentials. Pass the sonatype-* inputs, or a 'secrets' JSON carrying SONATYPE_USER/SONATYPE_PASSWORD/SONATYPE_GPG_KEYID/SONATYPE_GPG_PASSWORD/SONATYPE_GPG_FILE."
          exit 1
        fi

        mkdir -p ~/.gradle
        echo "signing.keyId=${SONATYPE_GPG_KEYID}" > ~/.gradle/gradle.properties
        echo "signing.password=${SONATYPE_GPG_PASSWORD}" >> ~/.gradle/gradle.properties
        echo "signing.secretKeyRingFile=${HOME}/.gradle/secring.gpg" >> ~/.gradle/gradle.properties
        echo ${SONATYPE_GPG_FILE} | base64 -d > ~/.gradle/secring.gpg

        # Reports success only when the build failed solely because every publication it
        # attempted already exists at this version - i.e. a re-run of a release that already
        # completed. A deployment is validated as a whole, so a partially-duplicate bundle (a
        # module added since the first attempt) publishes nothing at all; that case must stay
        # red, hence the duplicate count has to account for every publication task that ran.
        duplicate_only_failure() {
          local attempted duplicates
          attempted=$(grep -oE 'Task :[A-Za-z0-9:_.-]*publish[A-Za-z0-9-]*PublicationTo[A-Za-z0-9]*Repository' /tmp/publish.log | sort -u | wc -l | tr -d ' ' || true)
          duplicates=$(grep -cE "Component with package url: '[^']+' already exists" /tmp/publish.log | tr -d ' ' || true)
          [ "${duplicates:-0}" -gt 0 ] && [ "${attempted:-0}" -gt 0 ] && [ "${duplicates}" -eq "${attempted}" ]
        }

        max_attempts=5
        for attempt in $(seq 1 "$max_attempts"); do
          if ./gradlew publishToMavenCentral --console=plain 2>&1 | tee /tmp/publish.log; then
            exit 0
          fi

          # A re-run of an already-released version: Maven Central rejects the whole deployment
          # at validation because each component is a duplicate. Nothing was lost, so do not
          # fail the job over it.
          if duplicate_only_failure; then
            echo "::notice::Every attempted publication already exists on Maven Central at this version; treating as success."
            exit 0
          fi

          if [ "$attempt" -lt "$max_attempts" ] && grep -qE "Received status code 403|403 Forbidden" /tmp/publish.log; then
            # Dump response headers so Sonatype support can identify which WAF layer blocked the request.
            failed_url=$(grep -oP "(?<=Could not GET ')[^']+" /tmp/publish.log | head -1)
            if [ -n "$failed_url" ]; then
              echo "=== 403 response headers (Sonatype diagnostic) ==="
              curl -sv -u "${ORG_GRADLE_PROJECT_mavenCentralUsername}:${ORG_GRADLE_PROJECT_mavenCentralPassword}" \
                -o /dev/null "$failed_url" 2>&1 | grep -E "^[<>*]"
            fi
            # Sonatype Central Portal throttles snapshot/metadata requests under load and
            # returns 403; back off exponentially with jitter to outlast the throttle window.
            backoff=$(( (2 ** attempt) * 30 + RANDOM % 30 ))
            echo "::warning::Sonatype throttled the publish (403), retrying in ${backoff}s (attempt ${attempt}/${max_attempts})."
            sleep "$backoff"
            continue
          fi

          exit 1
        done
