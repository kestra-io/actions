name: 'OpenGrep Scan'
description: 'Static analysis with OpenGrep, reported as check annotations, a pull request comment, an artifact and Elastic on the default branch'

# Thin wiring only. Everything with logic in it — install, cache, rule resolution, the scan, rule
# id normalisation, the summary and the gate — lives in actions/scan-opengrep, where it is unit
# tested. This file exists so the four workflows below do not each repeat the same three steps.

inputs:
  # Takes a single token rather than `toJSON(secrets)`. The other composites in this repository
  # pass the whole secret set because they genuinely need several of them; this one only ever read
  # GITHUB_TOKEN out of it, and handing a scanner every secret in the repository to use one is the
  # kind of thing CodeQL's excessive-secrets-exposure rule exists to catch.
  github-token:
    description: 'Token used to publish the check run annotations and the pull request comment'
    required: true

  opengrep-version:
    description: 'OpenGrep release to run. Defaults to latest; pin a version for reproducible scans'
    required: false
    default: "latest"

  config-dir:
    description: "Directory holding the repository's OpenGrep configuration"
    required: false
    default: ".opengrep"



  mode:
    description: 'auto, diff or full. auto scans only what a pull request changed, and the whole tree everywhere else'
    required: false
    default: "auto"

  severity:
    description: 'Comma-separated severities to report'
    required: false
    default: "ERROR,WARNING"

  fail-on-severity:
    description: 'none, WARNING or ERROR. Fail the step when a finding at or above this severity exists'
    required: false
    default: "none"

  scan-path:
    description: 'Path to scan'
    required: false
    default: "."

  elastic-endpoint:
    description: 'Elastic ingest endpoint, the OTLP_ENDPOINT secret. Leave empty to skip shipping'
    required: false
    default: ''

  elastic-headers:
    description: 'Elastic ingest headers, the OTLP_HEADERS secret'
    required: false
    default: ''

  metadata:
    description: 'Newline separated key=value pairs added to every finding, e.g. component=backend. service.name defaults to the repository name and can be overridden here. A dotted key is written at that path, an undotted one lands under labels.'
    required: false
    default: ''

  dry-run:
    description: >-
      Force shipping to Elastic on or off. Left empty (the default), shipping happens only on the
      default branch — every other branch and pull request is still scanned and commented, just
      without writing to Elastic
    required: false
    default: ''


outputs:
  summary:
    description: 'Finding counts by severity as JSON'
    value: ${{ steps.scan.outputs.summary }}

  findings-count:
    description: 'Total number of findings'
    value: ${{ steps.scan.outputs.findings-count }}

  json-file:
    description: 'Absolute path to the OpenGrep JSON report'
    value: ${{ steps.scan.outputs.json-file }}

  sarif-file:
    description: 'Absolute path to the OpenGrep SARIF report'
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: OpenGrep - Scan
      id: scan
      uses: kestra-io/actions/actions/scan-opengrep@main
      with:
        github-token: ${{ inputs.github-token }}
        opengrep-version: ${{ inputs.opengrep-version }}
        config-dir: ${{ inputs.config-dir }}
        mode: ${{ inputs.mode }}
        severity: ${{ inputs.severity }}
        fail-on-severity: ${{ inputs.fail-on-severity }}
        scan-path: ${{ inputs.scan-path }}

    # Reports run even when the gate above failed the scan step: that is exactly when someone
    # needs to see what was found.
    - name: OpenGrep - Comment pull request
      if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      continue-on-error: true
      uses: kestra-io/actions/actions/comment-update@main
      with:
        github-token: ${{ inputs.github-token }}
        title: "🔎 OpenGrep"
        result: ${{ steps.scan.outputs.findings-count == '' && 'empty' || (steps.scan.outcome == 'failure' && 'failure' || (steps.scan.outputs.findings-count > 0 && 'warning' || 'success')) }}
        title-summary: ${{ steps.scan.outputs.findings-count != '' && format('{0} findings', steps.scan.outputs.findings-count) || '' }}
        files: |
          ${{ steps.scan.outputs.comment-file }}
        template: |
          {% if files[0] and files[0].total > 0 %}
          {%- for finding in files[0].shown %}

          ##### {{ finding.severity }}: `{{ finding.rule }}` on `{{ finding.location }}`
          > {{ finding.message }}
          {%- endfor %}
          {% if files[0].overflow > 0 %}
          _… and {{ files[0].overflow }} more, see the `opengrep-report` artifact._
          {% endif %}
          {% else %}
          Found **{{ files[0].total }}** finding(s).
          {% endif %}

    # Static analysis, not a vulnerability scanner: no CVE, no package, a rule a file breaks.
    - name: OpenGrep - Report findings to Elastic
      if: ${{ !cancelled() && inputs.elastic-endpoint != '' }}
      continue-on-error: true
      uses: kestra-io/actions/actions/report-sarif@main
      with:
        sarif-files: ${{ steps.scan.outputs.sarif-file }}
        type: misconfigurations
        scanner: Opengrep
        # Not steps.scan.outcome: that is also a failure when fail-on-severity tripped on a scan that
        # completed. `skipped` is false only once a report was produced and read.
        scan-outcome: ${{ steps.scan.outputs.skipped == 'false' && 'success' || 'failure' }}
        elastic-endpoint: ${{ inputs.elastic-endpoint }}
        elastic-headers: ${{ inputs.elastic-headers }}
        dry-run: ${{ inputs.dry-run != '' && inputs.dry-run || (github.ref_name == github.event.repository.default_branch && 'false' || 'true') }}
        metadata: |
          service.name=${{ github.event.repository.name }}
          ${{ inputs.metadata }}
