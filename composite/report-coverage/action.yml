name: 'Report Coverage'
description: 'Comment every pull request with the coverage change vs develop, and ship it to Elastic on the default branch'

# Thin wiring only, matching composite/report-java and composite/scan-opengrep: the parsing, the
# module detection, the develop baseline lookup and the comment markdown all live in
# actions/report-coverage, where they are unit tested.

inputs:
  github-token:
    description: 'Token used to find/download the develop baseline artifact and to post the pull request comment'
    required: true

  coverage-files:
    description: 'Newline separated coverage report globs (JaCoCo, Cobertura or LCOV, detected per file)'
    required: true

  component:
    description: 'What part of a monorepo these reports cover, e.g. "backend" or "frontend"'
    required: true

  elastic-endpoint:
    description: 'The Elastic Cloud managed ingest host'
    required: true

  elastic-headers:
    description: 'Comma separated headers, the same secret otel-instrument and report-sarif take for otlp-headers'
    required: false
    default: ''

  check-name:
    description: 'Name of the check run, defaults to "Coverage - <component>"'
    required: false
    default: ''

  namespace:
    description: 'Data stream namespace'
    required: false
    default: 'gha'

  modules:
    description: 'Newline separated "name=path/prefix" overrides for module detection'
    required: false
    default: ''

  base-branch:
    description: 'The branch a pull request coverage is compared against'
    required: false
    default: 'develop'

  metadata:
    description: 'Newline separated key=value pairs added to every document'
    required: false
    default: ''

  dry-run:
    description: >-
      Force shipping to Elastic on or off. Left empty (the default), shipping happens only on the
      default branch — every pull request and feature branch still
      gets the coverage comment, just without writing to Elastic
    required: false
    default: ''

outputs:
  documents-count:
    description: 'Number of per-file coverage documents built from the reports'
    value: ${{ steps.coverage.outputs.documents-count }}

  line-rate:
    description: 'Overall line coverage percentage for this run'
    value: ${{ steps.coverage.outputs.line-rate }}

  delta:
    description: 'line-rate minus the develop baseline, in percentage points'
    value: ${{ steps.coverage.outputs.delta }}

runs:
  using: composite
  steps:
    - name: Coverage - Report
      id: coverage
      uses: kestra-io/actions/actions/report-coverage@main
      with:
        coverage-files: ${{ inputs.coverage-files }}
        component: ${{ inputs.component }}
        elastic-endpoint: ${{ inputs.elastic-endpoint }}
        elastic-headers: ${{ inputs.elastic-headers }}
        namespace: ${{ inputs.namespace }}
        modules: ${{ inputs.modules }}
        base-branch: ${{ inputs.base-branch }}
        metadata: |
          service.name=${{ github.event.repository.name }}
          ${{ inputs.metadata }}
        github-token: ${{ inputs.github-token }}
        # A pull request's ref_name is its merge ref ("123/merge"), never the default branch, so
        # this is 'true' (comment only, no write) for every PR on its own — writing dashboard data
        # from a feature branch would pollute it with unmerged coverage.
        dry-run: ${{ inputs.dry-run != '' && inputs.dry-run || (github.ref_name == github.event.repository.default_branch && 'false' || 'true') }}

    - name: Coverage - Publish check run
      if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
      continue-on-error: true
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        CHECK_NAME: ${{ inputs.check-name != '' && inputs.check-name || format('Coverage - {0}', inputs.component) }}
        DOCUMENTS: ${{ steps.coverage.outputs['documents-count'] }}
        LINE_RATE: ${{ steps.coverage.outputs.line-rate }}
        DELTA: ${{ steps.coverage.outputs.delta }}
        TITLE_SUMMARY: ${{ steps.coverage.outputs['title-summary'] }}
        MARKDOWN: ${{ steps.coverage.outputs.markdown }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const empty = process.env.DOCUMENTS === '0'
          await github.rest.checks.create({
            ...context.repo,
            name: process.env.CHECK_NAME,
            head_sha: context.payload.pull_request?.head?.sha ?? context.sha,
            status: 'completed',
            conclusion: empty || process.env.DELTA.startsWith('-') ? 'neutral' : 'success',
            output: {
              title: empty ? 'No coverage data' : (process.env.TITLE_SUMMARY || `${process.env.LINE_RATE}%`),
              summary: process.env.MARKDOWN.slice(0, 65000) || 'No coverage data.'
            }
          })

    - name: Coverage - Comment pull request
      if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      uses: kestra-io/actions/actions/comment-update@main
      with:
        github-token: ${{ inputs.github-token }}
        title: "📊 Coverage — ${{ inputs.component }}"
        # Not `skipped`: that's also 'true' on every dry run, which is now the normal case for a
        # pull request. documents-count == 0 is the real "no coverage data" signal.
        result: ${{ steps.coverage.outputs['documents-count'] == '0' && 'empty' || (startsWith(steps.coverage.outputs.delta, '-') && 'warning' || 'success') }}
        title-summary: ${{ steps.coverage.outputs['documents-count'] == '0' && '' || steps.coverage.outputs['title-summary'] }}
        template: ${{ steps.coverage.outputs.markdown }}
        add-summary: 'false'
