name: 'Report Java'
description: 'Send Allure, Jacoco, Sonar and Codecov reports'

inputs:
  run-sonar:
    description: 'Run Sonar analysis'
    required: false
    default: 'true'
  # Prefer the individual inputs below. Passing the whole `secrets` context to an action in another
  # repository is a secret-exfiltration shape GitHub's heuristics flag, and a flagged workflow does
  # not run until someone with write access approves it.
  secrets:
    description: 'Every secret passed as toJSON. Legacy fallback, only read for keys the individual inputs below do not supply.'
    required: false
    default: '{}'

  github-token:
    description: 'Token used to publish the test report. Takes precedence over secrets.GITHUB_TOKEN.'
    required: false
    default: ''

  github-auth-token:
    description: 'Token used by the Sonar analysis. Takes precedence over secrets.GITHUB_AUTH_TOKEN.'
    required: false
    default: ''

  sonar-token:
    description: 'Sonar token. Takes precedence over secrets.SONAR_TOKEN.'
    required: false
    default: ''

  codecov-token:
    description: 'Codecov token. Takes precedence over secrets.CODECOV_TOKEN.'
    required: false
    default: ''

  google-service-account:
    description: 'Google service account used to publish Allure reports; the report steps are skipped when empty. Takes precedence over secrets.GOOGLE_SERVICE_ACCOUNT.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Test - Publish Test Results
      uses: mikepenz/action-junit-report@v5
      id: test-report
      continue-on-error: true
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"
      with:
        check_name: Java Tests Report
        report_paths: '**/build/test-results/test/TEST-*.xml'
        fail_on_failure: 'false'
        summary: 'true'
        detailed_summary: 'true'
        require_tests: 'false'
        include_time_in_summary: 'true'
        job_summary: 'false'
        verbose_summary: 'false'
        simplified_summary: 'true'

    - name: Test - Comment pull request
      uses: kestra-io/actions/actions/comment-update@main
      continue-on-error: true
      if: ${{ github.event_name == 'pull_request' && startsWith(github.repository, 'kestra-io/') }}
      with:
        github-token: ${{ (inputs.github-token || fromJSON(inputs.secrets).GITHUB_TOKEN) }}
        title: "🧪 Java Unit Tests"
        template: |
          ${{ steps.test-report.outputs.summary }}
          {% if ${{ steps.test-report.outputs.failed }} > 0 %}
          ${{ steps.test-report.outputs.detailed_summary }}
          {% endif %}

    - name: Test - Comment PR with failure details
      # Skip on fork PRs: they get a read-only GITHUB_TOKEN, so the comment POST returns 403 and fails the job.
      # Internal PRs still run this, so a genuine devtools failure still surfaces.
      if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ (inputs.github-token || fromJSON(inputs.secrets).GITHUB_TOKEN) }}
      run: npx --yes @kestra-io/kestra-devtools generateTestReportSummary --only-errors --ci $(pwd)

    # GCP
    - name: GCP - Auth with unit test account
      if: ${{ job.status == 'success' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && (inputs.google-service-account || fromJSON(inputs.secrets).GOOGLE_SERVICE_ACCOUNT) != '' }}
      uses: 'google-github-actions/auth@v3'
      with:
        credentials_json: '${{ (inputs.google-service-account || fromJSON(inputs.secrets).GOOGLE_SERVICE_ACCOUNT) }}'

    - name: GCP - Setup Cloud SDK
      if: ${{ job.status == 'success' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && (inputs.google-service-account || fromJSON(inputs.secrets).GOOGLE_SERVICE_ACCOUNT) != ''}}
      uses: 'google-github-actions/setup-gcloud@v3'

    - name: GCP - Configure project and location
      shell: bash
      run: |
        gcloud config set project kestra-io
        gcloud config set artifacts/location europe-west1

    # Allure
    - name: Allure - Generate reports
      shell: bash
      if: ${{ job.status == 'success' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && (inputs.google-service-account || fromJSON(inputs.secrets).GOOGLE_SERVICE_ACCOUNT) != ''}}
      continue-on-error: true
      run: |
        # Multi-module builds (kestra, kestra-ee) write allure-results per module instead of
        # at the repo root, so it never exists there for gcloud to restore history into. For
        # kestra-ee specifically, the OSS modules live in the sibling ../kestra checkout (see
        # kestra-ee-backend-tests.yml's `mv kestra ../kestra`), outside this working tree.
        # Merge every module's results (root-only for single-module plugin repos, a no-op) into
        # one directory before restoring history, so the generated report covers the whole build.
        mkdir -p build/allure-results
        DEST=$(realpath build/allure-results)

        while IFS= read -r dir; do
          [ "$(realpath "$dir")" = "$DEST" ] && continue
          cp -R "$dir"/. "$DEST"/
        done < <(find . .. -maxdepth 6 -type d -name allure-results -not -path '*/.git/*' -not -path '*/node_modules/*' 2>/dev/null)

        gcloud storage cp -r gs://internal-kestra-host/${{ github.repository }}/allure/java/history build/allure-results/
        docker run --rm -v $PWD:/work tobix/allure-cli generate /work/build/allure-results/ -o /work/build/reports/allure --clean

        if [ -d build/reports/allure/ ]; then
          gsutil -m rsync -d -r  build/reports/allure/ gs://internal-kestra-host/${{ format('{0}/{1}', github.repository, 'allure/java') }}
        fi

    # Jacoco
    - name: Jacoco - Copy reports
      shell: bash
      if: ${{ job.status == 'success' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && (inputs.google-service-account || fromJSON(inputs.secrets).GOOGLE_SERVICE_ACCOUNT) != ''}}
      continue-on-error: true
      run: |
        if [ -d build/reports/jacoco/testCodeCoverageReport ]; then
          cp -R build/reports/jacoco/testCodeCoverageReport build/reports/jacoco/test/
          cp build/reports/jacoco/test/testCodeCoverageReport.xml build/reports/jacoco/test/jacocoTestReport.xml
        fi
        
        if [ -d build/reports/jacoco/test/ ]; then
          gsutil -m rsync -d -r  build/reports/jacoco/test/ gs://internal-kestra-host/${{ format('{0}/{1}', github.repository, 'jacoco') }}
        fi

    # Codecov
    - name: Codecov - Upload coverage reports
      uses: codecov/codecov-action@v5
      if: ${{ job.status == 'success' }}
      continue-on-error: true
      with:
        token: ${{ (inputs.codecov-token || fromJSON(inputs.secrets).CODECOV_TOKEN) }}

    - name: Codecov - Upload test results
      uses: codecov/test-results-action@v1
      if: ${{ job.status == 'success' }}
      continue-on-error: true
      with:
        token: ${{ (inputs.codecov-token || fromJSON(inputs.secrets).CODECOV_TOKEN) }}

    # Gradle dependency
    - name: Java - Gradle dependency graph
      if: ${{ job.status == 'success' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
      uses: gradle/actions/dependency-submission@v4
      continue-on-error: true
      env:
        JAVA_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=1g"

    # Sonar
    - name: Sonar - Analyze with Sonar
      if: ${{ job.status == 'success' && inputs.run-sonar == 'true' && env.SONAR_TOKEN != '' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
      env:
        GITHUB_TOKEN: ${{ (inputs.github-auth-token || fromJSON(inputs.secrets).GITHUB_AUTH_TOKEN) }}
        SONAR_TOKEN: ${{ (inputs.sonar-token || fromJSON(inputs.secrets).SONAR_TOKEN) }}
      shell: bash
      continue-on-error: true
      run: ./gradlew sonar
