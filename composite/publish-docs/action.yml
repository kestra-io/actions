name: 'Publish docs'
description: 'Publish the repository docs folder as Notion pages'

inputs:
  notion-token:
    description: 'Notion integration token, with access to the parent page'
    required: true
  notion-parent-page-id:
    description: 'Page the per-repository pages live under'
    required: true
  path:
    description: 'Docs folder inside the repository'
    required: false
    default: 'docs'
  name:
    description: 'Page title for this repository, defaults to the repository name'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Node - Setup
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'

    - name: Docs - Publish to Notion
      shell: bash
      env:
        DOCS_PATH: ${{ inputs.path }}
        DOCS_NAME: ${{ inputs.name }}
        NOTION_TOKEN: ${{ inputs.notion-token }}
        NOTION_PARENT_PAGE_ID: ${{ inputs.notion-parent-page-id }}
      run: |
        set -euo pipefail

        if [ ! -d "$DOCS_PATH" ]; then
          echo "::notice::no '$DOCS_PATH' folder, nothing to publish"
          exit 0
        fi

        export DOCS_NAME="${DOCS_NAME:-${GITHUB_REPOSITORY##*/}}"
        export DOCS_DIR="$(mktemp -d)"

        # rsync takes .docsignore as-is, where a glob passed to another tool would need translating
        excludes=(--exclude=.docsignore)
        if [ -f "$DOCS_PATH/.docsignore" ]; then
          excludes+=(--exclude-from="$DOCS_PATH/.docsignore")
        fi

        rsync -a --prune-empty-dirs "${excludes[@]}" "$DOCS_PATH/" "$DOCS_DIR/"

        npm ci --prefix "$GITHUB_ACTION_PATH" --omit=dev --no-audit --no-fund
        node "$GITHUB_ACTION_PATH/sync.mjs"
