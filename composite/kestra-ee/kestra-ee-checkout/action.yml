name: 'Kestra Action to Checkout'
description: 'Composite action to checkout and prepare local file.'

inputs:
  gh-app-id:
    required: false
    default: ''
    description: GitHub App Client ID (pass secrets.GH_BOT_APP_ID from the caller workflow). Without it the OSS ref lookups use github.token.
  gh-app-private-key:
    required: false
    default: ''
    description: GitHub App private key (pass secrets.GH_BOT_PRIVATE_KEY from the caller workflow).

runs:
  using: composite
  steps:
    # The stack walk spends REST calls on every EE job; the app installation quota is far larger than github.token's.
    - name: Checkout - Generate GitHub App token
      id: app-token
      if: inputs.gh-app-id != '' && inputs.gh-app-private-key != ''
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.gh-app-id }}
        private-key: ${{ inputs.gh-app-private-key }}
        owner: kestra-io
        repositories: kestra,kestra-ee
        permission-contents: read
        permission-pull-requests: read

    - name: Checkout - Resolve OSS ref
      id: oss-ref
      uses: kestra-io/actions/actions/resolve-oss-ref@main
      with:
        github-token: ${{ steps.app-token.outputs.token || github.token }}

    # A same-name OSS branch that heads an open OSS PR is tested at that PR's simulated-merge ref, so
    # both EE and OSS are tested at their merge state.
    - name: Checkout - Get checkout branch from OSS
      id: checkout-branch
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        OSS_REF: ${{ steps.oss-ref.outputs.ref }}
        SAME_NAME: ${{ steps.oss-ref.outputs.same-name }}
        IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
      run: |
        # These probes run from the workspace root, outside the EE clone, so the credential
        # actions/checkout installs in kestra-ee/.git/config does not reach them. Anonymous git
        # is rate-limited per egress IP and the shared runner pool trips that limit, so github.com
        # answers 401 and the step dies on "could not read Username". Authenticate them instead.
        # Composed here rather than in env: so the URL is never echoed into the job log.
        OSS_REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/kestra-io/kestra.git"

        BRANCH_SHA=""
        if [[ "$IS_PULL_REQUEST" == "true" && "$SAME_NAME" == "true" ]]; then
          BRANCH_SHA=$(git ls-remote "$OSS_REMOTE" "refs/heads/$OSS_REF" | cut -f1)
        fi
        if [[ -n "$BRANCH_SHA" ]]; then
          OSS_PR_REF=$(git ls-remote "$OSS_REMOTE" 'refs/pull/*/head' \
            | { grep "^$BRANCH_SHA" || [ $? -eq 1 ]; } | sort -t'/' -k3 -n -r | head -1 | awk '{print $2}')

          if [[ -n "$OSS_PR_REF" ]]; then
            OSS_PR_NUMBER=$(echo "$OSS_PR_REF" | sed 's|refs/pull/||;s|/head||')
            if [[ -n "$(git ls-remote "$OSS_REMOTE" "refs/pull/$OSS_PR_NUMBER/merge")" ]]; then
              echo "same-name OSS branch $OSS_REF is the head of OSS PR #$OSS_PR_NUMBER, using its merge ref"
              echo "ossBranch=refs/pull/$OSS_PR_NUMBER/merge" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "OSS PR #$OSS_PR_NUMBER has conflicts, falling back to branch tip"
          fi
        fi

        echo "ossBranch=$OSS_REF" >> "$GITHUB_OUTPUT"

    - name: Checkout - OSS
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: kestra-io/kestra
        path: kestra
        ref: ${{ steps.checkout-branch.outputs.ossBranch }}

