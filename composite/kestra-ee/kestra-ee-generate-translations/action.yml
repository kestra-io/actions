name: Generate Translations
description: "Requires the environment variable GEMINI_API_KEY to be set. This action will generate translations for the EE UI."

inputs:
  github-token:
    description: 'GitHub Token'
    required: true
  retranslate_modified_keys:
    description: 'If true, forces a full re-translation of every key, ignoring the fingerprints'
    required: false
    default: false

runs:
  using: composite

  steps:
    - name: Checkout - EE
      uses: actions/checkout@v4
      with:
        path: kestra-ee
        ref: ${{ github.head_ref }}

    # The translation tooling is shared: EE's `scripts/translations/{generate,check}.ts` import the
    # implementation from OSS, resolved as a sibling checkout. Both the tooling and the OSS language
    # files are needed — the latter so the "no EE key redefines an OSS key" check can run.
    - name: Checkout - OSS
      uses: actions/checkout@v4
      with:
        repository: kestra-io/kestra
        path: kestra
        ref: ${{ github.base_ref }}
        sparse-checkout: |
          ui/scripts/translations/
          ui/src/translations/
        sparse-checkout-cone-mode: false

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: "24.x"

    - name: Install Node dependencies
      run: npm ci
      shell: bash
      working-directory: kestra-ee/ui-ee

    # `inputs.*`, not `github.event.inputs.*` — the latter is only populated for `workflow_dispatch`,
    # so on the `pull_request` runs this action is actually used for, the flag rendered empty and
    # never reached the script.
    #
    # The former `only_pr` input is gone: it selected keys by diffing against the PR's merge-base,
    # which the fingerprints now answer directly and without git. It never took effect anyway —
    # it was read from `github.event.inputs`, which is empty on `pull_request`.
    - name: Generate translations
      run: npm run translations:generate -- ${{ inputs.retranslate_modified_keys }}
      working-directory: kestra-ee/ui-ee
      shell: bash

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "24.x"

    # The dependency-free checker, not `scripts/translations/check.ts`: the latter goes through OSS's
    # `compareTranslations.ts`, which imports `@intlify/message-compiler` and so cannot resolve from
    # a sparse OSS checkout that has no `node_modules` — that is what made this step fail with
    # "Cannot find module '@intlify/message-compiler'". This one uses only Node builtins.
    #
    # Falls back to the pre-migration path so this action can merge before the kestra-ee PR that
    # moves the tooling. It is referenced `@main`, so it takes effect on every open EE PR the moment
    # it lands, including branches cut before that move.
    #
    # Release branches (e.g. releases/v1.3.x) predate the `.mjs` migration entirely: their checker
    # is `ui-ee/src/translations/check.ts`, which is itself Node-builtins-only (it does not go through
    # OSS `compareTranslations.ts`), so it runs cleanly here. It is informational on those branches
    # (it prints missing/extra keys but does not exit non-zero); on develop the `.mjs` checker above
    # is the enforcing one.
    - name: Check keys matching
      shell: bash
      working-directory: kestra-ee
      run: |
        if [ -f ui-ee/scripts/translations/check-translations.mjs ]; then
          node ui-ee/scripts/translations/check-translations.mjs --scope ee --oss-root ../kestra
        elif [ -f ui-ee/scripts/check-translations.mjs ]; then
          node ui-ee/scripts/check-translations.mjs --scope ee --oss-root ../kestra
        else
          npx --yes tsx ui-ee/src/translations/check.ts
        fi

    - name: Set up Git
      shell: bash
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "actions@github.com"

    - name: Check for changes and commit
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      shell: bash
      working-directory: kestra-ee
      run: |
        # The fingerprints record what each translation was generated from; committing the languages
        # without them would leave every regenerated key looking stale forever, so the next run would
        # translate it again and push the same change in a loop. Staged conditionally because a
        # branch cut before the fingerprints existed has no such file, and `git add` on a path that
        # matches nothing is an error.
        git add ui-ee/src/translations/ee_translations/*.json
        if [ -f ui-ee/scripts/translations/fingerprints.json ]; then
          git add ui-ee/scripts/translations/fingerprints.json
        fi
        if git diff --cached --quiet; then
          echo "No changes to commit. Exiting with success."
          exit 0
        fi
        git commit -m "chore(core): localize to languages other than english" -m "Extended localization support by adding translations for multiple languages using English as the base. This enhances accessibility and usability for non-English-speaking users while keeping English as the source reference."
        git push origin ${{ github.head_ref }}
