name: 'Setup Maven proxy'
description: >-
  Routes Gradle Maven reads through the GCP Artifact Registry maven-remote caching proxy to
  avoid Maven Central HTTP 429 rate-limiting on shared runner IPs. Writes a Gradle init script
  and exports MAVEN_REMOTE_TOKEN to the whole job so every subsequent Gradle step is covered.
  Also routes Kestra's runtime plugin downloader through the same proxy by exporting the
  kestra.plugins.repositories.central.* overrides. No-op when no credential is available.

  Authentication (SEC-2311): Workload Identity Federation with the read-only ci-reader service
  account whenever the job can mint a GitHub OIDC token (the caller grants `id-token: write`).
  Falls back to the gcp-service-account key when it cannot, or when the WIF exchange fails, so
  callers keep working while they migrate.

inputs:
  gcp-service-account:
    description: >-
      Deprecated fallback (SEC-2311): GCP service account key JSON, only used when no GitHub OIDC
      token is available or the WIF exchange fails. When both are missing, this action is a no-op
      and Gradle resolves from Maven Central.
    required: false
    default: ''
  workload-identity-provider:
    description: 'GCP Workload Identity Federation provider, used when the job can mint a GitHub OIDC token.'
    required: false
    default: 'projects/956000344026/locations/global/workloadIdentityPools/github/providers/github'
  service-account:
    description: 'Read-only service account impersonated through Workload Identity Federation.'
    required: false
    default: 'ci-reader@kestra-dev.iam.gserviceaccount.com'

runs:
  using: composite
  steps:
    - name: GCP - Check credentials availability
      id: gcp-check
      shell: bash
      run: |
        # ACTIONS_ID_TOKEN_REQUEST_URL is only set when the job is granted `id-token: write`.
        if [ "${{ inputs.workload-identity-provider != '' }}" = "true" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "oidc=true" >> "$GITHUB_OUTPUT"
        else
          echo "oidc=false" >> "$GITHUB_OUTPUT"
        fi
        echo "key=${{ inputs.gcp-service-account != '' }}" >> "$GITHUB_OUTPUT"

    - name: GCP - Auth with ci-reader (Workload Identity Federation)
      id: gcp-wif
      if: steps.gcp-check.outputs.oidc == 'true'
      # A failed exchange falls back to the key below instead of failing the job.
      continue-on-error: true
      uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093' # v3.0.0
      with:
        token_format: 'access_token'
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.service-account }}
        # Do not clobber GOOGLE_APPLICATION_CREDENTIALS: callers set it to a different
        # (unit-test) service account for their own build/test steps.
        export_environment_variables: false
        create_credentials_file: false

    - name: GCP - Auth with github service account (fallback)
      id: gcp-auth
      if: steps.gcp-check.outputs.key == 'true' && steps.gcp-wif.outputs.access_token == ''
      uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093' # v3.0.0
      with:
        token_format: 'access_token'
        credentials_json: ${{ inputs.gcp-service-account }}
        # Do not clobber GOOGLE_APPLICATION_CREDENTIALS: callers set it to a different
        # (unit-test) service account for their own build/test steps.
        export_environment_variables: false

    - name: GCP - Report authentication method
      shell: bash
      env:
        WIF_TOKEN: ${{ steps.gcp-wif.outputs.access_token != '' }}
        KEY_TOKEN: ${{ steps.gcp-auth.outputs.access_token != '' }}
      run: |
        if [ "$WIF_TOKEN" = "true" ]; then
          echo "::notice title=Maven proxy::authenticated with Workload Identity Federation (ci-reader)"
        elif [ "$KEY_TOKEN" = "true" ]; then
          echo "::warning title=Maven proxy::authenticated with the GCP_SERVICE_ACCOUNT key (SEC-2311). Grant 'id-token: write' to this job to use Workload Identity Federation."
        else
          echo "::notice title=Maven proxy::no GCP credential, Gradle resolves from Maven Central"
        fi

    - name: Setup - Gradle maven-remote init script
      if: ${{ steps.gcp-wif.outputs.access_token != '' || steps.gcp-auth.outputs.access_token != '' }}
      shell: bash
      env:
        MAVEN_REMOTE_ACCESS_TOKEN: ${{ steps.gcp-wif.outputs.access_token || steps.gcp-auth.outputs.access_token }}
      run: |
        mkdir -p ~/.gradle/init.d
        cat > ~/.gradle/init.d/maven-remote.gradle << 'EOF'
        def token = System.getenv("MAVEN_REMOTE_TOKEN") ?: ""

        // The GCP Artifact Registry "maven-remote" is a server-side caching mirror of Maven
        // Central: requests are proxied from Google IPs, never the shared runner IP, so it is
        // immune to the Maven Central HTTP 429 rate-limiting that fails CI plugin/dependency
        // resolution. Route Gradle Maven reads through it and stop touching raw Maven Central
        // (repo.maven.apache.org) and Sonatype releases, except the Sonatype snapshots repo
        // (see isRawPublic below), which hosts Kestra pre-release artifacts the mirror lacks.
        def injectProxy = { repos ->
            if (token && !repos.findByName("GcpMavenRemote")) {
                repos.maven {
                    name = "GcpMavenRemote"
                    url = "https://europe-maven.pkg.dev/kestra-host/maven-remote"
                    credentials { username = "oauth2accesstoken"; password = token }
                }
            }
        }

        // Neutralise raw public repos (Maven Central + Sonatype) wherever they are declared,
        // including ones added later by build scripts. We disable them via content filtering
        // rather than removing them: removal races with the root buildscript block, whereas an
        // "all {}" hook + excludeGroupByRegex is order- and timing-independent. An excluded repo
        // is never queried; the proxy (a Central mirror) serves the same content.
        // Sonatype SNAPSHOTS are intentionally NOT excluded. Kestra publishes pre-release
        // artifacts (e.g. io.kestra:platform:2.0.0-SNAPSHOT, needed by v2/SDK plugin branches)
        // only to central.sonatype.com/repository/maven-snapshots, and the maven-remote mirror
        // caches Central RELEASES, not Sonatype snapshots. It is restricted to io.kestra groups
        // (isSonatypeSnapshots below): otherwise Gradle also asks it for any artifact the repos
        // before it lack, e.g. org.opensaml (served by the Shibboleth repo declared after it), and a
        // Sonatype HTTP 429 there fails the whole resolution.
        def isRawPublic = { repo ->
            repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository &&
                repo.url != null &&
                (repo.url.toString().startsWith("https://repo.maven.apache.org") ||
                 (repo.url.toString().contains("central.sonatype.com") &&
                  !repo.url.toString().contains("maven-snapshots")))
        }
        def isSonatypeSnapshots = { repo ->
            repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository &&
                repo.url != null &&
                repo.url.toString().contains("central.sonatype.com") &&
                repo.url.toString().contains("maven-snapshots")
        }
        def kestraOnly = { repo -> repo.content { includeGroupByRegex "io\\.kestra(\\..*)?" } }
        // Plugin/buildscript repos: neutralise raw Central/Sonatype, and for the remaining maven
        // repos use the .pom only + ignore the .module redirect. Some plugins (artifactregistry,
        // owasp dependencycheck) publish Gradle Module Metadata whose .module the proxy does not
        // mirror and the Plugin Portal lacks, so Gradle would chase the .module back to Central and
        // 429. The Portal's .pom resolves them.
        def scrubPluginRepos = { repos ->
            repos.all { repo ->
                if (isRawPublic(repo)) {
                    repo.content { excludeGroupByRegex ".*" }
                } else if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
                    if (isSonatypeSnapshots(repo)) kestraOnly(repo)
                    repo.metadataSources { mavenPom(); ignoreGradleMetadataRedirection() }
                }
            }
        }
        // Project (main-dependency) repos: only neutralise raw Central/Sonatype. Keep Gradle Module
        // Metadata so library variant/capability resolution stays correct — the proxy mirrors the
        // .module for normal Central-hosted libraries.
        def scrubDependencyRepos = { repos ->
            repos.all { repo ->
                if (isRawPublic(repo)) {
                    repo.content { excludeGroupByRegex ".*" }
                } else if (isSonatypeSnapshots(repo)) {
                    kestraOnly(repo)
                }
            }
        }

        beforeSettings { settings ->
            injectProxy(settings.pluginManagement.repositories)
            // Keep the Gradle Plugin Portal for plugin markers/impls not mirrored by Central.
            // (Touching pluginManagement.repositories drops the implicit default; its real name
            // is "Gradle Central Plugin Repository".)
            if (!settings.pluginManagement.repositories.findByName("Gradle Central Plugin Repository")) {
                settings.pluginManagement.repositories.gradlePluginPortal()
            }
            // Intentionally NO mavenCentral() here — neutralise it if a settings script adds one.
            scrubPluginRepos(settings.pluginManagement.repositories)
        }
        if (token) {
            allprojects {
                injectProxy(buildscript.repositories)
                scrubPluginRepos(buildscript.repositories)
                injectProxy(repositories)
                scrubDependencyRepos(repositories)
            }
        }
        EOF
        # Export the token to the whole job so every subsequent Gradle step (build,
        # publish, javadoc, ...) resolves through the proxy — not just one step's env.
        echo "MAVEN_REMOTE_TOKEN=${MAVEN_REMOTE_ACCESS_TOKEN}" >> "$GITHUB_ENV"
        # Route Kestra's runtime plugin downloader (MavenPluginDownloader) through the same
        # proxy. Micronaut binds these onto kestra.plugins.repositories.central.{url,basic-auth},
        # overriding the Maven Central default that test/app configs ship with. This is CI-only:
        # locally the token and these vars are absent, so configs keep resolving from Central.
        {
          echo "KESTRA_PLUGINS_REPOSITORIES_CENTRAL_URL=https://europe-maven.pkg.dev/kestra-host/maven-remote"
          echo "KESTRA_PLUGINS_REPOSITORIES_CENTRAL_BASIC_AUTH_USERNAME=oauth2accesstoken"
          echo "KESTRA_PLUGINS_REPOSITORIES_CENTRAL_BASIC_AUTH_PASSWORD=${MAVEN_REMOTE_ACCESS_TOKEN}"
        } >> "$GITHUB_ENV"
