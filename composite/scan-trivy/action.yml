name: 'Trivy Scan'
description: 'Scan dependencies with trivy on the default branch and releases/*, shipped to Elastic'

# Scans only where the findings are kept: the default branch and releases/*. A pull request or a
# feature branch is not scanned, so it neither comments nor writes to Elastic. The branch is part of
# each vulnerability id, so every scanned branch keeps its own state in Elastic.

inputs:
  scan-type:
    description: 'Trivy scan type: `fs` for a lockfile or directory (npm package-lock.json), `sbom` for a CycloneDX/SPDX file'
    required: false
    default: "fs"

  scan-path:
    description: 'The file or directory to scan, e.g. ./ui/package-lock.json or build/reports/cyclonedx/bom.json'
    required: true

  github-token:
    description: 'Token used to publish the check run'
    required: false
    default: ${{ github.token }}

  check-name:
    description: 'Name of the check run'
    required: false
    default: 'Trivy'

  check-failed-conclusion:
    description: 'Conclusion of the check run when a vulnerability is found: neutral, failure or action_required'
    required: false
    default: 'neutral'

  elastic-endpoint:
    description: 'Elastic ingest endpoint, the OTLP_ENDPOINT secret. Leave empty to skip shipping'
    required: false
    default: ''

  elastic-headers:
    description: 'Elastic ingest headers, the OTLP_HEADERS secret'
    required: false
    default: ''

  metadata:
    description: 'Newline separated key=value pairs added to every finding, e.g. component=plugin. service.name defaults to the repository name and can be overridden here. A dotted key is written at that path, an undotted one lands under labels.'
    required: false
    default: ''

  components:
    description: >-
      Newline separated component=glob pairs, e.g. frontend=ui/** then backend=**. Every finding gets
      the component of the first glob the scanned file (scan-path) matches, overriding the
      component= in metadata
    required: true

  dry-run:
    description: 'Build the Elastic payload without sending it'
    required: false
    default: 'false'

outputs:
  json-file:
    description: 'Absolute path to the Trivy JSON report, the one shipped to Elastic'
    value: ${{ github.workspace }}/trivy-result.json

  sarif-file:
    description: 'Absolute path to the same report rendered as SARIF'
    value: ${{ github.workspace }}/trivy-result.sarif

runs:
  using: composite
  steps:
    - name: Trivy - Create custom temp directory
      if: ${{ (github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'releases/')) }}
      shell: bash
      run: |
        mkdir -p ${{ github.workspace }}/trivy-tmp

    - name: Trivy - Run Trivy scanner
      if: ${{ (github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'releases/')) }}
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      id: trivy
      env:
        TMPDIR: ${{ github.workspace }}/trivy-tmp
        TRIVY_CACHE_DIR: ${{ github.workspace }}/.trivy-cache
      with:
        scan-type: ${{ inputs.scan-type }}
        scan-ref: ${{ inputs.scan-path }}
        format: 'json'
        output: ${{ github.workspace }}/trivy-result.json

    # The scan above already did the work; `convert` re-renders that report rather than scanning a
    # second time. Only the `sarif-file` output needs it, as report-sarif below reads the JSON.
    # trivy-action installs the binary via setup-trivy, so it is on PATH here.
    - name: Trivy - Convert the report to SARIF
      shell: bash
      if: ${{ !cancelled() && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'releases/')) }}
      continue-on-error: true
      run: |
        set -euo pipefail
        if ! command -v trivy >/dev/null; then
          echo "::warning::trivy is not on PATH, skipping the SARIF conversion"
          exit 0
        fi
        trivy convert --quiet --format sarif \
          --output "${{ github.workspace }}/trivy-result.sarif" \
          "${{ github.workspace }}/trivy-result.json"

    - name: Trivy - Publish check run
      if: ${{ !cancelled() && steps.trivy.outcome == 'success' }}
      continue-on-error: true
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        CHECK_NAME: ${{ inputs.check-name }}
        FAILED_CONCLUSION: ${{ inputs.check-failed-conclusion }}
        TARGET: ${{ inputs.scan-path }}
        REPORT: ${{ github.workspace }}/trivy-result.json
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs')
          const report = JSON.parse(fs.readFileSync(process.env.REPORT, 'utf8'))
          const vulns = (report.Results ?? []).flatMap(r => (r.Vulnerabilities ?? []).map(v => ({ ...v, target: r.Target })))
          const counts = {}
          for (const v of vulns) counts[v.Severity] = (counts[v.Severity] ?? 0) + 1
          const order = ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW', 'UNKNOWN']
          const breakdown = order.filter(s => counts[s]).map(s => `${counts[s]} ${s.toLowerCase()}`).join(', ')
          const rows = vulns
            .sort((a, b) => order.indexOf(a.Severity) - order.indexOf(b.Severity))
            .slice(0, 50)
            .map(v => `| ${v.Severity} | ${v.VulnerabilityID} | \`${v.PkgName}\` | ${v.InstalledVersion} | ${v.FixedVersion ?? ''} |`)
          const summary = vulns.length === 0
            ? `No vulnerability found in \`${process.env.TARGET}\`.`
            : [`Found **${vulns.length}** vulnerabilities in \`${process.env.TARGET}\`: ${breakdown}.`, '',
               '| Severity | Id | Package | Installed | Fixed |', '| :--- | :--- | :--- | :--- | :--- |', ...rows,
               ...(vulns.length > 50 ? ['', `_… and ${vulns.length - 50} more._`] : [])].join('\n')
          await github.rest.checks.create({
            ...context.repo,
            name: process.env.CHECK_NAME,
            head_sha: context.payload.pull_request?.head?.sha ?? context.sha,
            status: 'completed',
            conclusion: vulns.length > 0 ? process.env.FAILED_CONCLUSION : 'success',
            output: { title: `${vulns.length} vulnerabilities`, summary }
          })

    - name: Trivy - Report findings to Elastic
      if: ${{ !cancelled() && inputs.elastic-endpoint != '' && steps.trivy.outcome == 'success' }}
      continue-on-error: true
      uses: kestra-io/actions/actions/report-sarif@main
      with:
        # The native JSON, not the SARIF the composite also produces: SARIF drops the advisory
        # database, the publication date and the per-vendor CVSS, which the Elastic flyout shows.
        sarif-files: ${{ github.workspace }}/trivy-result.json
        type: vulnerabilities
        elastic-endpoint: ${{ inputs.elastic-endpoint }}
        elastic-headers: ${{ inputs.elastic-headers }}
        dry-run: ${{ inputs.dry-run }}
        metadata: |
          service.name=${{ github.event.repository.name }}
          ${{ inputs.metadata }}
        components: ${{ inputs.components }}
        components-path: ${{ inputs.scan-path }}
