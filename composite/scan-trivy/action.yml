name: 'Trivy Scan'
description: 'Scan with trivy and output result'

inputs:
  scan-type:
    description: 'Does we push to private maven registry'
    required: false
    default: "rootfs"

  scan-path:
    description: 'The file mask that will be scanned'
    required: false
    default: "*/build/libs/*.jar"

  secrets:
    description: 'Secrets passed as toJSON'
    required: true

outputs:
  json-file:
    description: 'Absolute path to the Trivy JSON report, the one the pull request comment renders'
    value: ${{ github.workspace }}/trivy-result.json

  sarif-file:
    description: 'Absolute path to the same report rendered as SARIF'
    value: ${{ github.workspace }}/trivy-result.sarif

runs:
  using: composite
  steps:
    - name: Trivy - Create custom temp directory
      shell: bash
      run: |
        mkdir -p ${{ github.workspace }}/trivy-tmp

    - name: Trivy - Copy template and files to scan
      shell: bash
      run: |
        mkdir -p /tmp/trivy-scan
        find -type f -wholename '${{ inputs.scan-path }}' -exec cp "{}" /tmp/trivy-scan  \;
        ls -lh /tmp/trivy-scan/

    - name: Trivy - Run Trivy scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      id: trivy
      env:
        TMPDIR: ${{ github.workspace }}/trivy-tmp
        TRIVY_CACHE_DIR: ${{ github.workspace }}/.trivy-cache
      with:
        scan-type: ${{ inputs.scan-type }}
        scan-ref: /tmp/trivy-scan
        format: 'json'
        output: "${{ github.workspace }}/trivy-result.json"

    # The scan above already did the work; `convert` re-renders that report rather than scanning a
    # second time. SARIF is what report-sarif reads, while the comment below keeps rendering the
    # JSON — one scan, two outputs. trivy-action installs the binary via setup-trivy, so it is on
    # PATH here.
    - name: Trivy - Convert the report to SARIF
      shell: bash
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: |
        set -euo pipefail
        if ! command -v trivy >/dev/null; then
          echo "::warning::trivy is not on PATH, skipping the SARIF conversion"
          exit 0
        fi
        trivy convert --quiet --format sarif \
          --output "${{ github.workspace }}/trivy-result.sarif" \
          "${{ github.workspace }}/trivy-result.json"

    - name: Trivy - Count vulnerabilities
      id: count
      shell: bash
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: |
        set -euo pipefail
        total=""
        if [ -f "${{ github.workspace }}/trivy-result.json" ]; then
          total=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "${{ github.workspace }}/trivy-result.json")
        fi
        echo "total=${total}" >> "$GITHUB_OUTPUT"

    - name: Artifacts - Comment pull request
      uses: kestra-io/actions/actions/comment-update@main
      continue-on-error: true
      with:
        github-token: ${{ fromJSON(inputs.secrets).GITHUB_TOKEN }}
        title: "🛡 Trivy"
        result: ${{ steps.count.outputs.total == '' && 'empty' || (steps.count.outputs.total > 0 && 'warning' || 'success') }}
        title-summary: ${{ steps.count.outputs.total != '' && format('{0} vulnerabilities', steps.count.outputs.total) || '' }}
        files: |
          ${{ github.workspace }}/trivy-result.json
        template: |
          {% if files[0] and files[0].Results | length > 0 %}
          {%- for suite in files[0].Results %}
          {% if suite.Vulnerabilities | length > 0 %}
          ####  Vulnerability in: `{{ suite.Target }}`

          | Vulnerability | Severity | Package | Installed Version | Fixed Version |
          | :--- | :--- | :--- | :--- | :--- |
          {%- for vulnerability in suite.Vulnerabilities %}
          | [{{ vulnerability.VulnerabilityID }}]({{ vulnerability.PrimaryURL }}) | {{ vulnerability.Severity }} | {{ vulnerability.PkgName }} | {{ vulnerability.InstalledVersion }} | {{ vulnerability.FixedVersion }} |          
          {%- endfor %}
          {% endif %}
          {%- endfor %}
          {% endif %}
