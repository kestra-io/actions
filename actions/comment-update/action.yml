name: Comment Update
description: Create or update a comment in a pull request

runs:
  using: node24
  main: dist/index.js

inputs:
  github-token:
    description: The github token to use
    required: true

  title:
    description: The sections title
    required: true

  result:
    description: 'Status shown as an emoji before the title: success, failure, warning or empty (no data). Rendered as a handlebars template against the same data as `template`'
    required: false

  title-summary:
    description: Short text added after the title between (), e.g. the number of failing tests. Rendered as a handlebars template against the same data as `template`
    required: false

  template:
    description: The handlebars template to use for the comment
    required: true

  check-run:
    description: 'Also publish a check run when title-summary is not empty: named after the title without its leading emoji, the summary in its title, the rendered comment as body, the conclusion derived from `result` (success, failure, warning is neutral, empty is skipped). Works without a pull request, then only the check run is published'
    required: false
    default: 'false'

  check-annotations:
    description: 'Path to a JSON array of check run annotations (path, start_line, end_line, annotation_level, message, title), attached to the check run. Needs check-run'
    required: false

  skip-failure:
    description: 'Publish the check run as neutral instead of failure when result is failure, so it does not block'
    required: false
    default: 'false'

  fetch-artifact:
    description: Does we fetch the artifact from the workflow run
    required: false
    default: 'false'

  fetch-unreleased-commits:
    description: Does we fetch the unreleased commits
    required: false
    default: 'false'

  add-summary:
    description: Does we add a summary section
    required: false
    default: 'true'

  files:
    description: The files to inject as data in the template
    required: false

  owner:
    description: Override repository owner (defaults to current repo owner). Required when the event is not a pull_request, e.g. repository_dispatch.
    required: false

  repo:
    description: Override repository name (defaults to current repo). Required when the event is not a pull_request, e.g. repository_dispatch.
    required: false

  issue-number:
    description: Override PR/issue number (defaults to context PR number). Required when the event is not a pull_request, e.g. repository_dispatch.
    required: false

outputs:
  comment-id:
    description: The comment id that was created or updated

