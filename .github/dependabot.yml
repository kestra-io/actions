version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/actions/**"
      - "/composite/**"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directories:
      - "/actions/*"
      - "/shared/*"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    groups:
      npm:
        patterns:
          - "*"
    labels:
      - dependencies
    open-pull-requests-limit: 5
