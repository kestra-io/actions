name: Frontend tests

on:
  workflow_call:
    inputs:
      ee-ref:
        description: >-
          kestra-ee ref to check out. Empty (the default) checks out the ref of the
          calling workflow's own event.
        type: string
        required: false
        default: ""
      oss-ref:
        description: >-
          OSS ref to check out. Empty (the default) resolves it from the calling
          workflow's context via the kestra-ee-checkout composite.
        type: string
        required: false
        default: ""
      pr-reporting:
        description: >-
          Report lint findings and UI-test failures onto a pull request of the
          calling repository. Turn this off for runs that have no PR of their own —
          e.g. a repository_dispatch driven by an OSS PR, where there is nothing in
          kestra-ee to comment on. The whole suite still runs either way; only the
          reporting channel changes, and lint failures then surface as a failed step
          instead of as review comments.
        type: boolean
        required: false
        default: true
    secrets:
      CODECOV_TOKEN:
        description: "The Codecov token."
        required: false

env:
  OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}

jobs:
  check:
    name: Check
    runs-on: kestra-private-standard
    timeout-minutes: 60
    steps:
      # Checkout
      - name: Checkout - EE
        uses: actions/checkout@v5
        with:
          path: kestra-ee
          # An empty ref is actions/checkout's default, i.e. the ref of the event
          # that started the calling workflow.
          ref: ${{ inputs.ee-ref }}

      - name: Checkout - OSS
        uses: kestra-io/actions/composite/kestra-ee/kestra-ee-checkout@main
        with:
          oss-ref: ${{ inputs.oss-ref }}

      - name: setup build
        uses: kestra-io/actions/composite/setup-build@main
        with:
          node-enabled: true
          node-version: '24.x'

      - name: Setup - OpenTelemetry
        uses: kestra-io/actions/actions/otel-collect@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          host-metrics-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"

      - name: Cache - OSS Node Modules
        id: cache-oss-node-modules
        uses: actions/cache@v4
        with:
          path: kestra/ui/node_modules
          key: modules-oss-${{ hashFiles('kestra/ui/package-lock.json') }}

      - name: Cache - EE Node Modules
        id: cache-ee-node-modules
        uses: actions/cache@v4
        with:
          path: kestra-ee/ui-ee/node_modules
          key: modules-ee-${{ hashFiles('kestra-ee/ui-ee/package-lock.json') }}

      - name: Cache - Playwright Binaries
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('kestra-ee/ui-ee/package-lock.json') }}

      # Hack npm install install from oss
      - name: Npm - Hack install from oss
        if: steps.cache-oss-node-modules.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd kestra/ui
          npm ci

      - name: Npm - Install
        if: steps.cache-ee-node-modules.outputs.cache-hit != 'true'
        shell: bash
        working-directory: kestra-ee/ui-ee
        run: npm ci

      - name: Npm - Check types
        shell: bash
        working-directory: kestra-ee/ui-ee
        run: npm run check:types

      - name: Npm - Lint (oxlint)
        shell: bash
        working-directory: kestra-ee/ui-ee
        run: npx oxlint@latest

      - name: Npm - Lint (eslint)
        if: ${{ inputs.pr-reporting }}
        uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          workdir: "kestra-ee/ui-ee"

      # Same lint, minus the review-comment reporter, for runs with no PR of their
      # own. reviewdog's github-pr-review reporter needs a pull_request event.
      - name: Npm - Lint (eslint, no PR reporter)
        if: ${{ !inputs.pr-reporting }}
        shell: bash
        working-directory: kestra-ee/ui-ee
        run: npx eslint

      - name: Run front-end unit tests
        shell: bash
        working-directory: kestra-ee/ui-ee
        run: npm run test:unit

      - name: Storybook - Install Playwright
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        shell: bash
        working-directory: kestra-ee/ui-ee
        run: npx playwright install --with-deps

      - name: Run Storybook component tests
        shell: bash
        working-directory: kestra-ee/ui-ee
        run: npm run test:storybook

      # Runs on success too (not just failure): that's what lets it clear a
      # stale failures comment once the suite goes back to green.
      - name: Report failing UI tests on the PR
        if: ${{ always() && inputs.pr-reporting }}
        uses: kestra-io/actions/composite/report-ui-test-failures@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-path: kestra-ee/ui-ee
          repo-path: ui-ee
          unit-report-path: kestra-ee/ui-ee/test-report.junit.xml
          storybook-report-path: kestra-ee/ui-ee/test-report.storybook.junit.xml
