name: Frontend tests

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        description: "The Codecov token."
        required: false
      OTLP_ENDPOINT:
        description: 'OTLP endpoint for OpenTelemetry export'
        required: false
      OTLP_HEADERS:
        description: 'OTLP headers for OpenTelemetry export'
        required: false

env:
  OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}

jobs:
  check:
    name: Check
    runs-on: kestra-private-4cpu-4gb
    timeout-minutes: 60
    steps:
      # Checkout
      - name: Checkout - EE
        uses: actions/checkout@v5
        with:
          path: kestra-ee

      - name: Checkout - OSS
        uses: kestra-io/actions/composite/kestra-ee/kestra-ee-checkout@main

      - name: setup build
        uses: kestra-io/actions/composite/setup-build@main
        with:
          node-enabled: true
          node-version: '24.x'

      - name: Setup - OpenTelemetry
        uses: kestra-io/actions/actions/otel-instrument@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          host-metrics-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"

      - name: Cache - OSS Node Modules
        id: cache-oss-node-modules
        uses: actions/cache@v4
        with:
          path: kestra/ui/node_modules
          key: modules-oss-${{ hashFiles('kestra/ui/package-lock.json') }}

      - name: Cache - EE Node Modules
        id: cache-ee-node-modules
        uses: actions/cache@v4
        with:
          path: kestra-ee/ui-ee/node_modules
          key: modules-ee-${{ hashFiles('kestra-ee/ui-ee/package-lock.json') }}

      - name: Cache - Playwright Binaries
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('kestra-ee/ui-ee/package-lock.json') }}

      # OSS and EE npm ci target separate directories/lockfiles — independent.
      - parallel:
          # Hack npm install install from oss
          - name: Npm - Hack install from oss
            if: steps.cache-oss-node-modules.outputs.cache-hit != 'true'
            shell: bash
            run: |
              cd kestra/ui
              npm ci

          - name: Npm - Install
            if: steps.cache-ee-node-modules.outputs.cache-hit != 'true'
            shell: bash
            working-directory: kestra-ee/ui-ee
            run: npm ci

      # Runs concurrently with the checks below and is only waited on right before Storybook
      # needs it — it's a pure download (browser binaries + apt deps). Must start after the EE
      # npm ci above (npx resolves the pinned Playwright version from node_modules), which is
      # already guaranteed since parallel: blocks wait for all their steps before continuing.
      - name: Storybook - Install Playwright
        id: playwright-install
        background: true
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        shell: bash
        working-directory: kestra-ee/ui-ee
        run: npx playwright install --with-deps

      - parallel:
          - name: Npm - Check types
            shell: bash
            working-directory: kestra-ee/ui-ee
            run: npm run check:types

          - name: Npm - Lint (oxlint)
            shell: bash
            working-directory: kestra-ee/ui-ee
            run: npx oxlint@latest

          - name: Npm - Lint (eslint)
            uses: reviewdog/action-eslint@v1
            with:
              github_token: ${{ secrets.GITHUB_TOKEN }}
              reporter: github-pr-review
              workdir: "kestra-ee/ui-ee"

      - name: Run front-end unit tests
        shell: bash
        working-directory: kestra-ee/ui-ee
        run: npm run test:unit

      - name: Storybook - Wait for Playwright install
        wait: [playwright-install]

      - name: Run Storybook component tests
        shell: bash
        working-directory: kestra-ee/ui-ee
        run: npm run test:storybook

      # Runs on success too (not just failure): that's what lets it clear a
      # stale failures comment once the suite goes back to green.
      - name: Report failing UI tests on the PR
        if: always()
        uses: kestra-io/actions/composite/report-ui-test-failures@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-path: kestra-ee/ui-ee
          repo-path: ui-ee
          unit-report-path: kestra-ee/ui-ee/test-report.junit.xml
          storybook-report-path: kestra-ee/ui-ee/test-report.storybook.junit.xml
