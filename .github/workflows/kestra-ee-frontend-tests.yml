name: Frontend tests

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        description: "The Codecov token."
        required: false
      OTLP_ENDPOINT:
        description: 'OTLP endpoint for OpenTelemetry export'
        required: false
      OTLP_HEADERS:
        description: 'OTLP headers for OpenTelemetry export'
        required: false

env:
  OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}

jobs:
  check:
    name: Check
    runs-on: kestra-private-4cpu-8gb
    timeout-minutes: 60
    steps:
      # Run first, before checkout, so setup time is captured by the trace/host metrics.
      - name: Setup - OpenTelemetry
        uses: kestra-io/actions/actions/otel-instrument@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          host-metrics-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"

      # Checkout
      - name: Checkout - EE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: kestra-ee

      - name: Checkout - OSS
        uses: kestra-io/actions/composite/kestra-ee/kestra-ee-checkout@main

      - name: setup build
        uses: kestra-io/actions/composite/setup-build@main
        with:
          node-enabled: true
          node-version: '24.x'

      - name: Cache - OSS Node Modules
        id: cache-oss-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: kestra/ui/node_modules
          key: modules-oss-${{ hashFiles('kestra/ui/package-lock.json') }}

      - name: Cache - EE Node Modules
        id: cache-ee-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: kestra-ee/ui-ee/node_modules
          key: modules-ee-${{ hashFiles('kestra-ee/ui-ee/package-lock.json') }}

      - name: Cache - Playwright Binaries
        id: cache-playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('kestra-ee/ui-ee/package-lock.json') }}

      # OSS and EE npm ci target separate directories/lockfiles — independent.
      - parallel:
          # Hack npm install install from oss
          - name: Npm - Hack install from oss
            if: steps.cache-oss-node-modules.outputs.cache-hit != 'true'
            shell: bash
            run: |
              cd kestra/ui
              npm ci

          - name: Npm - Install
            if: steps.cache-ee-node-modules.outputs.cache-hit != 'true'
            shell: bash
            working-directory: kestra-ee/ui-ee
            run: npm ci

      # Runs concurrently with the checks below and is only waited on right before Storybook
      # needs it — it's a pure download (browser binaries + apt deps). Must start after the EE
      # npm ci above (npx resolves the pinned Playwright version from node_modules), which is
      # already guaranteed since parallel: blocks wait for all their steps before continuing.
      - name: Storybook - Install Playwright
        id: playwright-install
        background: true
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        shell: bash
        working-directory: kestra-ee/ui-ee
        run: npx playwright install --with-deps

      # Hoisted out of `precheck:types`, which is where it used to run: the unit tests import
      # @kestra-io/kestra-sdk through its dist, so both steps below need it built beforehand.
      # Split in two so each side can be skipped on its own: release branches pin this workflow
      # at @main and predate the scripts, same as `check:ts-any` below.
      - name: Npm - Bundle the SDK (OSS)
        if: hashFiles('kestra/ui/scripts/ensure-sdk.mjs') != ''
        shell: bash
        working-directory: kestra-ee/ui-ee
        run: node ../../kestra/ui/scripts/ensure-sdk.mjs

      - name: Npm - Bundle the SDK (EE)
        if: hashFiles('kestra-ee/ui-ee/scripts/ensure-sdk.mjs') != ''
        shell: bash
        working-directory: kestra-ee/ui-ee
        run: node scripts/ensure-sdk.mjs

      # Release branches pin this workflow at @main and predate the rule, with neither the config
      # nor stylelint installed. Same guard as OSS, where only the lockfile test separates them.
      - name: Npm - can stylelint run here
        id: stylelint-available
        shell: bash
        working-directory: kestra-ee/ui-ee
        run: |
          if [ -f stylelint.config.mjs ] && grep -q '"node_modules/stylelint":' package-lock.json; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "stylelint is not installed here, so the token rule has nothing to run."
          fi

      # oxlint-action runs `git fetch origin <base>` at the workspace root, which holds two checkouts
      # but no repo. Give it one whose origin is the local EE clone until the action scopes that fetch.
      - name: Oxlint - Root git repo for the action's base fetch
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git -C kestra-ee branch -f "$BASE_REF" HEAD
          rm -rf .git
          git init -q .
          git remote add origin "file://$GITHUB_WORKSPACE/kestra-ee"

      # The unit tests share this group with the type check so the two longest steps overlap.
      # Nothing in the group writes what another step reads now that the SDK is built above.
      - parallel:
          - name: Run front-end unit tests
            shell: bash
            working-directory: kestra-ee/ui-ee
            run: npm run test:unit

          - name: Npm - Check types
            shell: bash
            working-directory: kestra-ee/ui-ee
            run: npm run check:types

          - name: Npm - check ts-any
            shell: bash
            working-directory: kestra-ee/ui-ee
            # --if-present: release branches pin this workflow at @main and predate the script.
            run: npm run check:ts-any --if-present

          # fail_level matches oxlint below, which also fails on error; eslint only comments.
          # nofilter: the dead tokens it finds sit on lines no PR touches (kestra-io/kestra-ee#10820).
          - name: Npm - Lint (stylelint)
            if: ${{ github.event_name == 'pull_request' && steps.stylelint-available.outputs.run == 'true' }}
            uses: reviewdog/action-stylelint@141932ac62d4ea66e15b79de824ff44d0def0b0b # v1.33.0
            with:
              github_token: ${{ secrets.GITHUB_TOKEN }}
              workdir: kestra-ee/ui-ee
              stylelint_input: "{src,tests}/**/*.{vue,scss,css}"
              reporter: github-pr-review
              filter_mode: nofilter
              fail_level: error

          - name: Npm - Lint (oxlint)
            uses: oxc-project/oxlint-action@b78c21302e4bc637e83927135c35a6684de1053e # v3.1.0
            with:
              working-directory: kestra-ee/ui-ee
              all-files: true

          # reporter: github-pr-review only has somewhere to post on a pull_request run. On a
          # push or dispatch build reviewdog prints "this is not PullRequest build" and drops every
          # finding, so the only thing the step can still do there is fail the job when its own
          # installer hiccups ("unable to find 'v0.21.1'" -> "reviewdog: command not found" -> exit
          # 127), which is exactly what turned the frontend job red on releases/v2.0.x in both repos
          # on 2026-09-14. Keep it where it reports, skip it where it cannot.
          - name: Npm - Lint (eslint)
            if: ${{ github.event_name == 'pull_request' }}
            uses: reviewdog/action-eslint@5eb89b1e6e94ca33e91c3814c34b25a8370bba46 # v1.35.0
            with:
              github_token: ${{ secrets.GITHUB_TOKEN }}
              reporter: github-pr-review
              workdir: "kestra-ee/ui-ee"

      # OpenGrep static analysis.
      - name: OpenGrep - Static analysis
        id: opengrep
        if: ${{ !cancelled() }}
        uses: kestra-io/actions/composite/scan-opengrep@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          scan-path: kestra-ee/ui-ee

      - name: Storybook - Wait for Playwright install
        wait: [playwright-install]

      - name: Run Storybook component tests
        shell: bash
        working-directory: kestra-ee/ui-ee
        run: npm run test:storybook

      # Runs on success too (not just failure): that's what lets it clear a
      # stale failures comment once the suite goes back to green.
      - name: Report failing UI tests on the PR
        if: always()
        uses: kestra-io/actions/composite/report-ui-test-failures@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-path: kestra-ee/ui-ee
          repo-path: ui-ee
          unit-report-path: kestra-ee/ui-ee/test-report.junit.xml
          storybook-report-path: kestra-ee/ui-ee/test-report.storybook.junit.xml
