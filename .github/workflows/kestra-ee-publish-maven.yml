name: Publish - Maven

on:
  workflow_call:
    secrets:
      GCP_SERVICE_ACCOUNT:
        required: true
      OTLP_ENDPOINT:
        description: 'OTLP endpoint for OpenTelemetry export'
        required: false
      OTLP_HEADERS:
        description: 'OTLP headers for OpenTelemetry export'
        required: false
    inputs:
      java-version:
        description: "Java version"
        type: string
        default: '21'
        required: false

env:
  OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}

jobs:
  maven:
    name: Publish - Maven
    runs-on: kestra-private-4cpu-8gb
    env:
      COREPACK_INTEGRITY_KEYS: 0
    steps:
      # Run first, before checkout, so setup time is captured by the trace/host metrics.
      - name: Setup - OpenTelemetry
        uses: kestra-io/actions/actions/otel-instrument@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          host-metrics-enabled: 'true'
          gradle-tracing-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"

      # Checkout
      - name: Checkout - EE
        uses: actions/checkout@v5
        with:
          path: kestra-ee

      - name: Checkout - OSS
        uses: kestra-io/actions/composite/kestra-ee/kestra-ee-checkout@main

      - name: setup init
        uses: kestra-io/actions/composite/setup-build@main
        with:
          java-enabled: 'true'
          node-enabled: 'true'
          java-version: ${{ inputs.java-version }}

      - name: Setup - Maven proxy
        uses: kestra-io/actions/composite/kestra-ee/setup-maven-proxy@main
        with:
          gcp-service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # Google Auth
      - name: GCP - Auth with github service account
        id: auth
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      # OSS npm ci and EE npm install target separate directories/lockfiles and are otherwise
      # independent, but this runner's memory limit (kestra-private-4cpu-4gb, currently 3.5Gi)
      # is already below the ~8-12GB this frontend build needs run sequentially. Running the two
      # installs concurrently stacks their peaks on top of each other and reliably saturates the
      # cgroup memory limit, hanging the job until GitHub kills it as unresponsive. Keep these
      # sequential until the runner gets more memory.
      - name: Build frontend - OSS npm ci
        shell: bash
        working-directory: kestra/ui
        run: npm ci

      - name: Build frontend - EE npm install
        shell: bash
        working-directory: kestra-ee/ui-ee
        run: npm install

      - name: Build frontend - EE build
        shell: bash
        working-directory: kestra-ee/ui-ee
        run: npm run build

      # Publish
      - name: Publish - Release package with Gradle
        working-directory: kestra-ee
        run: ./gradlew publish --console=plain
        env:
          NODE_OPTIONS: "--max-old-space-size=4096" # required by kestra 1.0.X using vite and not rolldown-vite

      # Gradle dependency
      - name: Java - Gradle dependency graph
        if: ${{ github.ref == 'refs/heads/develop' }}
        uses: gradle/actions/dependency-submission@v4
        with:
          build-root-directory: kestra-ee
