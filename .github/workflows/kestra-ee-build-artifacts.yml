name: Build Artifacts

on:
  workflow_call:
    secrets:
      GOOGLE_SERVICE_ACCOUNT:
        description: "The Google Service Account."
        required: true
      GCP_SERVICE_ACCOUNT:
        description: "The GCP service account used to authenticate to the maven-remote Artifact Registry proxy."
        required: false
      CODECOV_TOKEN:
        description: 'Codecov Token'
        required: true
      OTLP_ENDPOINT:
        description: 'OTLP endpoint for OpenTelemetry export'
        required: false
      OTLP_HEADERS:
        description: 'OTLP headers for OpenTelemetry export'
        required: false
    inputs:
      java-version:
        description: "Java version"
        type: string
        default: '21'
        required: false

env:
  OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}

jobs:
  build-artifacts:
    name: Build Jar
    runs-on: kestra-private-4cpu-8gb
    env:
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
      COREPACK_INTEGRITY_KEYS: 0
    steps:
      # Run first, before checkout, so setup time is captured by the trace/host metrics.
      - name: OpenTelemetry - Setup
        uses: kestra-io/actions/actions/otel-instrument@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          host-metrics-enabled: 'true'
          gradle-tracing-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"

      # Google Auth
      - name: GCP - Auth with unit test account
        id: auth
        if: ${{ env.GOOGLE_SERVICE_ACCOUNT != 0 }}
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: '${{ env.GOOGLE_SERVICE_ACCOUNT }}'

      # Checkout
      - name: Checkout - EE
        uses: actions/checkout@v5
        with:
          path: kestra-ee

      - name: Checkout - OSS
        uses: kestra-io/actions/composite/kestra-ee/kestra-ee-checkout@main

      - name: setup init
        uses: kestra-io/actions/composite/setup-build@main
        with:
          java-enabled: 'true'
          node-enabled: 'true'
          java-version: ${{ inputs.java-version }}

      - name: Setup - Maven proxy
        uses: kestra-io/actions/composite/kestra-ee/setup-maven-proxy@main
        with:
          gcp-service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # OSS npm ci and EE npm install target separate directories/lockfiles — independent. The EE
      # build itself stays sequential-after: it needs the local install in kestra-ee/ui-ee done.
      - parallel:
          - name: Build frontend - OSS npm ci
            shell: bash
            working-directory: kestra/ui
            run: npm ci

          - name: Build frontend - EE npm install
            shell: bash
            working-directory: kestra-ee/ui-ee
            run: npm install

      - name: Build frontend - EE build
        shell: bash
        working-directory: kestra-ee/ui-ee
        env:
          NODE_OPTIONS: "--max-old-space-size=4096" # required by kestra 1.0.X using vite and not rolldown-vite
        run: npm run build

      # Detect whether this version ships the cloud-ee module (2.0+ / develop).
      # Older versions (1.3 and earlier) don't have it, so the cloud steps are skipped.
      - name: Detect cloud-ee module
        id: cloud-ee
        shell: bash
        run: |
          if [ -f kestra-ee/Dockerfile.cloud ] && [ -d kestra-ee/cloud-ee ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Shadow Jar
      - name: Gradle - Build jars
        env:
          NODE_OPTIONS: "--max-old-space-size=4096" # required by kestra 1.0.X using vite and not rolldown-vite
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          cd kestra-ee
          if [ "${{ steps.cloud-ee.outputs.exists }}" == "true" ]; then
            ./gradlew executableJar :cloud-ee:shadowJar --parallel --console=plain
          else
            ./gradlew executableJar --parallel --console=plain
          fi

      # Independent uploads — different artifact names, different source paths.
      - parallel:
          - name: Artifacts - Upload Executable
            uses: actions/upload-artifact@v4
            with:
              name: exe
              path: kestra-ee/build/executable/

          - name: Artifacts - Upload cloud-ee libs
            if: ${{ steps.cloud-ee.outputs.exists == 'true' }}
            uses: actions/upload-artifact@v4
            with:
              name: cloud-libs
              path: kestra-ee/cloud-ee/build/libs/cloud-ee-*-all.jar

      - name: Artifacts - Transform swagger for website
        run: |
          mkdir -p swagger
          cp kestra/webserver/build/classes/java/main/META-INF/swagger/kestra.yml swagger/kestra.yml
          cp kestra-ee/webserver-ee/build/classes/java/main/META-INF/swagger/kestra-ee.yml swagger/kestra-ee.yml

      - name: Artifacts - Upload Swagger
        uses: actions/upload-artifact@v4
        with:
          name: swagger
          path: swagger
