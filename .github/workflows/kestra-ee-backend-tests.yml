name: Backend tests

on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        description: "The Slack webhook url."
        required: true
      GOOGLE_SERVICE_ACCOUNT:
        description: "The Google Service Account."
        required: false
      GCP_SERVICE_ACCOUNT:
        description: "The GCP service account used to authenticate to the maven-remote Artifact Registry proxy."
        required: false
      CODECOV_TOKEN:
        description: "The Codecov token."
        required: false
      OTLP_ENDPOINT:
        description: 'OTLP endpoint for OpenTelemetry export'
        required: false
      OTLP_HEADERS:
        description: 'OTLP headers for OpenTelemetry export'
        required: false
    inputs:
      java-version:
        description: "Java version"
        type: string
        default: '21'
        required: false
      java-options:
        description: "Value for _JAVA_OPTIONS env variable passed to the Gradle check command. If empty, the variable is not set."
        type: string
        default: ''
        required: false
      legacy-runner:
        description: "Does this ci target a legacy runner"
        type: boolean
        default: false
        required: false

permissions:
  contents: write
  checks: write
  actions: read
  pull-requests: write

env:
  OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}

jobs:
  check:
    name: Check
    runs-on: ${{ inputs.legacy-runner && 'kestra-private-large' || 'kestra-private-16cpu-16gb' }}
    timeout-minutes: 90
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
      # to save corepack from itself
      COREPACK_INTEGRITY_KEYS: 0
      NODE_OPTIONS: "--max-old-space-size=4096" # required by kestra 1.0.X using vite and not rolldown-vite
    steps:
      # Run first, before checkout, so setup time is captured by the trace/host metrics.
      - name: OpenTelemetry - Setup
        uses: kestra-io/actions/actions/otel-instrument@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          host-metrics-enabled: 'true'
          gradle-tracing-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"

      # Checkout
      - name: Checkout - EE
        uses: actions/checkout@v5

      - name: Checkout - OSS
        uses: kestra-io/actions/composite/kestra-ee/kestra-ee-checkout@main

      - name: setup build
        uses: kestra-io/actions/composite/setup-build@main
        with:
          java-enabled: true
          java-version: ${{ inputs.java-version }}

      - name: Setup - Maven proxy
        uses: kestra-io/actions/composite/kestra-ee/setup-maven-proxy@main
        with:
          gcp-service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Move working directory structure
        run: |
          mv kestra ../kestra

      # --max-workers=4 crashes the Gradle daemon ("Could not receive a message from the
      # daemon") on kestra-ee 1.x release branches, so Gradle - check drops it when targeting one.
      - name: Setup - kestra-ee 1.x release branch
        id: target-branch
        run: |
          TARGET_BRANCH="${{ github.base_ref || github.ref_name }}"
          if [[ "$TARGET_BRANCH" =~ ^releases/v1\.[0-9]+\.x$ ]]; then
            echo "Targeting kestra-ee 1.x release branch ($TARGET_BRANCH)"
            echo "is-1x-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-1x-release=false" >> "$GITHUB_OUTPUT"
          fi

      # Services - start async. Previously two separate `docker compose up -d` steps (an unwaited
      # kick-off here, then a second `up -d --wait` below right before Gradle - check) under the
      # same step name, which made the log unreadable. `background:` + `wait:` collapses that into
      # one step: --wait blocks until every service with a healthcheck reports healthy (and the
      # rest are running), so Gradle - check below no longer races container startup. This removes
      # environmental failures like 'Connection refused' / MySQL 'Communications link failure' from
      # tests that connect before the shared services are ready. Requires the healthchecks added in
      # kestra-ee's docker-compose-ci.yml. It's waited on just before Gradle - check, not before
      # javadoc, since javadoc needs no services.
      - name: Setup - Start docker compose
        id: compose
        background: true
        run: docker compose -f docker-compose-ci.yml up -d --wait --wait-timeout 120

      # Gradle: javadoc and check run as two separate steps.
      #
      # In a single `check javadoc --parallel` build, javadoc is worker-starved to the very end
      # (it waits behind the ~25-min :webserver-ee:test) and, running last under peak parallel
      # load, intermittently stalls the whole job past the 90-min timeout. The javadoc tool
      # itself is fine (reproduced on JDK 25: ~10s, zero external network, no -link/doclet flags),
      # so splitting it into its own step removes the starved tail. Gradle's on-disk task outputs
      # persist between steps in the same job, so `check` reuses the already-compiled classes
      # (compileJava UP-TO-DATE) — no double compilation. The javadoc step gets its own short
      # timeout so a residual stall fails fast instead of burning the whole budget.
      # testClasses is also added to compile before all test so that the test scheduling is respected
      # https://github.com/kestra-io/gradle-plugin/#test-scheduling
      - name: Gradle - javadoc
        timeout-minutes: 15
        run: |
          echo $GOOGLE_SERVICE_ACCOUNT | base64 -d > $(pwd)/.gcp-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/.gcp-service-account.json
          if [[ -n "${{ inputs.java-options }}" ]]; then
            export _JAVA_OPTIONS="${{ inputs.java-options }}"
          fi
          ./gradlew javadoc testClasses --parallel --console=plain

      # Services - wait to be ready
      - name: Setup - Wait docker compose
        wait: [compose]

      - name: Gradle - check
        run: |
          echo $GOOGLE_SERVICE_ACCOUNT | base64 -d > $(pwd)/.gcp-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/.gcp-service-account.json
          if [[ -n "${{ inputs.java-options }}" ]]; then
            export _JAVA_OPTIONS="${{ inputs.java-options }}"
          fi
          MAX_WORKERS_FLAG="--max-workers=4"
          if [[ "${{ steps.target-branch.outputs.is-1x-release }}" == "true" ]]; then
            MAX_WORKERS_FLAG=""
          fi
          ./gradlew check --parallel $MAX_WORKERS_FLAG --console=plain

      - name: comment PR with test report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes @kestra-io/kestra-devtools generateTestReportSummary --only-errors --ci $(pwd)

      - name: generate test report in logs and fail if any failed tests
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes @kestra-io/kestra-devtools generateTestReportSummary --only-errors --fail-on-error $(pwd)

      # Report Java
      - name: Report - Java
        uses: kestra-io/actions/composite/report-java@main
        if: ${{ !cancelled() }}
        with:
          # GITHUB_AUTH_TOKEN and SONAR_TOKEN are not declared in this workflow's `secrets:` block,
          # so they were never in the context this passed on either — Sonar stays inert here.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          google-service-account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
