name: Backend tests

on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        description: "The Slack webhook url."
        required: true
      GOOGLE_SERVICE_ACCOUNT:
        description: "The Google Service Account."
        required: false
      CODECOV_TOKEN:
        description: "The Codecov token."
        required: false
    inputs:
      java-version:
        description: "Java version"
        type: string
        default: '21'
        required: false
      java-options:
        description: "Value for _JAVA_OPTIONS env variable passed to the Gradle check command. If empty, the variable is not set."
        type: string
        default: ''
        required: false

permissions:
  contents: write
  checks: write
  actions: read
  pull-requests: write

env:
  OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}

jobs:
  check:
    name: Check
    runs-on: kestra-private-large
    timeout-minutes: 90
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
      # to save corepack from itself
      COREPACK_INTEGRITY_KEYS: 0
    steps:
      # Checkout
      - name: Checkout - EE
        uses: actions/checkout@v5

      - name: Checkout - OSS
        uses: kestra-io/actions/composite/kestra-ee/kestra-ee-checkout@main

      - name: setup build
        uses: kestra-io/actions/composite/setup-build@main
        with:
          java-enabled: true
          java-version: ${{ inputs.java-version }}

      # Route Gradle Maven reads through the GCP Artifact Registry maven-remote caching proxy
      # to avoid Maven Central HTTP 429 rate-limiting on shared GitHub Actions runner IPs.
      # The token is passed at build time via MAVEN_REMOTE_TOKEN; the script is a no-op when empty.
      - name: GCP - Check credentials availability
        id: gcp-check
        run: echo "available=${{ secrets.GOOGLE_SERVICE_ACCOUNT != '' }}" >> $GITHUB_OUTPUT

      - name: GCP - Auth for maven-remote proxy
        id: gcp-auth
        uses: 'google-github-actions/auth@v3'
        if: steps.gcp-check.outputs.available == 'true'
        with:
          token_format: 'access_token'
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

      - name: Setup - Gradle maven-remote init script
        if: ${{ steps.gcp-auth.outputs.access_token != '' }}
        shell: bash
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/maven-remote.gradle << 'EOF'
          def token = System.getenv("MAVEN_REMOTE_TOKEN") ?: ""
          def injectProxy = { repos ->
              if (token && !repos.findByName("GcpMavenRemote")) {
                  repos.maven {
                      name = "GcpMavenRemote"
                      url = "https://europe-maven.pkg.dev/kestra-host/maven-remote"
                      credentials { username = "oauth2accesstoken"; password = token }
                  }
              }
          }
          // Always restore explicit repos: touching pluginManagement.repositories via beforeSettings
          // drops the implicit gradlePluginPortal() default, so we re-add it unconditionally.
          beforeSettings { settings ->
              injectProxy(settings.pluginManagement.repositories)
              if (!settings.pluginManagement.repositories.findByName("Gradle Plugin Portal")) {
                  settings.pluginManagement.repositories.gradlePluginPortal()
              }
              if (!settings.pluginManagement.repositories.findByName("MavenRepo")) {
                  settings.pluginManagement.repositories.mavenCentral()
              }
          }
          if (token) {
              allprojects {
                  injectProxy(buildscript.repositories)
                  injectProxy(repositories)
              }
          }
          EOF

      - name: OpenTelemetry - Setup
        uses: kestra-io/actions/actions/otel-collect@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          host-metrics-enabled: 'true'
          gradle-tracing-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"

      - name: Move working directory structure
        run: |
          mv kestra ../kestra

      # Services
      - name: Setup - Start docker compose
        # --wait blocks until every service with a healthcheck reports healthy (and the rest
        # are running), so the Gradle check below no longer races container startup. This
        # removes environmental failures like 'Connection refused' / MySQL 'Communications
        # link failure' from tests that connect before the shared services are ready.
        # Requires the healthchecks added in kestra-ee's docker-compose-ci.yml.
        run: docker compose -f docker-compose-ci.yml up -d --wait --wait-timeout 120

      # Gradle check
      - name: Gradle - check and javadoc
        env:
          MAVEN_REMOTE_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
        run: |
          echo $GOOGLE_SERVICE_ACCOUNT | base64 -d > $(pwd)/.gcp-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/.gcp-service-account.json
          if [[ -n "${{ inputs.java-options }}" ]]; then
            export _JAVA_OPTIONS="${{ inputs.java-options }}"
          fi
          ./gradlew check javadoc --parallel

      - name: comment PR with test report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes @kestra-io/kestra-devtools generateTestReportSummary --only-errors --ci $(pwd)

      - name: generate test report in logs and fail if any failed tests
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes @kestra-io/kestra-devtools generateTestReportSummary --only-errors --fail-on-error $(pwd)

      # Report Java
      - name: Report - Java
        uses: kestra-io/actions/composite/report-java@main
        if: ${{ !cancelled() }}
        with:
          secrets: ${{ toJSON(secrets) }}
