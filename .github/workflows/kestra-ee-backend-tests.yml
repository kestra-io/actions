name: Backend tests

on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        description: "The Slack webhook url."
        required: true
      GOOGLE_SERVICE_ACCOUNT:
        description: "The Google Service Account."
        required: false
      GCP_SERVICE_ACCOUNT:
        description: "The GCP service account used to authenticate to the maven-remote Artifact Registry proxy."
        required: false
      CODECOV_TOKEN:
        description: "The Codecov token."
        required: false
    inputs:
      java-version:
        description: "Java version"
        type: string
        default: '21'
        required: false
      java-options:
        description: "Value for _JAVA_OPTIONS env variable passed to the Gradle check command. If empty, the variable is not set."
        type: string
        default: ''
        required: false

permissions:
  contents: write
  checks: write
  actions: read
  pull-requests: write

env:
  OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}

jobs:
  check:
    name: Check
    runs-on: kestra-private-large
    timeout-minutes: 90
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
      # to save corepack from itself
      COREPACK_INTEGRITY_KEYS: 0
    steps:
      # Checkout
      - name: Checkout - EE
        uses: actions/checkout@v5

      - name: Checkout - OSS
        uses: kestra-io/actions/composite/kestra-ee/kestra-ee-checkout@main

      - name: setup build
        uses: kestra-io/actions/composite/setup-build@main
        with:
          java-enabled: true
          java-version: ${{ inputs.java-version }}

      - name: Setup - Maven proxy
        uses: kestra-io/actions/composite/kestra-ee/setup-maven-proxy@main
        with:
          gcp-service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: OpenTelemetry - Setup
        uses: kestra-io/actions/actions/otel-collect@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          host-metrics-enabled: 'true'
          gradle-tracing-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"

      - name: Move working directory structure
        run: |
          mv kestra ../kestra

      # Services
      - name: Setup - Start docker compose
        # --wait blocks until every service with a healthcheck reports healthy (and the rest
        # are running), so the Gradle check below no longer races container startup. This
        # removes environmental failures like 'Connection refused' / MySQL 'Communications
        # link failure' from tests that connect before the shared services are ready.
        # Requires the healthchecks added in kestra-ee's docker-compose-ci.yml.
        run: docker compose -f docker-compose-ci.yml up -d --wait --wait-timeout 120

      # Gradle check
      - name: Gradle - javadoc then check
        run: |
          echo $GOOGLE_SERVICE_ACCOUNT | base64 -d > $(pwd)/.gcp-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/.gcp-service-account.json
          if [[ -n "${{ inputs.java-options }}" ]]; then
            export _JAVA_OPTIONS="${{ inputs.java-options }}"
          fi
          # Run javadoc BEFORE check, as its own Gradle invocation.
          #
          # Why: in a single `check javadoc --parallel` build, javadoc is worker-starved to the
          # very end (it waits behind the ~25-min :webserver-ee:test), then runs last under peak
          # parallel load. In that tail position it intermittently stalls the whole job past the
          # 90-min timeout — the last "> Task :...:javadoc" line prints and the build goes silent.
          # The javadoc tool itself is NOT at fault: reproduced on JDK 25 it completes in ~10s,
          # makes zero external network connections, and has no -link/doclet/annotation-processing
          # flags. Running javadoc up-front on a fresh daemon avoids the starved tail entirely.
          #
          # The `timeout` is a safety net: if javadoc ever stalls again it is capped at 10 min
          # instead of burning the full 90-min budget, and on timeout we dump every JVM's thread
          # stacks so a recurrence self-captures the stuck frame in the job log.
          JSTACK="${JAVA_HOME:+$JAVA_HOME/bin/}jstack"
          # `|| code=$?` keeps the captured exit code intact under the runner's `set -e`.
          code=0
          timeout --signal=TERM 600 ./gradlew javadoc --parallel || code=$?
          if [ "$code" -ne 0 ]; then
            if [ "$code" -eq 124 ]; then
              echo "::error::javadoc stalled and was killed after 10m — dumping thread stacks"
              for p in $(pgrep -f 'GradleDaemon|GradleWorkerMain|jdk.javadoc|com.sun.tools.javadoc'); do
                echo "===== jstack $p ====="; "$JSTACK" -l "$p" 2>&1 || true
              done
            fi
            exit "$code"
          fi
          ./gradlew check --parallel

      - name: comment PR with test report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes @kestra-io/kestra-devtools generateTestReportSummary --only-errors --ci $(pwd)

      - name: generate test report in logs and fail if any failed tests
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes @kestra-io/kestra-devtools generateTestReportSummary --only-errors --fail-on-error $(pwd)

      # Report Java
      - name: Report - Java
        uses: kestra-io/actions/composite/report-java@main
        if: ${{ !cancelled() }}
        with:
          secrets: ${{ toJSON(secrets) }}
