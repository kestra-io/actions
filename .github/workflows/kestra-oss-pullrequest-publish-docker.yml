name: Pull Request - Publish Docker

on:
  workflow_call:
    inputs:
      java-version:
        description: "Java version"
        type: string
        default: '21'
        required: false
      skip-build:
        description: >-
          Skip the nested artifact build and reuse the `exe` artifact already
          uploaded by another job of this workflow run (e.g. a hoisted Build
          Artifacts job shared with the E2E tests).
        type: boolean
        default: false
        required: false
      runner:
        description: "The runner label to execute this job on."
        type: string
        default: 'ubuntu-latest'
        required: false

env:
  OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}

jobs:
  build-artifacts:
    name: Build Artifacts
    if: ${{ !inputs.skip-build && github.event.pull_request.head.repo.full_name == github.repository }} # prevent running on forks
    uses: ./.github/workflows/kestra-oss-build-artifacts.yml
    with:
      java-version: ${{ inputs.java-version }}
      runner: ${{ inputs.runner }}

  publish:
    name: Publish Docker
    # `!cancelled()` lets this run when build-artifacts was skipped (skip-build:
    # the `exe` artifact then comes from another job of the same run).
    if: ${{ !cancelled() && needs.build-artifacts.result != 'failure' && github.event.pull_request.head.repo.full_name == github.repository }} # prevent running on forks
    runs-on: ${{ inputs.runner }}
    needs: build-artifacts
    env:
      GITHUB_IMAGE_PATH: "ghcr.io/kestra-io/kestra-pr"
    steps:
      - name: Checkout - Current ref
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      - name: Docker init
        uses: kestra-io/actions/composite/setup-docker@main

      # Docker Login
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build Docker Image
      - name: Artifacts - Download executable
        uses: actions/download-artifact@v5
        with:
          name: exe
          path: build/executable

      - name: Docker - Copy exe to image
        shell: bash
        run: |
          cp build/executable/* docker/app/kestra && chmod +x docker/app/kestra

      - name: Determine base image tag
        id: base
        shell: bash
        run: |
          if [[ "${{ github.base_ref }}" == "develop" ]]; then
            echo "tag=develop" >> "$GITHUB_OUTPUT"
          else
            ref="${{ github.base_ref }}"
            ref="${ref#releases/}"
            ref="${ref%.x}"
            echo "tag=${ref}" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker - Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.pr
          push: true
          tags: ${{ env.GITHUB_IMAGE_PATH }}:${{ github.event.pull_request.number }}
          build-args: |
            KESTRA_DOCKER_BASE_VERSION=${{ steps.base.outputs.tag }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Add comment on pull request
      - name: Add comment to PR
        uses: kestra-io/actions/actions/comment-update@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: "🐋 Docker image"
          template: |
            ```
            ${{ env.GITHUB_IMAGE_PATH }}:${{ github.event.pull_request.number }}
            ```

            ```bash
            docker run --pull=always --rm -it -p 8080:8080 --user=root -v /var/run/docker.sock:/var/run/docker.sock -v /tmp:/tmp ${{ env.GITHUB_IMAGE_PATH }}:${{ github.event.pull_request.number }} server local
            ```
