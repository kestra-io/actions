name: Security scan

on:
  workflow_call:
    inputs:
      metadata:
        description: "Newline separated key=value pairs added to every finding of every scanner. A dotted key is written at that path, an undotted one lands under labels"
        required: false
        type: string
        default: ''
    secrets:
      OTLP_ENDPOINT:
        required: false
      OTLP_HEADERS:
        required: false
      GCP_SERVICE_ACCOUNT:
        required: false

concurrency:
  group: plugin-security-scan-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: read

jobs:
  scan:
    name: Security scan
    uses: kestra-io/actions/.github/workflows/security-scan.yml@main
    with:
      components: plugin=**
      npm-lockfile: ui/package-lock.json
      metadata: ${{ inputs.metadata }}
    secrets: inherit
