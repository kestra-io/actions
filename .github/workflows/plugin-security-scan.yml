name: Plugin security scan

# Security scan of a plugin repository, for its own CI: a Java SBOM scan, the optional ui/ micro-frontend
# lockfile, OpenGrep and TruffleHog, every finding labelled component=plugin. See security-scan.yml.

on:
  workflow_call:
    inputs:
      metadata:
        description: "Newline separated key=value pairs added to every finding of every scanner. A dotted key is written at that path, an undotted one lands under labels"
        required: false
        type: string
        default: ''
    secrets:
      OTLP_ENDPOINT:
        required: false
      OTLP_HEADERS:
        required: false
      GCP_SERVICE_ACCOUNT:
        required: false

permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: read

jobs:
  scan:
    name: Security scan
    uses: kestra-io/actions/.github/workflows/security-scan.yml@main
    with:
      components: plugin=**
      npm-lockfile: ui/package-lock.json
      metadata: ${{ inputs.metadata }}
    secrets: inherit
