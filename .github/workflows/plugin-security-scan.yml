name: Security scan

on:
  workflow_call:
    inputs:
      metadata:
        description: "Newline separated key=value pairs added to every finding of every scanner. A dotted key is written at that path, an undotted one lands under labels"
        required: false
        type: string
        default: ''
    secrets:
      OTLP_ENDPOINT:
        required: false
      OTLP_HEADERS:
        required: false
      GCP_SERVICE_ACCOUNT:
        description: "DEPRECATED (SEC-2311), no longer read: GCP access goes through Workload Identity Federation (ci-reader)"
        required: false

concurrency:
  group: plugin-security-scan-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

# No permissions block on purpose (SEC-2311): security-scan.yml takes the caller's permissions as they are, so a
# caller granting id-token: write gets the ci-reader Workload Identity Federation steps there. See its comment.

jobs:
  scan:
    name: Security scan
    uses: kestra-io/actions/.github/workflows/security-scan.yml@main
    with:
      components: plugin=**
      npm-lockfile: ui/package-lock.json
      metadata: ${{ inputs.metadata }}
    secrets: inherit
