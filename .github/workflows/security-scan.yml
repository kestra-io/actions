name: Security scan

# Trivy (Java SBOM, npm lockfile and any other lock file), OpenGrep and TruffleHog in their own job, so each CI calls one
# workflow instead of repeating the scan steps. Each scanner gates itself on the branch: Trivy only
# runs on the default branch and releases/*, OpenGrep and TruffleHog run everywhere and ship to
# Elastic on the default branch only.

on:
  workflow_call:
    inputs:
      components:
        description: >-
          Newline separated component=glob pairs matched against each finding's file, first match wins,
          e.g. frontend=ui/** then backend=**, or plugin=** for a single component. A finding matching
          no glob gets no component
        required: true
        type: string
      exclude-path:
        description: "Newline separated globs of files OpenGrep and TruffleHog skip, e.g. src/content/**. Trivy is not affected"
        required: false
        type: string
        default: ''
      java-sbom-path:
        description: "SBOM written by `./gradlew cyclonedxBom`, generated and scanned with Trivy. Skipped when empty"
        required: false
        type: string
        default: 'build/sbom/java.json'
      java-version:
        description: "Java version used to generate the SBOM"
        required: false
        type: string
        default: '25'
      npm-lockfile:
        description: "package-lock.json to scan with Trivy. Skipped when empty or missing"
        required: false
        type: string
        default: ''
      dependencies-path:
        description: >-
          Directory or lock file scanned with Trivy in fs mode, for the ecosystems the two inputs above don't cover:
          go.mod, uv.lock, poetry.lock, requirements*.txt, Pipfile.lock, pom.xml, Cargo.lock... `.` scans every lock file
          of the repository, npm ones included: leave npm-lockfile empty then, or each npm finding is reported twice.
          Skipped when empty
        required: false
        type: string
        default: ''
      metadata:
        description: "Newline separated key=value pairs added to every finding of every scanner. A dotted key is written at that path, an undotted one lands under labels"
        required: false
        type: string
        default: ''
      kestra-ee:
        description: "Check out kestra OSS next to the repository, as the kestra-ee Gradle build includes its projects"
        required: false
        type: boolean
        default: false
    secrets:
      OTLP_ENDPOINT:
        required: false
      OTLP_HEADERS:
        required: false
      OTLP_SECURITY_ENDPOINT:
        description: "Ingest endpoint of the security project, where the findings are shipped"
        required: false
      OTLP_SECURITY_HEADERS:
        description: "Ingest headers of the security project"
        required: false
      GCP_SERVICE_ACCOUNT:
        description: "DEPRECATED (SEC-2311), no longer read: GCP access goes through Workload Identity Federation (ci-reader)"
        required: false
      GOOGLE_SERVICE_ACCOUNT:
        description: "DEPRECATED (SEC-2311), no longer read: the Gradle build reads Artifact Registry as ci-reader through Workload Identity Federation"
        required: false

# No permissions block on purpose (SEC-2311): a called workflow can only lower the caller's GITHUB_TOKEN permissions,
# and every caller grants contents: read, actions: read, checks: write, pull-requests: write and packages: read.
# Requesting id-token: write here would fail every caller that doesn't grant it yet, so this workflow takes the
# caller's permissions as they are: a caller adding id-token: write gets the ci-reader steps below, the others scan
# without GCP.

env:
  OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}

jobs:
  scan:
    name: Security scan
    # Fixed per repository, never a caller input: a fork's pull request runs the caller workflow from the fork, so an
    # input would let it pick any self-hosted runner. github.repository is the calling repository, so a fork never
    # matches. kestra-ee builds on 8 GB in its own CI: on 4 GB its Gradle build plus a full OpenGrep scan lost the
    # runner on about 1 develop push in 5
    runs-on: >-
      ${{ github.repository == 'kestra-io/kestra-ee' && 'kestra-private-4cpu-8gb'
      || github.event.repository.private && 'kestra-private-4cpu-4gb' || 'ubuntu-latest' }}
    env:
      SBOM_ENABLED: ${{ inputs.java-sbom-path != '' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'releases/')) }}
    steps:
      - name: Setup - OpenTelemetry
        uses: kestra-io/actions/actions/otel-instrument@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          host-metrics-enabled: 'true'
          gradle-tracing-enabled: ${{ inputs.java-sbom-path != '' }}
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"

      # fetch-depth: 0 so OpenGrep and TruffleHog can diff a pull request against its base.
      - name: Checkout - Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Checkout - OSS
        if: ${{ inputs.kestra-ee && env.SBOM_ENABLED == 'true' && hashFiles('gradlew') != '' }}
        uses: kestra-io/actions/composite/kestra-ee/kestra-ee-checkout@main

      # Out of the workspace, where settings.gradle expects it, and so OpenGrep and TruffleHog don't scan OSS too.
      - name: Checkout - Move OSS next to the repository
        if: ${{ inputs.kestra-ee && env.SBOM_ENABLED == 'true' && hashFiles('gradlew') != '' }}
        shell: bash
        run: mv kestra ../kestra

      - name: Setup - Build
        if: ${{ env.SBOM_ENABLED == 'true' && hashFiles('gradlew') != '' }}
        uses: kestra-io/actions/composite/setup-build@main
        with:
          java-enabled: true
          java-version: ${{ inputs.java-version }}

      # ACTIONS_ID_TOKEN_REQUEST_URL is only set when the caller grants id-token: write (see permissions above).
      - name: GCP - Check OIDC availability
        id: oidc
        if: ${{ env.SBOM_ENABLED == 'true' && hashFiles('gradlew') != '' }}
        shell: bash
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Security scan::no id-token: write granted by the caller, the Gradle build runs without GCP (SEC-2311)"
          fi

      # Route Gradle Maven reads through the GCP maven-remote caching proxy (avoids Maven Central 429s). The composite
      # authenticates as ci-reader through Workload Identity Federation when the job can mint an OIDC token, and is a
      # no-op otherwise.
      - name: Setup - Maven proxy
        if: ${{ env.SBOM_ENABLED == 'true' && hashFiles('gradlew') != '' }}
        uses: kestra-io/actions/composite/kestra-ee/setup-maven-proxy@main

      # SEC-2311: ci-reader (read-only Artifact Registry) through Workload Identity Federation, no key, as Application
      # Default Credentials for the Gradle build (kestra-ee reads its private Maven repository with them). Only on the
      # SBOM runs: the scanners below never need GCP.
      - name: GCP - Auth with ci-reader (Workload Identity Federation)
        id: gcp
        if: ${{ steps.oidc.outputs.available == 'true' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/956000344026/locations/global/workloadIdentityPools/github/providers/github
          service_account: ci-reader@kestra-dev.iam.gserviceaccount.com

      # CycloneDX SBOM of the runtime classpath, written by io.kestra.gradle.repository-conventions.
      # continue-on-error so a repository on an older version, without the task, doesn't fail the build.
      - name: Trivy - Generate CycloneDX
        id: sbom
        if: ${{ env.SBOM_ENABLED == 'true' && hashFiles('gradlew') != '' }}
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew cyclonedxBom --console=plain

      # The auth step writes its credentials file (it carries the job's OIDC request token) into the workspace, which
      # TruffleHog and OpenGrep scan below: remove it as soon as Gradle is done.
      - name: GCP - Remove credentials file
        if: ${{ always() && steps.gcp.outputs.credentials_file_path != '' }}
        shell: bash
        env:
          CREDENTIALS_FILE: ${{ steps.gcp.outputs.credentials_file_path }}
        run: rm -f "${CREDENTIALS_FILE}"

      - name: Trivy - Scan Java dependencies
        id: trivy
        if: ${{ !cancelled() && steps.sbom.outcome == 'success' && hashFiles(inputs.java-sbom-path) != '' }}
        uses: kestra-io/actions/composite/scan-trivy@main
        with:
          scan-type: sbom
          scan-path: ${{ inputs.java-sbom-path }}
          elastic-endpoint: ${{ secrets.OTLP_SECURITY_ENDPOINT }}
          elastic-headers: "${{ secrets.OTLP_SECURITY_HEADERS }}"
          metadata: |
            ${{ inputs.metadata }}
            target=java-dependencies
          components: ${{ inputs.components }}

      - name: Trivy - Scan npm dependencies
        id: trivy-npm
        if: ${{ !cancelled() && inputs.npm-lockfile != '' && hashFiles(inputs.npm-lockfile) != '' }}
        uses: kestra-io/actions/composite/scan-trivy@main
        with:
          scan-path: ${{ inputs.npm-lockfile }}
          elastic-endpoint: ${{ secrets.OTLP_SECURITY_ENDPOINT }}
          elastic-headers: "${{ secrets.OTLP_SECURITY_HEADERS }}"
          metadata: |
            ${{ inputs.metadata }}
            target=npm-dependencies
          components: ${{ inputs.components }}

      - name: Trivy - Scan other dependencies
        id: trivy-deps
        if: ${{ !cancelled() && inputs.dependencies-path != '' }}
        uses: kestra-io/actions/composite/scan-trivy@main
        with:
          scan-path: ${{ inputs.dependencies-path }}
          elastic-endpoint: ${{ secrets.OTLP_SECURITY_ENDPOINT }}
          elastic-headers: "${{ secrets.OTLP_SECURITY_HEADERS }}"
          metadata: |
            ${{ inputs.metadata }}
            target=dependencies
          components: ${{ inputs.components }}

      - name: OpenGrep - Static analysis
        id: opengrep
        if: ${{ !cancelled() }}
        uses: kestra-io/actions/composite/scan-opengrep@main
        with:
          github-token: ${{ github.token }}
          elastic-endpoint: ${{ secrets.OTLP_SECURITY_ENDPOINT }}
          elastic-headers: "${{ secrets.OTLP_SECURITY_HEADERS }}"
          metadata: ${{ inputs.metadata }}
          components: ${{ inputs.components }}
          exclude-path: ${{ inputs.exclude-path }}

      # Secret scan. Diff on a pull request, the whole tree otherwise.
      - name: TruffleHog - Secret scan
        if: ${{ !cancelled() }}
        uses: kestra-io/actions/composite/scan-trufflehog@main
        with:
          github-token: ${{ github.token }}
          elastic-endpoint: ${{ secrets.OTLP_SECURITY_ENDPOINT }}
          elastic-headers: "${{ secrets.OTLP_SECURITY_HEADERS }}"
          metadata: ${{ inputs.metadata }}
          components: ${{ inputs.components }}
          exclude-path: ${{ inputs.exclude-path }}

  otel-export-trace:
    if: always()
    name: OpenTelemetry Export Trace
    runs-on: ${{ github.event.repository.private && 'kestra-private-4cpu-4gb' || 'ubuntu-latest' }}
    needs: [scan]
    steps:
      - name: OpenTelemetry - Export trace
        uses: kestra-io/actions/actions/otel-export-trace@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          logs-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"
