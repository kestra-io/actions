name: Create Docker images on Release

on:
  workflow_call:
    secrets:
      GCP_SERVICE_ACCOUNT:
        required: true
      GOOGLE_SERVICE_ACCOUNT:
        required: true
      DOCKERHUB_USERNAME:
        description: "The DockerHub username"
        required: true
      DOCKERHUB_TOKEN:
        description: "The DockerHub token"
        required: true
      SLACK_RELEASES_WEBHOOK_URL:
        required: false
      OTLP_ENDPOINT:
        description: 'OTLP endpoint for OpenTelemetry export'
        required: false
      OTLP_HEADERS:
        description: 'OTLP headers for OpenTelemetry export'
        required: false
    inputs:
      retag-latest:
        description: 'Retag latest Docker images'
        required: false
        type: boolean
        default: false
      retag-lts:
        description: 'Retag LTS Docker images'
        required: false
        type: boolean
        default: false
      plugin-version:
        description: '(deprecated) Plugin version window for old Kestra releases using .plugins file (0.22 to 0.24). If omitted, then plugin list will be fetched from the API compatible versions endpoint'
        required: false
        type: string
        default: ''
      dry-run:
        description: 'Dry run mode that will stop before publishing the image'
        required: false
        type: boolean
        default: false
      java-version:
        description: "Java version"
        type: string
        default: '21'
        required: false
      notify-in-slack-release-channel:
        description: "notify-in-slack-release-channel"
        required: false
        type: boolean
        default: true
      use-kestra-base-images:
        description: 'Use kestra-base images and kestractl for plugin download. Default false preserves backward compatibility with older EE release branches.'
        required: false
        type: boolean
        default: false

env:
  OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}

jobs:
  plugins:
    name: List Plugins
    runs-on: kestra-private-4cpu-4gb
    outputs:
      plugins: ${{ steps.plugins-outputs-step.outputs.plugins }}
    steps:
      # Checkout
      - uses: actions/checkout@v5
      - name: Setup - OpenTelemetry
        uses: kestra-io/actions/actions/otel-collect@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          host-metrics-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"
      - name: Log params
        run: |
          echo "parameters:"
          echo "    kestraVersion: ${{ github.ref_name }}"
          echo "    pluginsWindowVersion: ${{ inputs.plugin-version }}"
      # Get Plugins List
      - name: Get old plugins list from .plugins file
        id: old-plugin-list-from-inputs-file
        if: ${{ inputs.plugin-version != '' }}
        uses: kestra-io/actions/composite/kestra-ee/kestra-ee-plugins-list@main
        with:
          plugin-version: ${{ inputs.plugin-version == 'LATEST-SNAPSHOT' && 'LATEST' || inputs.plugin-version }}
      - name: Get new plugins list from API
        id: new-plugin-list-from-api
        if: ${{ inputs.plugin-version == '' }}
        uses: kestra-io/actions/composite/kestra/kestra-plugins-list@main
        with:
          kestraVersion: ${{ github.ref_name }}
      - name: Select plugins output
        id: plugins-outputs-step
        shell: bash
        run: |
          if [ "${{ inputs.plugin-version }}" != "" ]; then
            echo "plugins=${{ steps.old-plugin-list-from-inputs-file.outputs.plugins }}" >> $GITHUB_OUTPUT
          else
            echo "plugins=${{ steps.new-plugin-list-from-api.outputs.plugins }}" >> $GITHUB_OUTPUT
          fi

  # ********************************************************************************************************************
  # Build
  # ********************************************************************************************************************
  build-artifacts:
    name: Build Artifacts
    uses: ./.github/workflows/kestra-ee-build-artifacts.yml
    secrets:
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
      # Routes the Build Jar Gradle step through the GCP AR maven-remote proxy to
      # avoid Maven Central HTTP 429 on shared runner IPs. No-op if the secret is empty.
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}
      OTLP_HEADERS: ${{ secrets.OTLP_HEADERS }}
    with:
      java-version: ${{ inputs.java-version }}

  # ********************************************************************************************************************
  # Docker
  # ********************************************************************************************************************
  docker:
    name: Publish docker
    runs-on: kestra-private-4cpu-4gb
    needs: [ plugins, build-artifacts ]
    strategy:
      matrix:
        image:
          # -slim replaces the former -no-plugins image; the -no-plugins tags are still pushed as
          # deprecated aliases for one release so downstream consumers can migrate.
          - tag: -slim
            plugins: ""
            packages: jattach
            node-apt-packages: ""
            python-libraries: ""
            deprecated-alias: -no-plugins

          - tag: ""
            plugins: ${{needs.plugins.outputs.plugins}}
            packages: python3 python-is-python3 python3-pip curl jattach
            python-libraries: kestra
            deprecated-alias: ""
    env:
      GCP_IMAGE_PATH: europe-west1-docker.pkg.dev/kestra-host/docker/kestra-ee
      GITHUB_IMAGE_PATH: ghcr.io/kestra-io/kestra-ee
      CLOUD_GCP_IMAGE_PATH: europe-west1-docker.pkg.dev/kestra-host/docker-private/kestra-cloud
    steps:
      - name: echo inputs.dry-run ON
        if: ${{ inputs.dry-run == true }}
        run: echo 'inputs.dry-run ON'
      - name: inputs.dry-run OFF
        if: ${{ inputs.dry-run == false }}
        run: echo 'inputs.dry-run OFF'

      - name: Code Checkout
        uses: actions/checkout@v5
        with:
          path: kestra-ee

      - name: Setup - OpenTelemetry
        uses: kestra-io/actions/actions/otel-collect@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          host-metrics-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"

      # Detect whether this version ships the cloud-ee image (2.0+ / develop).
      # Older versions (1.3 and earlier) don't have Dockerfile.cloud, so the cloud steps are skipped.
      - name: Cloud - Detect cloud-ee
        id: cloud-ee
        shell: bash
        run: |
          if [ -f kestra-ee/Dockerfile.cloud ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Three independent setup steps — Docker init and kestractl install don't touch GCP
      # credentials at all; the Vars step right after needs GCP - Auth's output, so it stays
      # outside this block rather than joining it.
      - parallel:
          - name: Docker init
            uses: kestra-io/actions/composite/setup-docker@main

          # Google Auth
          - name: GCP - Auth with github service account
            id: glogin
            uses: 'google-github-actions/auth@v3'
            with:
              token_format: 'access_token'
              credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

          # Plugins — new path (use-kestra-base-images: true)
          - name: Install kestractl
            if: ${{ inputs.use-kestra-base-images && matrix.image.tag != '-slim' }}
            run: |
              curl -fsSL https://raw.githubusercontent.com/kestra-io/kestractl/main/install-scripts/install.sh | bash
              echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Vars
      - name: Plugins - Set List
        id: vars
        run: |
          TAG=${GITHUB_REF#refs/*/}

          echo "tag=${TAG}${{ matrix.image.tag }}" >> $GITHUB_OUTPUT
          echo "base_tag=${TAG}" >> $GITHUB_OUTPUT

          if [[ $GITHUB_REF == refs/tags/* && $TAG != *-rc* ]]; then
            if [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              # this will remove the patch version number
              MINOR_SEMVER=${TAG%.*}
              echo "minor_semver=${MINOR_SEMVER}" >> $GITHUB_OUTPUT
            else
              echo "Tag '$TAG' is not a valid semver (vMAJOR.MINOR.PATCH), skipping minor_semver"
            fi
          else
            echo "TAG '$TAG' is not a real release, skipping minor_semver"
          fi

          PRIVATE_REPO="--repositories=https://oauth2accesstoken:${{ steps.glogin.outputs.access_token }}@europe-west1-maven.pkg.dev/kestra-host/maven"
          if [[ "${{ inputs.plugin-version }}" == *"-SNAPSHOT" ]]; then
            echo "plugins=$PRIVATE_REPO-snapshot --repositories=https://central.sonatype.com/repository/maven-snapshots ${{ matrix.image.plugins }}" >> $GITHUB_OUTPUT
          else
            echo "plugins=$PRIVATE_REPO ${{ matrix.image.plugins }}" >> $GITHUB_OUTPUT
          fi

      # Plugins — new path (use-kestra-base-images: true). kestractl was installed in the
      # parallel: block above.
      - name: Download EE plugins
        if: ${{ inputs.use-kestra-base-images && matrix.image.tag != '-slim' }}
        run: |
          kestractl plugins download ${{ github.ref_name }} \
            --edition EE \
            --maven-repository "https://europe-west1-maven.pkg.dev/kestra-host/maven" \
            --maven-username oauth2accesstoken \
            --maven-password "${{ steps.glogin.outputs.access_token }}" \
            --plugins-dir kestra-ee/plugins \
            --concurrency 50

      - name: Download OSS plugins
        if: ${{ inputs.use-kestra-base-images && matrix.image.tag != '-slim' }}
        run: |
          kestractl plugins download ${{ github.ref_name }} \
            --edition OSS \
            --maven-repository "https://europe-maven.pkg.dev/kestra-host/maven-remote" \
            --maven-username oauth2accesstoken \
            --maven-password "${{ steps.glogin.outputs.access_token }}" \
            --plugins-dir kestra-ee/plugins \
            --concurrency 50

      - name: Create empty plugins dir
        if: ${{ inputs.use-kestra-base-images && matrix.image.tag == '-slim' }}
        run: mkdir -p kestra-ee/plugins

      # Download executable from artifact
      - name: Artifacts - Download executable
        uses: actions/download-artifact@v5
        with:
          name: exe
          path: build/executable

      - name: Docker - Copy exe to image
        shell: bash
        run: |
          cp build/executable/* kestra-ee/docker/app/kestra && chmod +x kestra-ee/docker/app/kestra

      # Three independent registry logins — different registries, different credentials.
      - parallel:
          - name: Docker - Login to GitHub registry
            uses: docker/login-action@v3
            with:
              registry: ghcr.io
              username: ${{ github.repository_owner }}
              password: ${{ secrets.GITHUB_TOKEN }}

          - name: Docker - Login to Google Cloud registry
            uses: docker/login-action@v3
            with:
              registry: europe-west1-docker.pkg.dev
              username: oauth2accesstoken
              password: ${{ steps.glogin.outputs.access_token }}

          - name: Docker - Login to Dockerhub
            # for pulling images like docker.io/library/eclipse-temurin:25-jre-jammy without getting rate limited
            uses: docker/login-action@v3
            with:
              username: ${{ secrets.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker - Build and push
        id: docker-build-push
        uses: docker/build-push-action@v6
        with:
          context: kestra-ee/.
          push: ${{ inputs.dry-run == false }}
          tags: |
            ${{ env.GITHUB_IMAGE_PATH }}:${{ steps.vars.outputs.tag }}
            ${{ env.GCP_IMAGE_PATH }}:${{ steps.vars.outputs.tag }}
            ${{ matrix.image.deprecated-alias != '' && format('{0}:{1}{2}', env.GITHUB_IMAGE_PATH, steps.vars.outputs.base_tag, matrix.image.deprecated-alias) || '' }}
            ${{ matrix.image.deprecated-alias != '' && format('{0}:{1}{2}', env.GCP_IMAGE_PATH, steps.vars.outputs.base_tag, matrix.image.deprecated-alias) || '' }}
          platforms: linux/amd64,linux/arm64
          network: host
          build-args: |
            KESTRA_PLUGINS=${{ !inputs.use-kestra-base-images && steps.vars.outputs.plugins || '' }}
            APT_PACKAGES=${{ matrix.image.packages }}
            PYTHON_LIBRARIES=${{ matrix.image.python-libraries }}

      # Runs after the kestra-ee image push: the main Dockerfile COPYs the whole docker/
      # tree, so cloud libs/plugins fetched earlier would leak into the public EE image.
      - name: Cloud - Build and push
        if: ${{ matrix.image.tag == '' && inputs.dry-run == false && github.event.client_payload.ref == '' && steps.cloud-ee.outputs.exists == 'true' }}
        uses: kestra-io/actions/composite/kestra-ee/cloud-image@main
        with:
          context: kestra-ee
          base-image: ${{ env.GITHUB_IMAGE_PATH }}:${{ steps.vars.outputs.tag }}
          image: ${{ env.CLOUD_GCP_IMAGE_PATH }}:${{ steps.vars.outputs.tag }}
          kestra-version: ${{ github.ref_name }}

      - name: Setup - Install regctl
        if: startsWith(github.ref, 'refs/tags/v') && (inputs.dry-run == false)
        uses: regclient/actions/regctl-installer@main

      - name: Retag to minor semver version
        if: startsWith(github.ref, 'refs/tags/v') && steps.vars.outputs.minor_semver != '' && (inputs.dry-run == false)
        run: |
          regctl image copy ${{ env.GCP_IMAGE_PATH }}:${{ steps.vars.outputs.tag }} ${{ env.GCP_IMAGE_PATH }}:${{ steps.vars.outputs.minor_semver }}${{ matrix.image.tag }}
          regctl image copy ${{ env.GITHUB_IMAGE_PATH }}:${{ steps.vars.outputs.tag }} ${{ env.GITHUB_IMAGE_PATH }}:${{ steps.vars.outputs.minor_semver }}${{ matrix.image.tag }}
          if [[ -n "${{ matrix.image.deprecated-alias }}" ]]; then
            regctl image copy ${{ env.GCP_IMAGE_PATH }}:${{ steps.vars.outputs.tag }} ${{ env.GCP_IMAGE_PATH }}:${{ steps.vars.outputs.minor_semver }}${{ matrix.image.deprecated-alias }}
            regctl image copy ${{ env.GITHUB_IMAGE_PATH }}:${{ steps.vars.outputs.tag }} ${{ env.GITHUB_IMAGE_PATH }}:${{ steps.vars.outputs.minor_semver }}${{ matrix.image.deprecated-alias }}
          fi

      - name: Retag to latest
        if: startsWith(github.ref, 'refs/tags/v') && (inputs.retag-latest == true || inputs.retag-latest == 'true') && (inputs.dry-run == false)
        run: |
          TAG=${GITHUB_REF#refs/*/}
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "validation error, $TAG did not match acceptable 'latest' regex"
            exit 1
          fi

          regctl image copy ${{ env.GCP_IMAGE_PATH }}:${{ steps.vars.outputs.tag }} ${{ env.GCP_IMAGE_PATH }}:latest${{ matrix.image.tag }}
          regctl image copy ${{ env.GITHUB_IMAGE_PATH }}:${{ steps.vars.outputs.tag }} ${{ env.GITHUB_IMAGE_PATH }}:latest${{ matrix.image.tag }}
          if [[ -n "${{ matrix.image.deprecated-alias }}" ]]; then
            regctl image copy ${{ env.GCP_IMAGE_PATH }}:${{ steps.vars.outputs.tag }} ${{ env.GCP_IMAGE_PATH }}:latest${{ matrix.image.deprecated-alias }}
            regctl image copy ${{ env.GITHUB_IMAGE_PATH }}:${{ steps.vars.outputs.tag }} ${{ env.GITHUB_IMAGE_PATH }}:latest${{ matrix.image.deprecated-alias }}
          fi

      - name: Retag to LTS
        if: startsWith(github.ref, 'refs/tags/v') && (inputs.retag-lts == true || inputs.retag-lts == 'true') && (inputs.dry-run == false)
        run: |
          echo "TODO remove this safety net after debugging inputs.retag-lts, its value: ${{ inputs.retag-lts }}"
          TAG=${GITHUB_REF#refs/*/}
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "validation error, $TAG did not match acceptable 'latest' regex"
            exit 1
          fi

          regctl image copy ${{ env.GCP_IMAGE_PATH }}:${{ steps.vars.outputs.tag }} ${{ env.GCP_IMAGE_PATH }}:latest-lts${{ matrix.image.tag }}
          regctl image copy ${{ env.GITHUB_IMAGE_PATH }}:${{ steps.vars.outputs.tag }} ${{ env.GITHUB_IMAGE_PATH }}:latest-lts${{ matrix.image.tag }}
          if [[ -n "${{ matrix.image.deprecated-alias }}" ]]; then
            regctl image copy ${{ env.GCP_IMAGE_PATH }}:${{ steps.vars.outputs.tag }} ${{ env.GCP_IMAGE_PATH }}:latest-lts${{ matrix.image.deprecated-alias }}
            regctl image copy ${{ env.GITHUB_IMAGE_PATH }}:${{ steps.vars.outputs.tag }} ${{ env.GITHUB_IMAGE_PATH }}:latest-lts${{ matrix.image.deprecated-alias }}
          fi

      - name: Cloud - Retag to minor semver version
        if: startsWith(github.ref, 'refs/tags/v') && steps.vars.outputs.minor_semver != '' && (inputs.dry-run == false) && matrix.image.tag == '' && steps.cloud-ee.outputs.exists == 'true'
        run: |
          regctl image copy ${{ env.CLOUD_GCP_IMAGE_PATH }}:${{ steps.vars.outputs.tag }} ${{ env.CLOUD_GCP_IMAGE_PATH }}:${{ steps.vars.outputs.minor_semver }}

      - name: Cloud - Retag to latest
        if: startsWith(github.ref, 'refs/tags/v') && (inputs.retag-latest == true || inputs.retag-latest == 'true') && (inputs.dry-run == false) && matrix.image.tag == '' && steps.cloud-ee.outputs.exists == 'true'
        run: |
          regctl image copy ${{ env.CLOUD_GCP_IMAGE_PATH }}:${{ steps.vars.outputs.tag }} ${{ env.CLOUD_GCP_IMAGE_PATH }}:latest

      - name: Cloud - Retag to LTS
        if: startsWith(github.ref, 'refs/tags/v') && (inputs.retag-lts == true || inputs.retag-lts == 'true') && (inputs.dry-run == false) && matrix.image.tag == '' && steps.cloud-ee.outputs.exists == 'true'
        run: |
          regctl image copy ${{ env.CLOUD_GCP_IMAGE_PATH }}:${{ steps.vars.outputs.tag }} ${{ env.CLOUD_GCP_IMAGE_PATH }}:latest-lts

  end:
    runs-on: ubuntu-latest
    needs:
      - docker
    if: always()
    env:
      SLACK_RELEASES_WEBHOOK_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}
    steps:
      - name: Slack notification on success
        if: ${{ inputs.notify-in-slack-release-channel == true && !failure() && !cancelled() && !inputs.dry-run && env.SLACK_RELEASES_WEBHOOK_URL != 0 }}
        uses: kestra-io/actions/composite/slack-status@main
        with:
          webhook-url: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}
      # 'end' runs with always(), so without this gate it stays green on a failed
      # run and anything watching the terminal job reads the release as successful.
      - name: Fail when publish did not succeed
        if: ${{ needs.docker.result != 'success' }}
        run: exit 1

  otel-export-trace:
    if: always()
    name: OpenTelemetry Export Trace
    runs-on: ubuntu-latest
    needs: [plugins, build-artifacts, docker, end]
    steps:
      # Reconstruct and export the whole workflow -> job -> step trace.
      - name: OpenTelemetry - Export trace
        uses: kestra-io/actions/actions/otel-collect@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          mode: export-all
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          logs-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"
