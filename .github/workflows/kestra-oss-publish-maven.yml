name: Publish - Maven

on:
  workflow_call:
    secrets:
      SONATYPE_USER:
        description: "The Sonatype username."
        required: true
      SONATYPE_PASSWORD:
        description: "The Sonatype password."
        required: true
      SONATYPE_GPG_KEYID:
        description: "The Sonatype GPG key id."
        required: true
      SONATYPE_GPG_PASSWORD:
        description: "The Sonatype GPG password."
        required: true
      SONATYPE_GPG_FILE:
        description: "The Sonatype GPG file."
        required: true
      OTLP_ENDPOINT:
        description: 'OTLP endpoint for OpenTelemetry export'
        required: false
      OTLP_HEADERS:
        description: 'OTLP headers for OpenTelemetry export'
        required: false
    inputs:
      java-version:
        description: "Java version"
        type: string
        default: '21'
        required: false

env:
  OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}

jobs:
  publish:
    name: Publish - Maven
    runs-on: ubuntu-latest
    steps:
      # Run first, before checkout, so setup time is captured by the trace/host metrics.
      - name: Setup - OpenTelemetry
        uses: kestra-io/actions/actions/otel-instrument@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          host-metrics-enabled: 'true'
          gradle-tracing-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"

      - name: Checkout - Current ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Setup build
      - name: Setup - Build
        uses: kestra-io/actions/composite/setup-build@main
        id: build
        with:
          java-enabled: true
          node-enabled: true
          java-version: ${{ inputs.java-version }}

      - name: Build frontend
        shell: bash
        working-directory: ui
        run: |
          npm ci
          npm run build

      # Publish
      - name: Publish - Release package to Maven Central
        uses: kestra-io/actions/composite/publish-java@main
        with:
          is-private: 'false'
          sonatype-user: ${{ secrets.SONATYPE_USER }}
          sonatype-password: ${{ secrets.SONATYPE_PASSWORD }}
          sonatype-gpg-keyid: ${{ secrets.SONATYPE_GPG_KEYID }}
          sonatype-gpg-password: ${{ secrets.SONATYPE_GPG_PASSWORD }}
          sonatype-gpg-file: ${{ secrets.SONATYPE_GPG_FILE }}

      # Gradle dependency
      - name: Java - Gradle dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
