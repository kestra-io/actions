name: Image security scan

# Scans ONE container image, on the tags it is given, with Trivy and reports every vulnerability to
# Elastic (logs-trivy-gha) through composite/scan-image → actions/report-sarif in image mode, one
# scan_completed summary per tag included, so the security controller tower
# (kestra-io/security-controller-tower) keeps one issue per vulnerable package per image and can
# prove clean scans.
#
# This repo holds no list of images: which images Kestra ships, their tags and owning squad live in
# the tower's `security.scanning/trigger_image_scan` flow (its `images` variable). Its daily sweep
# (the only schedule, ADR-0001 there) loops over that list and dispatches this workflow once per
# image, so only the tags the tower tracks are ever shipped. No cron here.
#
# - workflow_dispatch: what the tower sends (`image`, `tags`, `owner`, its request id in
#   `metadata`). Run it by hand from the Actions tab to test (`dry-run`).
#
# - workflow_call: a caller scans an image it just built (none does yet), e.g. a PR image
#   with `dry-run: true`. A call that ships
#   (dry-run false) must only pass tags the tower's list holds: the tower keeps one state per
#   image × tag and only the tags its sweep rescans can ever be marked fixed.
#
# Registry access: ghcr.io images log in with GITHUB_TOKEN (packages: read; public images), and
# *-docker.pkg.dev ones (Artifact Registry hosts are <region>-docker.pkg.dev, kestra-ee) authenticate with the GCP_SERVICE_ACCOUNT
# org secret (google-github-actions/auth → oauth2accesstoken login), which a workflow_call caller
# must pass (`secrets: inherit`, or GCP_SERVICE_ACCOUNT in its explicit list).
#
# The tower scopes image findings on container.image.name + tag + resource.sub_type, never on
# github.refName, so the caller's github.* context doesn't matter.

on:
  workflow_dispatch:
    inputs:
      image:
        description: "The image to scan, without tag: docker.io/kestra/kestra"
        required: true
        type: string
      tags:
        description: "Comma separated tags of that image: develop,latest,v1.3"
        required: true
        type: string
      owner:
        description: "Squad owning the image, stamped on every finding as labels.owner (core-squad, plugins-squad...)"
        required: false
        type: string
        default: ''
      metadata:
        description: "Newline separated key=value pairs added to every finding (request_id=…, trigger=kestra). A dotted key is written at that path, an undotted one lands under labels"
        required: false
        type: string
        default: ''
      dry-run:
        description: "Build the Elastic payload without sending it"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      image:
        description: "The image to scan, without tag"
        required: true
        type: string
      tags:
        description: "Comma separated tags of that image"
        required: true
        type: string
      owner:
        description: "Squad owning the image, stamped on every finding as labels.owner"
        required: false
        type: string
        default: ''
      metadata:
        description: "Newline separated key=value pairs added to every finding"
        required: false
        type: string
        default: ''
      dry-run:
        description: "Build the Elastic payload without sending it"
        required: false
        type: boolean
        default: false
      actions-ref:
        description: "Ref of kestra-io/actions to read composite/scan-image from. Leave the default unless testing a branch of this repo: then pass the same ref as the `uses:`"
        required: false
        type: string
        default: main
    secrets:
      OTLP_SECURITY_ENDPOINT:
        description: "Elastic ingest endpoint of the security project; `secrets: inherit` passes the org one"
        required: false
      OTLP_SECURITY_HEADERS:
        description: "Elastic ingest headers of the security project"
        required: false
      GCP_SERVICE_ACCOUNT:
        description: "GCP service account JSON, to pull *-docker.pkg.dev images (kestra-ee on Artifact Registry)"
        required: false

concurrency:
  # The tower dispatches one run per image: runs of the same image queue, different images run side by side. A
  # caller's run never waits on them. Under workflow_call github.event_name and github.repository are the CALLER's.
  group: ${{ github.workflow }}-${{ (github.repository == 'kestra-io/actions' && github.event_name == 'workflow_dispatch') && inputs.image || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  matrix:
    name: Tags to scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - name: Images - One matrix row per tag
        id: matrix
        env:
          IMAGE: ${{ inputs.image }}
          TAGS: ${{ inputs.tags }}
          OWNER: ${{ inputs.owner }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          image = os.environ["IMAGE"].strip()
          tags = list(dict.fromkeys(t.strip() for t in os.environ["TAGS"].split(",") if t.strip()))
          slash, colon = image.rfind("/"), image.rfind(":")
          if not image or "@" in image or colon > slash:
              print(f"::error::image must be a name without tag or digest, got '{image}'", file=sys.stderr)
              sys.exit(1)
          if not tags:
              print(f"::warning::{image}: no tag given, nothing to scan", file=sys.stderr)
          rows = [{"image": image, "tag": t, "ref": f"{image}:{t}", "registry": image.split("/", 1)[0],
                   "owner": os.environ.get("OWNER", "").strip(), "service": image.rsplit("/", 1)[-1]} for t in tags]
          print("matrix=" + json.dumps({"include": rows}))
          print(f"count={len(rows)}")
          print(f"{image}: {len(rows)} tag(s)", file=sys.stderr)
          PY

  scan:
    name: ${{ matrix.ref }}
    needs: matrix
    if: ${{ needs.matrix.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A failed leg (registry flake, Trivy DB rate limit, Elastic 5xx) must never fail a caller's publish pipeline
    # (kestra release-docker.yml would skip helm-release, main-build.yml its end job): the leg stays red in the
    # run, the called workflow still concludes success. The tower's own sweep (dispatched here) keeps failing.
    continue-on-error: ${{ !(github.repository == 'kestra-io/actions' && github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      # Same ref as above, so a branch of this repo tests its own composite and report-sarif (the
      # composite runs actions/report-sarif from its own checkout).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kestra-io/actions
          ref: ${{ inputs.actions-ref || github.sha }}
          persist-credentials: false

      # Public GHCR images; a private one would need its package to grant this repo access.
      - name: Docker - Login to GHCR
        if: ${{ startsWith(matrix.image, 'ghcr.io/') }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Artifact Registry (kestra-ee): same auth + login pair as kestra-ee-publish-docker.yml.
      - name: GCP - Auth with github service account
        id: glogin
        if: ${{ endsWith(matrix.registry, 'docker.pkg.dev') }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Docker - Login to Artifact Registry
        if: ${{ endsWith(matrix.registry, 'docker.pkg.dev') }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ matrix.registry }}
          username: oauth2accesstoken
          password: ${{ steps.glogin.outputs.access_token }}

      - name: Trivy - Scan and report
        uses: ./composite/scan-image
        with:
          image-ref: ${{ matrix.ref }}
          elastic-endpoint: ${{ secrets.OTLP_SECURITY_ENDPOINT }}
          elastic-headers: "${{ secrets.OTLP_SECURITY_HEADERS }}"
          dry-run: ${{ inputs.dry-run }}
          metadata: |
            service.name=${{ matrix.service }}
            ${{ matrix.owner != '' && format('owner={0}', matrix.owner) || '' }}
            ${{ inputs.metadata }}
