name: Frontend - Tests

on:
  workflow_call:
    secrets:
      GITHUB_AUTH_TOKEN:
        description: "The GitHub Token."
        required: true
      CODECOV_TOKEN:
        description: 'Codecov Token'
        required: true
      OTLP_ENDPOINT:
        description: 'OTLP endpoint for OpenTelemetry export'
        required: false
      OTLP_HEADERS:
        description: 'OTLP headers for OpenTelemetry export'
        required: false

env:
  # to save corepack from itself
  COREPACK_INTEGRITY_KEYS: 0
  OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}

jobs:
  test:
    name: Frontend - Tests
    runs-on: ubuntu-latest
    steps:
      # Run first, before checkout, so setup time is captured by the trace/host metrics.
      - name: Setup - OpenTelemetry
        uses: kestra-io/actions/actions/otel-instrument@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          host-metrics-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'

      - name: Cache Node Modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ui/node_modules
          key: modules-${{ hashFiles('ui/package-lock.json') }}

      - name: Cache Playwright Binaries
        id: cache-playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('ui/package-lock.json') }}

      - name: Npm - install
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ui
        run: npm ci

      # Runs concurrently with the checks/build/unit-tests below and is only waited on right
      # before it's needed — it's a pure download (browser binaries + apt deps), independent of
      # everything else in this job.
      - name: Storybook - Install Playwright
        id: playwright-install
        background: true
        working-directory: ui
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      # Hoisted out of `prebuild`/`precheck:types`, which is where it used to run: the unit tests
      # import @kestra-io/kestra-sdk through its dist, so the group below needs it built first.
      - name: Npm - bundle the SDK
        # Release branches pin this workflow at @main and predate the script, same as `check:ts-any` below.
        if: hashFiles('ui/scripts/ensure-sdk.mjs') != ''
        working-directory: ui
        run: node scripts/ensure-sdk.mjs

      # Release branches pin this workflow at @main and predate the rule; they still carry a dead
      # stylelint.config.mjs, so the lockfile is what says stylelint can actually run.
      - name: Npm - can stylelint run here
        id: stylelint-available
        working-directory: ui
        run: |
          if [ -f stylelint.config.mjs ] && grep -q '"node_modules/stylelint":' package-lock.json; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "stylelint is not installed here, so the token rule has nothing to run."
          fi

      # oxlint/eslint are `uses:` steps inside a `parallel:` block, which is undocumented as of
      # writing (every public example uses bare `run:` steps) — verify this combination on a
      # scratch dispatch before relying on it; fall back to sequential if it misbehaves.
      #
      # The build and the unit tests share the group with the type check: none of the three reads
      # what another writes, and nothing later in the job consumes ui/dist.
      - parallel:
          - name: Npm - Run build
            working-directory: ui
            env:
              CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
            run: npm run build

          - name: Run front-end unit tests
            working-directory: ui
            run: npm run test:unit

          - name: Npm - check types
            working-directory: ui
            run: npm run check:types

          - name: Npm - check ts-any
            working-directory: ui
            # --if-present: release branches pin this workflow at @main and predate the script.
            run: npm run check:ts-any --if-present

          # fail_level matches oxlint below, which also fails on error; eslint only comments.
          # nofilter: the dead tokens it finds sit on lines no PR touches (kestra-io/kestra#18777).
          - name: Npm - lint (stylelint)
            if: ${{ github.event_name == 'pull_request' && steps.stylelint-available.outputs.run == 'true' }}
            uses: reviewdog/action-stylelint@141932ac62d4ea66e15b79de824ff44d0def0b0b # v1.33.0
            with:
              github_token: ${{ secrets.GITHUB_AUTH_TOKEN }}
              workdir: ui
              stylelint_input: "{src,packages,tests}/**/*.{vue,scss,css}"
              reporter: github-pr-review
              filter_mode: nofilter
              fail_level: error

          - name: Npm - lint (oxlint)
            uses: oxc-project/oxlint-action@b78c21302e4bc637e83927135c35a6684de1053e # v3.1.0
            with:
              working-directory: ui
              all-files: true

          # reporter: github-pr-review only has somewhere to post on a pull_request run. On a
          # push or dispatch build reviewdog prints "this is not PullRequest build" and drops every
          # finding, so the only thing the step can still do there is fail the job when its own
          # installer hiccups ("unable to find 'v0.21.1'" -> "reviewdog: command not found" -> exit
          # 127), which is exactly what turned the frontend job red on releases/v2.0.x in both repos
          # on 2026-09-14. Keep it where it reports, skip it where it cannot.
          - name: Npm - lint (eslint)
            if: ${{ github.event_name == 'pull_request' }}
            uses: reviewdog/action-eslint@5eb89b1e6e94ca33e91c3814c34b25a8370bba46 # v1.35.0
            with:
              github_token: ${{ secrets.GITHUB_AUTH_TOKEN }}
              reporter: github-pr-review
              workdir: ui

      # OpenGrep static analysis.
      - name: OpenGrep - Static analysis
        id: opengrep
        if: ${{ !cancelled() }}
        uses: kestra-io/actions/composite/scan-opengrep@main
        with:
          github-token: ${{ secrets.GITHUB_AUTH_TOKEN }}
          scan-path: ui

      # Ship the findings to Elastic, alongside the pull request comment and the artifact the
      # composite above already produces. Reuses the OTLP secrets: the managed _bulk input lives on
      # the same ingest host as the Managed OTLP Endpoint and authenticates the same way.
      - name: OpenGrep - Report findings to Elastic
        if: ${{ !cancelled() && env.OTLP_ENDPOINT != '' }}
        continue-on-error: true
        uses: kestra-io/actions/actions/report-sarif@main
        with:
          sarif-files: ${{ steps.opengrep.outputs.sarif-file }}
          # Static analysis, not a vulnerability scanner: no CVE, no package, a rule a file breaks.
          type: misconfigurations
          elastic-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          elastic-headers: "${{ secrets.OTLP_HEADERS }}"
          metadata: |
            service.name=kestra
            component=frontend

      - name: Storybook - Wait for Playwright install
        wait: [playwright-install]

      - name: Run storybook component tests
        working-directory: ui
        run: npm run test:storybook

      # Runs on success too (not just failure): that's what lets it clear a
      # stale failures comment once the suite goes back to green.
      - name: Report failing UI tests on the PR
        if: always()
        uses: kestra-io/actions/composite/report-ui-test-failures@main
        with:
          github-token: ${{ secrets.GITHUB_AUTH_TOKEN }}
