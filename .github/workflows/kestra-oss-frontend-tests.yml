name: Frontend - Tests

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        description: 'Deprecated, unused. Kept so callers still passing it do not fail.'
        required: false
      GITHUB_AUTH_TOKEN:
        description: "The GitHub Token."
        required: true
      GOOGLE_SERVICE_ACCOUNT:
        description: 'Google Service Account, used to publish Storybook to the internal bucket'
        required: false
      OTLP_ENDPOINT:
        description: 'OTLP endpoint for OpenTelemetry export'
        required: false
      OTLP_HEADERS:
        description: 'OTLP headers for OpenTelemetry export'
        required: false

env:
  # to save corepack from itself
  COREPACK_INTEGRITY_KEYS: 0
  OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}

jobs:
  test:
    name: Frontend - Tests
    runs-on: ubuntu-latest
    steps:
      # Run first, before checkout, so setup time is captured by the trace/host metrics.
      - name: Setup - OpenTelemetry
        uses: kestra-io/actions/actions/otel-instrument@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          host-metrics-enabled: 'true'
          vitest-tracing-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'

      - name: Cache Node Modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ui/node_modules
          key: modules-${{ hashFiles('ui/package-lock.json', 'ui/patches/**') }}

      - name: Cache Playwright Binaries
        id: cache-playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('ui/package-lock.json') }}

      - name: Npm - install
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ui
        run: npm ci

      # Runs concurrently with the checks/build/unit-tests below and is only waited on right
      # before it's needed — it's a pure download (browser binaries + apt deps), independent of
      # everything else in this job.
      - name: Storybook - Install Playwright
        id: playwright-install
        background: true
        working-directory: ui
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      # Hoisted out of `prebuild`/`precheck:types`, which is where it used to run: the unit tests
      # import @kestra-io/kestra-sdk through its dist, so the group below needs it built first.
      - name: Npm - bundle the SDK
        # Release branches pin this workflow at @main and predate the script, same as `check:ts-any` below.
        if: hashFiles('ui/scripts/ensure-sdk.mjs') != ''
        working-directory: ui
        run: node scripts/ensure-sdk.mjs

      # Release branches pin this workflow at @main and predate the rule; they still carry a dead
      # stylelint.config.mjs, so the lockfile is what says stylelint can actually run.
      - name: Npm - can stylelint run here
        id: stylelint-available
        working-directory: ui
        run: |
          if [ -f stylelint.config.mjs ] && grep -q '"node_modules/stylelint":' package-lock.json; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "stylelint is not installed here, so the token rule has nothing to run."
          fi

      # Feeds the eslint and oxlint steps: warnings only annotate on these files. Listed ahead of
      # the parallel group that reads it. A failure here just annotates every warning.
      - name: Lint - list the files this PR touches
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        working-directory: ui
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/lint-base"
          git -c core.quotePath=false diff --name-only --diff-filter=ACMR --relative origin/lint-base HEAD > "$RUNNER_TEMP/lint-changed-files.txt"

      # oxlint/eslint are `uses:` steps inside a `parallel:` block, which is undocumented as of
      # writing (every public example uses bare `run:` steps) — verify this combination on a
      # scratch dispatch before relying on it; fall back to sequential if it misbehaves.
      #
      # The build and the unit tests share the group with the type check: none of the three reads
      # what another writes, and nothing later in the job consumes ui/dist.
      - parallel:
          - name: Npm - Run build
            working-directory: ui
            run: npm run build

          - name: Run front-end unit tests
            working-directory: ui
            env:
              OTEL_STEP_NAME: Run front-end unit tests
            run: npm run test:unit -- --coverage ${OTEL_VITEST_REPORTER:+--reporter=$OTEL_VITEST_REPORTER}

          - name: Npm - check types
            working-directory: ui
            run: npm run check:types

          - name: Npm - check ts-any
            working-directory: ui
            # --if-present: release branches pin this workflow at @main and predate the script.
            run: npm run check:ts-any --if-present

          # Fails on error, like oxlint and eslint below. Reports the whole tree: the dead tokens
          # it finds sit on lines no PR touches (kestra-io/kestra#18777).
          - name: Npm - lint (stylelint)
            if: ${{ github.event_name == 'pull_request' && steps.stylelint-available.outputs.run == 'true' }}
            uses: kestra-io/actions/composite/lint-annotations@main
            with:
              linter: stylelint
              working-directory: ui
              stylelint-input: "{src,packages,tests}/**/*.{vue,scss,css}"

          # Runs the project's pinned oxlint over the whole directory, on every event.
          - name: Npm - lint (oxlint)
            uses: kestra-io/actions/composite/lint-annotations@main
            with:
              linter: oxlint
              working-directory: ui
              changed-files: ${{ runner.temp }}/lint-changed-files.txt

          # Still PR-only: push and dispatch builds never gated on lint under reviewdog either.
          # Errors fail the step; warnings such as comma-dangle only annotate.
          - name: Npm - lint (eslint)
            if: ${{ github.event_name == 'pull_request' }}
            uses: kestra-io/actions/composite/lint-annotations@main
            with:
              linter: eslint
              working-directory: ui
              changed-files: ${{ runner.temp }}/lint-changed-files.txt

      # Coverage
      - name: Coverage - Report
        if: ${{ !cancelled() && env.OTLP_ENDPOINT != '' }}
        continue-on-error: true
        uses: kestra-io/actions/composite/report-coverage@main
        with:
          github-token: ${{ secrets.GITHUB_AUTH_TOKEN }}
          elastic-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          elastic-headers: "${{ secrets.OTLP_HEADERS }}"
          coverage-files: '**/coverage/lcov.info'
          component: frontend

      - name: Storybook - Wait for Playwright install
        wait: [playwright-install]

      - name: Run storybook component tests
        working-directory: ui
        env:
          OTEL_STEP_NAME: Run storybook component tests
        run: npm run test:storybook -- ${OTEL_VITEST_REPORTER:+--reporter=$OTEL_VITEST_REPORTER}

      - name: Report - Frontend tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: kestra-io/actions/composite/report-junit@main
        with:
          github-token: ${{ secrets.GITHUB_AUTH_TOKEN }}
          title: Frontend Tests
          report-names: |
            Frontend Tests (Unit)
            Frontend Tests (Storybook)
          report-paths: |
            ui/test-report.junit.xml
            ui/test-report.storybook.junit.xml

      # Runs on success too (not just failure): that's what lets it clear a
      # stale failures comment once the suite goes back to green.
      - name: Report failing UI tests on the PR
        if: always()
        uses: kestra-io/actions/composite/report-ui-test-failures@main
        with:
          github-token: ${{ secrets.GITHUB_AUTH_TOKEN }}

      # Only after every test above passed, on the main branches
      - name: Storybook - Publish
        if: ${{ success() }}
        continue-on-error: true
        uses: kestra-io/actions/composite/publish-storybook@main
        with:
          working-directory: ui
          destination: kestra-io/kestra/storybook/ui
          google-service-account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
