name: Main

on:
  workflow_call:
    inputs:
      skip-test:
        description: "Does we need to skip test"
        required: true
        type: boolean
      sonatype-publish:
        description: "Does we use gradle publish or sonatype publish"
        required: false
        type: boolean
        default: true
      runner:
        description: "Deprecated, ignored. The runner is now selected automatically based on whether the calling repository is private or public."
        required: false
        type: string
        default: ""
      generate-shadowjar:
        description: "Does we generate a shadow jar"
        required: false
        type: boolean
        default: true
      java-version:
        description: "Java version"
        type: string
        default: '21'
        required: false
      skip-indexing:
        description: "Does we skip the indexing"
        required: false
        type: boolean
        default: false
      kestra-version:
        description: "Kestra core version to build against (overrides gradle.properties)"
        required: false
        type: string
        default: ''

permissions:
  contents: write
  checks: write
  actions: read
  pull-requests: write
  packages: read

env:
  COMPATIBILITY_JAVA_VERSION: '25'
  OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}

jobs:
  main:
    runs-on: ${{ github.event.repository.private && 'kestra-private-4cpu-4gb' || 'ubuntu-latest' }}
    steps:
      # Setup OpenTelemetry: root span context, background host-metrics collector, and a
      # Gradle init script that emits a span per task and per JUnit test (nested under the
      # build step). This all runs in the Gradle daemon, not the test workers, so there is
      # no conflict with Kestra's own OpenTelemetry — no agent injection needed. Run first,
      # before checkout, so checkout time is captured by the trace/host metrics too.
      - name: Setup - OpenTelemetry
        uses: kestra-io/actions/actions/otel-instrument@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          host-metrics-enabled: 'true'
          gradle-tracing-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"

      # Check out
      - name: Checkout - Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true

      - name: Setup - Patch Gradle JVM args
        shell: bash
        run: |
          if ! grep -q "^org.gradle.jvmargs=" gradle.properties; then
            printf "\norg.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m\n" >> gradle.properties
          fi

      # Override kestraVersion in gradle.properties if a specific version is requested
      - name: Setup - Override Kestra version
        if: ${{ inputs.kestra-version != '' }}
        shell: bash
        run: sed -i "s/^kestraVersion=.*/kestraVersion=${{ inputs.kestra-version }}/" gradle.properties

      # Override Java version in build.gradle for Kestra 2.x compatibility
      - name: Setup - Override Java version
        if: ${{ startsWith(inputs.kestra-version, '2.') }}
        shell: bash
        run: find . -name "build.gradle" -exec sed -i "s/JavaVersion\.VERSION_21/JavaVersion.VERSION_${{ env.COMPATIBILITY_JAVA_VERSION }}/g" {} +

      # Setup build
      - name: Setup - Build
        uses: kestra-io/actions/composite/setup-build@main
        with:
          java-enabled: true
          # Use Java 25 only for Kestra 2.x (including SNAPSHOT)
          java-version: ${{ startsWith(inputs.kestra-version, '2.') && env.COMPATIBILITY_JAVA_VERSION || inputs.java-version }}
          java-enable-develocity-injection: true
          # Set up Node only for plugins that ship a UI micro-frontend (ui/package-lock.json),
          # so setup-node's npm cache doesn't fail on the majority of plugins without one.
          node-enabled: ${{ hashFiles('ui/package-lock.json') != '' }}

      # Setup for setup-unit.sh, injecting secrets as env variables
      - name: Setup - Secret to Env
        uses: oNaiPs/secrets-to-env-action@v1
        with:
          secrets: ${{ toJSON(secrets) }}

      # Auth to google — required for com.google.cloud.artifactregistry.gradle-plugin (EE plugins)
      # and to obtain an access token used by the maven-remote init script (all plugins).
      - name: GCP - Check credentials availability
        id: gcp-check
        run: echo "available=${{ secrets.GCP_SERVICE_ACCOUNT != '' }}" >> $GITHUB_OUTPUT

      - name: GCP - Auth with github service account
        id: gcp-auth
        uses: 'google-github-actions/auth@v3'
        if: steps.gcp-check.outputs.available == 'true'
        with:
          token_format: 'access_token'
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # Inject a Gradle init script that routes all Maven reads through the GCP AR maven-remote
      # caching proxy, avoiding Maven Central 429s caused by shared GitHub Actions runner IPs.
      # Central and Sonatype are neutralised via content filtering (order/timing-independent),
      # not removal or reordering, so they are never queried. Mirrors the logic proven in the
      # kestra-ee/setup-maven-proxy composite action. The token is read at build time from
      # MAVEN_REMOTE_TOKEN (exported to the whole job below); the script is a no-op when empty.
      - name: Setup - Gradle maven-remote init script
        if: ${{ steps.gcp-auth.outputs.access_token != '' }}
        shell: bash
        env:
          MAVEN_REMOTE_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/maven-remote.gradle << 'EOF'
          def token = System.getenv("MAVEN_REMOTE_TOKEN") ?: ""

          // The GCP Artifact Registry "maven-remote" is a server-side caching mirror of Maven
          // Central: requests are proxied from Google IPs, never the shared runner IP, so it is
          // immune to the Maven Central HTTP 429 rate-limiting that fails CI plugin/dependency
          // resolution. Route Gradle Maven reads through it and stop touching raw Maven Central
          // (repo.maven.apache.org) and Sonatype releases, except the Sonatype snapshots repo
          // (see isRawPublic below), which hosts Kestra pre-release artifacts the mirror lacks.
          def injectProxy = { repos ->
              if (token && !repos.findByName("GcpMavenRemote")) {
                  repos.maven {
                      name = "GcpMavenRemote"
                      url = "https://europe-maven.pkg.dev/kestra-host/maven-remote"
                      credentials { username = "oauth2accesstoken"; password = token }
                  }
              }
          }

          // Neutralise raw public repos (Maven Central + Sonatype) wherever they are declared,
          // including ones added later by build scripts. We disable them via content filtering
          // rather than removing them: removal races with the root buildscript block, whereas an
          // "all {}" hook + excludeGroupByRegex is order- and timing-independent. An excluded repo
          // is never queried; the proxy (a Central mirror) serves the same content.
          // Sonatype SNAPSHOTS are intentionally NOT excluded. Kestra publishes pre-release
          // artifacts (e.g. io.kestra:platform:2.0.0-SNAPSHOT, needed by v2/SDK plugin branches)
          // only to central.sonatype.com/repository/maven-snapshots, and the maven-remote mirror
          // caches Central RELEASES, not Sonatype snapshots. Excluding the snapshots repo left
          // those artifacts unresolvable. Only io.kestra:*:*-SNAPSHOT is fetched there and only on
          // snapshot builds, so the traffic is tiny and immune to the Central 429 this proxy fixes.
          def isRawPublic = { repo ->
              repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository &&
                  repo.url != null &&
                  (repo.url.toString().startsWith("https://repo.maven.apache.org") ||
                   (repo.url.toString().contains("central.sonatype.com") &&
                    !repo.url.toString().contains("maven-snapshots")))
          }
          // Plugin/buildscript repos: neutralise raw Central/Sonatype, and for the remaining maven
          // repos use the .pom only + ignore the .module redirect. Some plugins (artifactregistry,
          // owasp dependencycheck) publish Gradle Module Metadata whose .module the proxy does not
          // mirror and the Plugin Portal lacks, so Gradle would chase the .module back to Central and
          // 429. The Portal's .pom resolves them.
          def scrubPluginRepos = { repos ->
              repos.all { repo ->
                  if (isRawPublic(repo)) {
                      repo.content { excludeGroupByRegex ".*" }
                  } else if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
                      repo.metadataSources { mavenPom(); ignoreGradleMetadataRedirection() }
                  }
              }
          }
          // Project (main-dependency) repos: only neutralise raw Central/Sonatype. Keep Gradle Module
          // Metadata so library variant/capability resolution stays correct — the proxy mirrors the
          // .module for normal Central-hosted libraries.
          def scrubDependencyRepos = { repos ->
              repos.all { repo ->
                  if (isRawPublic(repo)) {
                      repo.content { excludeGroupByRegex ".*" }
                  }
              }
          }

          beforeSettings { settings ->
              injectProxy(settings.pluginManagement.repositories)
              // Keep the Gradle Plugin Portal for plugin markers/impls not mirrored by Central.
              // (Touching pluginManagement.repositories drops the implicit default; its real name
              // is "Gradle Central Plugin Repository".)
              if (!settings.pluginManagement.repositories.findByName("Gradle Central Plugin Repository")) {
                  settings.pluginManagement.repositories.gradlePluginPortal()
              }
              // Intentionally NO mavenCentral() here — neutralise it if a settings script adds one.
              scrubPluginRepos(settings.pluginManagement.repositories)
          }
          if (token) {
              allprojects {
                  injectProxy(buildscript.repositories)
                  scrubPluginRepos(buildscript.repositories)
                  injectProxy(repositories)
                  scrubDependencyRepos(repositories)
              }
          }
          EOF
          # Export the token to the whole job so every Gradle step (check, publish, index release,
          # plugin setup/cleanup scripts) resolves through the proxy, and the OpenTelemetry init
          # script's classpath uses the mirror instead of falling back to Maven Central and 429ing.
          echo "MAVEN_REMOTE_TOKEN=${MAVEN_REMOTE_ACCESS_TOKEN}" >> "$GITHUB_ENV"

      # Setup unit tests environment
      - name: Setup - Unit test
        if: ${{ inputs.skip-test == false }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f .github/setup-unit.sh ]; then
            ./.github/setup-unit.sh
          fi

      # UI unit tests (Vitest, jsdom — no browser download) for plugins that ship a Vue
      # micro-frontend under ui/. Guarded on ui/package-lock.json so it is a no-op for the
      # plugins that have no UI; Node itself is set up conditionally in "Setup - Build".
      # --if-present keeps repos that lack a lint/test:unit script from failing.
      #
      # Backgrounded rather than put in a `parallel:` block with Gradle Check: Setup/Check/
      # Cleanup below is a strict sequential chain (Cleanup must run even when Check fails, to
      # tear down leaked cloud resources), which a flat parallel: list can't express. Running
      # this in the background alongside that whole chain and waiting on it after Cleanup gets
      # the same overlap without disturbing that chain.
      - name: Test - UI unit tests
        id: ui-unit-tests
        background: true
        if: ${{ inputs.skip-test == false && hashFiles('ui/package-lock.json') != '' }}
        working-directory: ui
        shell: bash
        run: |
          npm ci
          npm run --if-present lint
          npm run --if-present test:unit

      # Gradle check
      - name: Test - Gradle Check
        if: ${{ inputs.skip-test == false }}
        shell: bash
        run: ./gradlew check ${{ inputs.generate-shadowjar == true && 'shadowJar' || ''  }} --parallel --console=plain
        env:
          JAVA_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=1g"
          GITHUB_TOKEN: ${{ github.token }}

      # Cleanup unit tests environment.
      # !cancelled() (not the implicit success()) is required so teardown still runs when
      # "Test - Gradle Check" fails — that is exactly when a test may have leaked resources
      # (e.g. objects in a shared cloud bucket) and cleanup matters most. Without an explicit
      # status function a step defaults to success() and is skipped on any prior failure.
      - name: Cleanup - Unit test
        if: ${{ !cancelled() && inputs.skip-test == false }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f .github/cleanup-unit.sh ]; then
            ./.github/cleanup-unit.sh
          fi

      # Unconditional: `wait:` doesn't accept `if:` (GitHub rejects the combination as an
      # unrecognized step shape). The background step above already carries the condition —
      # waiting on it when it was skipped is a no-op.
      - name: Test - Wait for UI unit tests
        wait: [ui-unit-tests]

      # Avoid duplicate publishing on release commits:
      # when a main/master push points to a release tag, only the tag workflow should publish.
      - name: Publish - Guard
        id: publish-guard
        if: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && startsWith(github.repository, 'kestra-io/') }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
            echo "Publish enabled: tag run (${GITHUB_REF})."
            exit 0
          fi

          RELEASE_TAGS="$(git tag --points-at HEAD | grep -E '^v[0-9]' || true)"
          if [[ -n "${RELEASE_TAGS}" ]]; then
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
            echo "Publish disabled on branch run because HEAD is already tagged:"
            echo "${RELEASE_TAGS}"
          else
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
            echo "Publish enabled: branch run with non-tagged HEAD."
          fi

      # Refresh auth to avoid expired tokens during long test/build phases before private publish
      - name: GCP - Refresh auth with github service account
        uses: 'google-github-actions/auth@v3'
        if: ${{ inputs.sonatype-publish == false && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && startsWith(github.repository, 'kestra-io/') && steps.publish-guard.outputs.should-publish == 'true' }}
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # Publish
      - name: Publish - Java
        uses: kestra-io/actions/composite/publish-java@main
        if: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && startsWith(github.repository, 'kestra-io/') && steps.publish-guard.outputs.should-publish == 'true' }}
        with:
          secrets: ${{ toJSON(secrets) }}
          is-private: ${{ inputs.sonatype-publish == false }}

      # Upload JAR for PR
      - name: Publish - Jar artifacts for PR only
        uses: kestra-io/actions/composite/jar-upload@main
        if: ${{ inputs.generate-shadowjar == true && github.event_name == 'pull_request' && startsWith(github.repository, 'kestra-io/') }}
        with:
          secrets: ${{ toJSON(secrets) }}

      # Cleanup disk space to avoid "no space left on device" errors during Trivy scan (needed for plugin-jdbc only, which installs many docker images)
      - name: Cleanup - Free up disk space
        if: ${{ github.repository == 'kestra-io/plugin-jdbc' }}
        run: |
          echo "🧹 Freeing up disk space on the runner..."
          sudo docker system prune -a -f --volumes
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo apt-get autoclean

          echo "🗑️ Deleting large pre-installed tools (Dotnet, Android, Haskell)"
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android 
          sudo rm -rf /opt/ghc

          echo "⚠️ Deleting tmp folders"
          sudo rm -rf /tmp/*
          sudo rm -rf /var/tmp/*

          echo "🧼 Deleting Trivy cache and temp directories"
          rm -rf ${{ github.workspace }}/.trivy-cache
          rm -rf ${{ github.workspace }}/trivy-tmp

          echo "📊 Disk usage after cleanup:"
          df -h

          echo "✅ Disk space cleanup complete."

      # Trivy scan for PR
      - name: Trivy - Scan jar for PR only
        if: ${{ inputs.generate-shadowjar == true && github.event_name == 'pull_request' && startsWith(github.repository, 'kestra-io/') }}
        uses: kestra-io/actions/composite/scan-trivy@main
        with:
          secrets: ${{ toJSON(secrets) }}

      # GitHub Release
      - name: GitHub - Create release
        uses: kestra-io/actions/composite/github-release@main
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_RELEASES_WEBHOOK_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}

      # Report Java
      - name: Report - Java
        uses: kestra-io/actions/composite/report-java@main
        if: ${{ !cancelled() && inputs.skip-test == false }}
        with:
          secrets: ${{ toJSON(secrets) }}

      # Unreleased commits since latest release
      - name: Unreleased Commits - Comment pull request
        uses: kestra-io/actions/composite/unreleased-commits@main
        if: ${{ github.event_name == 'pull_request' }}
        with:
          secrets: ${{ toJSON(secrets) }}

      # Slack on error
      - name: Slack - Notify on failure
        id: send-ci-failed
        if: always() && env.SLACK_WEBHOOK_URL != '' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && job.status == 'failure'
        uses: kestra-io/actions/composite/slack-status@main
        with:
          channel: "C09FE0QCN2E"
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          suffix: ${{ inputs.kestra-version }}

      # Allure report permissions
      - name: Allure report permissions
        if: ${{ !cancelled() && inputs.skip-test == false }}
        shell: bash
        run: |
          REPORT_DIR="build/reports/allure"
          
          # Check if the Allure report directory actually exists before attempting chown.
          # This prevents the "No such file or directory" error (EACCES context).
          if [ -d "$REPORT_DIR" ]; then
            echo "🔧 Fixing permissions for Allure report directory: $REPORT_DIR"
            # Use chown to transfer ownership from 'root' (often the case after Docker build) 
            # to the GitHub Actions runner user, solving the EACCES error during 'unlink'.
            sudo chown -R $(whoami) "$REPORT_DIR"
          else
            echo "ℹ️ Allure report directory $REPORT_DIR not found. Skipping chown."
          fi

      # Index release
      - name: Index release
        uses: kestra-io/actions/composite/plugin-release-index@main
        # We trigger the plugin release index only for NON SNAPSHOT version thus the if:
        if: ${{ (startsWith(github.ref, 'releases/v') || startsWith(github.ref, 'refs/tags/v')) && startsWith(github.repository, 'kestra-io/')  && inputs.skip-indexing == false }}
        with:
          webhookUrl: "${{ secrets.KESTRA_WEBHOOK_URL_PLUGIN_RELEASE_INDEX }}"

  otel-export-trace:
    if: always()
    name: OpenTelemetry Export Trace
    runs-on: ubuntu-latest
    needs: [main]
    steps:
      # Reconstruct and export the whole workflow -> job -> step trace. The live
      # Gradle/JUnit spans emitted during "main" nest under their step spans via
      # the shared deterministic ids.
      - name: OpenTelemetry - Export trace
        uses: kestra-io/actions/actions/otel-export-trace@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          logs-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"
