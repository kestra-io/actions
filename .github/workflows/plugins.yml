name: Main

on:
  workflow_call:
    inputs:
      skip-test:
        description: "Does we need to skip test"
        required: true
        type: boolean
      sonatype-publish:
        description: "Does we use gradle publish or sonatype publish"
        required: false
        type: boolean
        default: true
      runner:
        description: "Deprecated, ignored. The runner is now selected automatically based on whether the calling repository is private or public."
        required: false
        type: string
        default: ""
      generate-shadowjar:
        description: "Does we generate a shadow jar"
        required: false
        type: boolean
        default: true
      java-version:
        description: "Java version"
        type: string
        default: '21'
        required: false
      skip-indexing:
        description: "Does we skip the indexing"
        required: false
        type: boolean
        default: false
      kestra-version:
        description: "Kestra core version to build against (overrides gradle.properties)"
        required: false
        type: string
        default: ''

permissions:
  contents: write
  checks: write
  actions: read
  pull-requests: write
  packages: read

env:
  COMPATIBILITY_JAVA_VERSION: '25'
  OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}

jobs:
  main:
    runs-on: ${{ github.event.repository.private && 'kestra-private-4cpu-4gb' || 'ubuntu-latest' }}
    steps:
      # Setup OpenTelemetry: root span context, background host-metrics collector, and a
      # Gradle init script that emits a span per task and per JUnit test (nested under the
      # build step). This all runs in the Gradle daemon, not the test workers, so there is
      # no conflict with Kestra's own OpenTelemetry — no agent injection needed. Run first,
      # before checkout, so checkout time is captured by the trace/host metrics too.
      - name: Setup - OpenTelemetry
        uses: kestra-io/actions/actions/otel-instrument@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          host-metrics-enabled: 'true'
          gradle-tracing-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"

      # Check out
      - name: Checkout - Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true

      - name: Setup - Patch Gradle JVM args
        shell: bash
        run: |
          if ! grep -q "^org.gradle.jvmargs=" gradle.properties; then
            printf "\norg.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m\n" >> gradle.properties
          fi

      # Override kestraVersion in gradle.properties if a specific version is requested
      - name: Setup - Override Kestra version
        if: ${{ inputs.kestra-version != '' }}
        shell: bash
        run: sed -i "s/^kestraVersion=.*/kestraVersion=${{ inputs.kestra-version }}/" gradle.properties

      # Override Java version in build.gradle for Kestra 2.x compatibility
      - name: Setup - Override Java version
        if: ${{ startsWith(inputs.kestra-version, '2.') }}
        shell: bash
        run: find . -name "build.gradle" -exec sed -i "s/JavaVersion\.VERSION_21/JavaVersion.VERSION_${{ env.COMPATIBILITY_JAVA_VERSION }}/g" {} +

      # Setup build
      - name: Setup - Build
        uses: kestra-io/actions/composite/setup-build@main
        with:
          java-enabled: true
          # Use Java 25 only for Kestra 2.x (including SNAPSHOT)
          java-version: ${{ startsWith(inputs.kestra-version, '2.') && env.COMPATIBILITY_JAVA_VERSION || inputs.java-version }}
          java-enable-develocity-injection: true
          # Set up Node only for plugins that ship a UI micro-frontend (ui/package-lock.json),
          # so setup-node's npm cache doesn't fail on the majority of plugins without one.
          node-enabled: ${{ hashFiles('ui/package-lock.json') != '' }}

      # Setup for setup-unit.sh, injecting secrets as env variables
      - name: Setup - Secret to Env
        uses: oNaiPs/secrets-to-env-action@75f319b3c8c926ac2eabcca34daa6cf531daf32f # v1.8
        with:
          secrets: ${{ toJSON(secrets) }}

      # Route Gradle Maven reads through the GCP maven-remote caching proxy (avoids Maven Central 429s)
      - name: Setup - Maven proxy
        uses: kestra-io/actions/composite/kestra-ee/setup-maven-proxy@main
        with:
          gcp-service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # Setup unit tests environment
      - name: Setup - Unit test
        if: ${{ inputs.skip-test == false }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f .github/setup-unit.sh ]; then
            ./.github/setup-unit.sh
          fi

      # UI unit tests (Vitest, jsdom — no browser download) for plugins that ship a Vue
      # micro-frontend under ui/. Guarded on ui/package-lock.json so it is a no-op for the
      # plugins that have no UI; Node itself is set up conditionally in "Setup - Build".
      # --if-present keeps repos that lack a lint/test:unit script from failing.
      - name: Test - UI unit tests
        if: ${{ inputs.skip-test == false && hashFiles('ui/package-lock.json') != '' }}
        working-directory: ui
        shell: bash
        run: |
          npm ci
          npm run --if-present lint
          npm run --if-present test:unit

      # Gradle check
      - name: Test - Gradle Check
        if: ${{ inputs.skip-test == false }}
        shell: bash
        run: ./gradlew check ${{ inputs.generate-shadowjar == true && 'shadowJar' || ''  }} --parallel --console=plain
        env:
          JAVA_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=1g"
          GITHUB_TOKEN: ${{ github.token }}

      # Cleanup unit tests environment.
      # !cancelled() (not the implicit success()) is required so teardown still runs when
      # "Test - Gradle Check" fails — that is exactly when a test may have leaked resources
      # (e.g. objects in a shared cloud bucket) and cleanup matters most. Without an explicit
      # status function a step defaults to success() and is skipped on any prior failure.
      - name: Cleanup - Unit test
        if: ${{ !cancelled() && inputs.skip-test == false }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f .github/cleanup-unit.sh ]; then
            ./.github/cleanup-unit.sh
          fi

      # Avoid duplicate publishing on release commits:
      # when a main/master push points to a release tag, only the tag workflow should publish.
      - name: Publish - Guard
        id: publish-guard
        if: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && startsWith(github.repository, 'kestra-io/') }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
            echo "Publish enabled: tag run (${GITHUB_REF})."
            exit 0
          fi

          RELEASE_TAGS="$(git tag --points-at HEAD | grep -E '^v[0-9]' || true)"
          if [[ -n "${RELEASE_TAGS}" ]]; then
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
            echo "Publish disabled on branch run because HEAD is already tagged:"
            echo "${RELEASE_TAGS}"
          else
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
            echo "Publish enabled: branch run with non-tagged HEAD."
          fi

      # Refresh auth to avoid expired tokens during long test/build phases before private publish
      - name: GCP - Refresh auth with github service account
        uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093' # v3.0.0
        if: ${{ inputs.sonatype-publish == false && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && startsWith(github.repository, 'kestra-io/') && steps.publish-guard.outputs.should-publish == 'true' }}
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # Publish
      - name: Publish - Java
        uses: kestra-io/actions/composite/publish-java@main
        if: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && startsWith(github.repository, 'kestra-io/') && steps.publish-guard.outputs.should-publish == 'true' }}
        with:
          secrets: ${{ toJSON(secrets) }}
          is-private: ${{ inputs.sonatype-publish == false }}

      # Upload JAR for PR
      - name: Publish - Jar artifacts for PR only
        uses: kestra-io/actions/composite/jar-upload@main
        if: ${{ inputs.generate-shadowjar == true && github.event_name == 'pull_request' && startsWith(github.repository, 'kestra-io/') }}
        with:
          secrets: ${{ toJSON(secrets) }}

      # Cleanup disk space to avoid "no space left on device" errors during Trivy scan (needed for plugin-jdbc only, which installs many docker images)
      - name: Cleanup - Free up disk space
        if: ${{ github.repository == 'kestra-io/plugin-jdbc' }}
        run: |
          echo "🧹 Freeing up disk space on the runner..."
          sudo docker system prune -a -f --volumes
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo apt-get autoclean

          echo "🗑️ Deleting large pre-installed tools (Dotnet, Android, Haskell)"
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

          echo "⚠️ Deleting tmp folders"
          sudo rm -rf /tmp/*
          sudo rm -rf /var/tmp/*

          echo "🧼 Deleting Trivy cache and temp directories"
          rm -rf ${{ github.workspace }}/.trivy-cache
          rm -rf ${{ github.workspace }}/trivy-tmp

          echo "📊 Disk usage after cleanup:"
          df -h

          echo "✅ Disk space cleanup complete."

      # CycloneDX SBOM of the runtime classpath, written to build/sbom/java.json by
      # io.kestra.gradle.repository-conventions and scanned by Trivy below. Its own step
      # and continue-on-error so a plugin on an older version, without the task, doesn't fail the build.
      - name: Trivy - Generate CycloneDX
        if: ${{ (github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'releases/')) && startsWith(github.repository, 'kestra-io/') }}
        continue-on-error: true
        shell: bash
        run: ./gradlew cyclonedxBom --console=plain
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Trivy scan of the Java dependencies on the default branch and releases/*, from the CycloneDX SBOM (runtime
      # classpath) generated above rather than from the final jar. Gated on the SBOM file existing.
      - name: Trivy - Scan Java dependencies
        id: trivy
        if: ${{ hashFiles('build/sbom/java.json') != '' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'releases/')) && startsWith(github.repository, 'kestra-io/') }}
        uses: kestra-io/actions/composite/scan-trivy@main
        with:
          scan-type: sbom
          scan-path: build/sbom/java.json
          elastic-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          elastic-headers: "${{ secrets.OTLP_HEADERS }}"
          metadata: |
            component=plugin
            target=java-dependencies

      # OpenGrep static analysis.
      - name: OpenGrep - Static analysis
        id: opengrep
        if: ${{ !cancelled() && startsWith(github.repository, 'kestra-io/') }}
        uses: kestra-io/actions/composite/scan-opengrep@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          elastic-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          elastic-headers: "${{ secrets.OTLP_HEADERS }}"
          metadata: |
            component=plugin

      # Secret scan. Diff on a pull request, the whole tree otherwise.
      - name: TruffleHog - Secret scan
        if: ${{ !cancelled() && startsWith(github.repository, 'kestra-io/') }}
        uses: kestra-io/actions/composite/scan-trufflehog@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          elastic-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          elastic-headers: "${{ secrets.OTLP_HEADERS }}"
          metadata: |
            component=plugin

      # Trivy scan for the plugin's optional Vue micro-frontend (ui/package-lock.json). No-op for
      # plugins with no UI — same guard as "Test - UI unit tests" above.
      - name: Trivy - Scan UI npm dependencies
        id: trivy-ui
        if: ${{ hashFiles('ui/package-lock.json') != '' && !cancelled() && startsWith(github.repository, 'kestra-io/') }}
        uses: kestra-io/actions/composite/scan-trivy@main
        with:
          scan-path: ./ui/package-lock.json
          elastic-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          elastic-headers: "${{ secrets.OTLP_HEADERS }}"
          metadata: |
            component=plugin
            target=ui-dependencies

      # GitHub Release
      - name: GitHub - Create release
        uses: kestra-io/actions/composite/github-release@main
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        with:
          announce-slack: 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_RELEASES_WEBHOOK_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}

      # Report Java
      - name: Report - Java
        uses: kestra-io/actions/composite/report-java@main
        if: ${{ !cancelled() && inputs.skip-test == false }}
        with:
          secrets: ${{ toJSON(secrets) }}

      # Coverage
      - name: Coverage - Report
        if: ${{ !cancelled() && env.OTLP_ENDPOINT != '' && inputs.skip-test == false }}
        continue-on-error: true
        uses: kestra-io/actions/composite/report-coverage@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          coverage-files: '**/build/reports/jacoco/**/*.xml'
          component: plugin
          base-branch: ${{ github.event.repository.default_branch }}
          elastic-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          elastic-headers: "${{ secrets.OTLP_HEADERS }}"
          metadata: |
            component=plugin

      # Unreleased commits since latest release
      - name: Unreleased Commits - Comment pull request
        uses: kestra-io/actions/composite/unreleased-commits@main
        if: ${{ github.event_name == 'pull_request' }}
        with:
          secrets: ${{ toJSON(secrets) }}

      # Slack on error
      - name: Slack - Notify on failure
        id: send-ci-failed
        if: always() && env.SLACK_WEBHOOK_URL != '' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && job.status == 'failure'
        uses: kestra-io/actions/composite/slack-status@main
        with:
          channel: "C09FE0QCN2E"
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          suffix: ${{ inputs.kestra-version }}

      # Allure report permissions
      - name: Allure report permissions
        if: ${{ !cancelled() && inputs.skip-test == false }}
        shell: bash
        run: |
          REPORT_DIR="build/reports/allure"

          # Check if the Allure report directory actually exists before attempting chown.
          # This prevents the "No such file or directory" error (EACCES context).
          if [ -d "$REPORT_DIR" ]; then
            echo "🔧 Fixing permissions for Allure report directory: $REPORT_DIR"
            # Use chown to transfer ownership from 'root' (often the case after Docker build)
            # to the GitHub Actions runner user, solving the EACCES error during 'unlink'.
            sudo chown -R $(whoami) "$REPORT_DIR"
          else
            echo "ℹ️ Allure report directory $REPORT_DIR not found. Skipping chown."
          fi

      # Index release
      - name: Index release
        uses: kestra-io/actions/composite/plugin-release-index@main
        # We trigger the plugin release index only for NON SNAPSHOT version thus the if:
        if: ${{ (startsWith(github.ref, 'releases/v') || startsWith(github.ref, 'refs/tags/v')) && startsWith(github.repository, 'kestra-io/')  && inputs.skip-indexing == false }}
        with:
          webhookUrl: "${{ secrets.KESTRA_WEBHOOK_URL_PLUGIN_RELEASE_INDEX }}"

  otel-export-trace:
    if: always()
    name: OpenTelemetry Export Trace
    runs-on: ${{ github.event.repository.private && 'kestra-private-4cpu-4gb' || 'ubuntu-latest' }}
    needs: [main]
    steps:
      # Reconstruct and export the whole workflow -> job -> step trace. The live
      # Gradle/JUnit spans emitted during "main" nest under their step spans via
      # the shared deterministic ids.
      - name: OpenTelemetry - Export trace
        uses: kestra-io/actions/actions/otel-export-trace@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          logs-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"
