# CodeQL advanced setup, shared by every Kestra plugin repository.
#
# Two jobs rather than one matrix, because the two analyses have almost nothing in common:
# Java is extracted from a real Gradle build, 'actions' is extracted buildless.
#
# Default setup analysed Java with build-mode 'none' (buildless extraction), which could not
# resolve the Gradle classpath: on plugin-compress only 77% of calls had a call target and 87% of
# expressions had a known type, both under CodeQL's 85% quality threshold. An unresolved classpath
# means taint flow through Kestra core and third-party types is invisible, so the code most worth
# scanning is the least reliably scanned.
#
# Plugin repositories call this from a thin .github/workflows/codeql.yml that owns the triggers:
#
#   permissions:
#     contents: read
#     security-events: write
#     actions: read
#   jobs:
#     codeql:
#       uses: kestra-io/actions/.github/workflows/plugins-codeql.yml@main
#
# Reusable workflow permissions can only be maintained or reduced, never elevated, so the caller
# must grant `security-events: write` itself or the nested job is rejected before it starts.
name: Plugins - CodeQL

on:
  workflow_call:
    inputs:
      java-version:
        description: "Java version"
        required: false
        type: string
        default: '21'
      build-command:
        description: "Command that compiles main sources for CodeQL to trace"
        required: false
        type: string
        # --no-build-cache for the same reason Develocity injection is off in the Java job: a
        # cache hit would skip javac and leave CodeQL with an empty database.
        default: './gradlew classes --no-daemon --no-build-cache --console=plain'
      queries:
        description: "CodeQL query suite. Use 'security-and-quality' to add the maintainability queries"
        required: false
        type: string
        default: 'security-extended'
      codeql-config:
        description: "CodeQL configuration file, in the external-repository form OWNER/REPO/PATH@REF"
        required: false
        type: string
        default: 'kestra-io/actions/.github/codeql/codeql-config.yml@main'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # Java is built so CodeQL traces compilation and records the resolved dependency classpath.
  java:
    name: CodeQL - Java
    runs-on: ${{ github.event.repository.private && 'kestra-private-4cpu-4gb' || 'ubuntu-latest' }}
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: java-kotlin
          build-mode: manual
          # Wider than the 'default' suite default setup used.
          queries: ${{ inputs.queries }}
          # Only carries paths-ignore, which is a no-op for a built language. Passed anyway so
          # both jobs report against the same configuration.
          config-file: ${{ inputs.codeql-config }}

      # Same JDK and Gradle setup the plugin build itself uses, so CodeQL compiles the code the
      # way CI does. Develocity injection stays off on purpose: CodeQL builds a database by
      # tracing javac, so a remote build cache serving compileJava FROM-CACHE would mean javac
      # never runs and the database comes out empty, with the analysis passing but seeing nothing.
      - name: Setup - Build
        uses: kestra-io/actions/composite/setup-build@main
        with:
          java-enabled: true
          java-version: ${{ inputs.java-version }}
          java-enable-develocity-injection: false

      # classes, not testClasses: with build-mode 'manual' the traced build IS the path filter,
      # so compiling main sources only is what keeps src/test/java out of the database.
      # paths-ignore cannot do this for a built language.
      - name: Build with Gradle
        run: ${{ inputs.build-command }}
        env:
          JAVA_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=1g"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:java-kotlin"

  # Workflow files have no classpath to resolve, so they are extracted without a build.
  actions:
    name: CodeQL - Github Actions
    runs-on: ${{ github.event.repository.private && 'kestra-private-4cpu-4gb' || 'ubuntu-latest' }}
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: actions
          build-mode: none
          queries: ${{ inputs.queries }}
          # paths-ignore takes effect here: buildless extraction is where it applies.
          config-file: ${{ inputs.codeql-config }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:actions"
