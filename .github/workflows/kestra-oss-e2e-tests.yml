name: 'E2E tests'
# 'New E2E tests implementation started by Roman. Based on playwright in npm UI project, tests Kestra OSS develop docker image. These tests are written from zero, lets make them unflaky from the start!.'
on:
  workflow_call:
    secrets:
      OTLP_ENDPOINT:
        description: 'OTLP endpoint for OpenTelemetry export'
        required: false
      OTLP_HEADERS:
        description: 'OTLP headers for OpenTelemetry export'
        required: false
    inputs:
      noInputYet:
        description: 'not input yet.'
        required: false
        type: string
        default: "no input"
      java-version:
        description: "Java version"
        type: string
        default: '21'
        required: false
      exe-artifact:
        description: >-
          Name of a Kestra executable artifact already uploaded by this workflow
          run (e.g. `exe` from Build Artifacts). When set, the Docker image under
          test is built from it instead of rebuilding the product from source;
          leave empty (forks, scheduled runs) to build from source.
        type: string
        default: ''
        required: false

env:
  OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}

jobs:
  check:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Checkout kestra
        uses: actions/checkout@v5
        with:
          path: kestra

      # Setup build. Java/python only exist to build the product from source,
      # so both are skipped when a prebuilt executable artifact is provided.
      - uses: kestra-io/actions/composite/setup-build@main
        name: Setup - Build
        id: build
        with:
          java-enabled: ${{ inputs.exe-artifact == '' && 'true' || 'false' }}
          node-enabled: true
          python-enabled: ${{ inputs.exe-artifact == '' && 'true' || 'false' }}
          java-version: ${{ inputs.java-version }}

      - name: Setup - OpenTelemetry
        uses: kestra-io/actions/actions/otel-instrument@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          host-metrics-enabled: 'true'
          gradle-tracing-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"

      - name: Cache - Playwright Binaries
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('kestra/ui/package-lock.json') }}

      # `npm ci` and the artifact download are independent (different paths, no shared state).
      # Playwright install stays out of this block and out of `background:` — it runs `npx
      # playwright` in the same directory as the npm ci above, which resolves the pinned
      # Playwright version from node_modules, so it must not start before npm ci finishes.
      - parallel:
          - name: Install Npm dependencies
            run: cd kestra/ui && npm ci

          - name: Artifacts - Download executable
            if: ${{ inputs.exe-artifact != '' }}
            uses: actions/download-artifact@v5
            with:
              name: ${{ inputs.exe-artifact }}
              path: kestra/build/executable

      - name: Install Playwright
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: cd kestra/ui && npx playwright install --with-deps chromium

      - name: Run E2E Tests
        env:
          E2E_USE_PREBUILT_EXE: ${{ inputs.exe-artifact != '' }}
        run: |
          cd kestra
          sh build-and-start-e2e-tests.sh

      - name: Upload Playwright Report as Github artifact
        # 'With this report, you can analyze locally the results of the tests. see https://playwright.dev/docs/ci-intro#html-report'
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: kestra/ui/playwright-report/
          retention-days: 7
