name: Github - Release

on:
  workflow_call:
    secrets:
      GH_BOT_APP_ID:
        description: "GitHub App Client ID."
        required: true
      GH_BOT_PRIVATE_KEY:
        description: "GitHub App private key."
        required: true
      SLACK_RELEASES_WEBHOOK_URL:
        description: "The Slack webhook URL."
        required: true
      OTLP_ENDPOINT:
        description: 'OTLP endpoint for OpenTelemetry export'
        required: false
      OTLP_HEADERS:
        description: 'OTLP headers for OpenTelemetry export'
        required: false

    inputs:
      sbom:
        description: 'Attach the SBOM uploaded as the `sbom` artifact by kestra-ee-build-artifacts to the release, and copy it to gs://kestra-ee-sbom/kestra-ee/<tag>/sbom.json as sbom-publisher. Requires the build to have run with `sbom: true`. The caller job must grant `id-token: write`.'
        type: boolean
        default: false
        required: false

env:
  OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}

jobs:
  release:
    name: Github - Release
    runs-on: kestra-private-4cpu-4gb
    # skip RCs
    if: ${{ !contains(github.ref, '-rc') }}
    steps:
      # Run first, before checkout, so setup time is captured by the trace/host metrics.
      - name: Setup - OpenTelemetry
        uses: kestra-io/actions/actions/otel-instrument@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          host-metrics-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"

      # Check out
      - name: Checkout - Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.GH_BOT_APP_ID }}
          private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }},docs

      # Download Exec
      # Must be done after checkout actions
      - name: Artifacts - Download executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: exe
          path: build/executable

      # Dropped next to the executable: the release uploads everything under build/executable.
      - name: Artifacts - Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ inputs.sbom && startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: sbom
          path: build/executable

      - name: Check if current tag is latest
        id: is_latest
        run: |
          latest_tag=$(git tag | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n1)
          current_tag="${GITHUB_REF_NAME#v}"
          if [ "$current_tag" = "$latest_tag" ]; then
          echo "latest=true" >> $GITHUB_OUTPUT
          else
          echo "latest=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      # Push API Reference to website
      - name: Push API Reference to website
        uses: kestra-io/actions/composite/publish-api-reference@main
        if: ${{ steps.is_latest.outputs.latest == 'true' }}
        with:
          gh-app-id: ${{ secrets.GH_BOT_APP_ID }}
          gh-app-private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}

      # GitHub Release
      - name: Create GitHub release
        uses: kestra-io/actions/composite/github-release@main
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        with:
          announce-slack: 'false'
        env:
          MAKE_LATEST: ${{ steps.is_latest.outputs.latest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_RELEASES_WEBHOOK_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}

      - name: Merge Release Notes
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: kestra-io/actions/composite/github-release-note-merge@main
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ github.ref_name }}

  sbom-gcs:
    name: GCS - Publish SBOM
    runs-on: kestra-private-4cpu-4gb
    # Separate from release so a failure never blocks it and can be re-run alone.
    if: ${{ inputs.sbom && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc') }}
    permissions:
      id-token: write
    steps:
      - name: Artifacts - Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom-artifact

      # The upload keeps the file name, so stage it as sbom.json first.
      - name: Artifacts - Stage SBOM for GCS
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          cp "$RUNNER_TEMP/sbom-artifact/kestra-ee-${GITHUB_REF_NAME}-sbom.json" "$RUNNER_TEMP/sbom/sbom.json"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: GCP - Auth with sbom-publisher (Workload Identity Federation)
        uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093' # v3.0.0
        with:
          workload_identity_provider: projects/956000344026/locations/global/workloadIdentityPools/github/providers/github
          service_account: sbom-publisher@kestra-dev.iam.gserviceaccount.com

      - name: Artifacts - Upload SBOM to GCS
        uses: google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a # v3.0.0
        with:
          path: ${{ runner.temp }}/sbom/sbom.json
          destination: kestra-ee-sbom/kestra-ee/${{ github.ref_name }}
          parent: false
          gzip: false
