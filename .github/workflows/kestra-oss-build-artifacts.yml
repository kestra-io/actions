name: Build Artifacts

on:
  workflow_call:
    secrets:
      OTLP_ENDPOINT:
        description: 'OTLP endpoint for OpenTelemetry export'
        required: false
      OTLP_HEADERS:
        description: 'OTLP headers for OpenTelemetry export'
        required: false
      GCP_SERVICE_ACCOUNT:
        description: 'GCP service account key JSON, for the Maven mirror the plugin catalog is downloaded from. Required when embed-plugins-schema-bundle is true.'
        required: false
    inputs:
      java-version:
        description: "Java version"
        type: string
        default: '21'
        required: false
      embed-plugins-schema-bundle:
        description: 'Generate the KIP-45 plugin schema bundle from the full plugin catalog and embed it in the jar. Off by default: it downloads the whole catalog, so it is worth the minutes on release and develop builds only, never on pull-request builds.'
        type: boolean
        default: false
        required: false

env:
  OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}

jobs:
  build:
    name: Build - Artifacts
    runs-on: ubuntu-latest
    outputs:
      docker-tag: ${{ steps.vars.outputs.tag }}
      docker-artifact-name: ${{ steps.vars.outputs.artifact }}
    env:
      PLUGIN_VERSION: ${{ github.event.inputs.plugin-version != null && github.event.inputs.plugin-version || 'LATEST' }}
    steps:
      - name: Checkout - Current ref
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Has no dependency on anything else in this job (a bare curl|bash installer, not even on
      # the checkout above) — start it now so it overlaps with Setup - Build / npm / Gradle below
      # instead of blocking right before it's needed. Waited on further down, just before the
      # first actual kestractl invocation.
      - name: Schema bundle - Install kestractl
        id: kestractl
        background: true
        if: ${{ inputs.embed-plugins-schema-bundle }}
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/kestra-io/kestractl/main/install-scripts/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Setup build
      - uses: kestra-io/actions/composite/setup-build@main
        name: Setup - Build
        id: build
        with:
          java-enabled: true
          node-enabled: true
          java-version: ${{ inputs.java-version }}

      - name: Setup - OpenTelemetry
        uses: kestra-io/actions/actions/otel-collect@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          host-metrics-enabled: 'true'
          gradle-tracing-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"

      # Npm
      - name: Setup - Npm install & build
        shell: bash
        working-directory: ui
        run: |
          npm ci
          npm run build

      # Build
      - name: Gradle - Build
        shell: bash
        run: |
          ./gradlew executableJar

      # ------------------------------------------------------------------------------------------
      # Plugin schema bundle (KIP-45): embedded in the jar as the /plugins-schema.json classpath
      # resource, so the flow editor can autocomplete plugin types that are NOT installed, with no
      # network access at runtime.
      #
      # It has to be generated from the full plugin catalog, which is not a build dependency of
      # Kestra — only a plugin-loaded Kestra can produce it. Hence two passes: the build above
      # yields a runnable executable, that executable generates the bundle, then the jar is
      # repackaged with it. The second pass re-runs processResources/jar/shadowJar only, since
      # compilation is already up to date.
      # ------------------------------------------------------------------------------------------
      # Independent of each other — different services, no shared state.
      - parallel:
          - name: Schema bundle - Get plugins list
            id: schema-bundle-plugins
            if: ${{ inputs.embed-plugins-schema-bundle }}
            uses: kestra-io/actions/composite/kestra/kestra-plugins-list@main
            with:
              kestraVersion: ${{ github.ref_name }}

          - name: Schema bundle - Authenticate to Google Cloud
            if: ${{ inputs.embed-plugins-schema-bundle }}
            uses: google-github-actions/auth@v3
            with:
              credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # Unconditional: `wait:` doesn't accept `if:` (GitHub rejects the combination as an
      # unrecognized step shape). The background step above already carries the condition —
      # waiting on it when it was skipped is a no-op.
      - name: Schema bundle - Wait for kestractl install
        wait: [kestractl]

      - name: Schema bundle - Download the plugin catalog
        shell: bash
        if: ${{ inputs.embed-plugins-schema-bundle }}
        env:
          PLUGINS: ${{ steps.schema-bundle-plugins.outputs.plugins }}
        run: |
          set -euo pipefail
          kestractl plugins download "${{ github.ref_name }}" \
            --maven-repository "https://europe-maven.pkg.dev/kestra-host/maven-remote" \
            --maven-username oauth2accesstoken \
            --maven-password "$(gcloud auth print-access-token)" \
            --plugins-dir ./plugins-catalog \
            --plugins "$PLUGINS" \
            --concurrency 50

      - name: Schema bundle - Generate and embed it in the jar
        shell: bash
        if: ${{ inputs.embed-plugins-schema-bundle }}
        run: |
          set -euo pipefail
          EXECUTABLE=$(ls build/executable/*)
          chmod +x "$EXECUTABLE"
          "$EXECUTABLE" plugins-schema --plugins ./plugins-catalog -o build/plugins-schema.json
          ./gradlew executableJar -PpluginsSchemaBundle=build/plugins-schema.json

      - name: Artifacts - Copy exe to image
        shell: bash
        run: |
          cp build/executable/* docker/app/kestra && chmod +x docker/app/kestra

      # Upload artifacts — independent, different artifact names and source paths.
      - parallel:
          - name: Artifacts - Upload JAR
            uses: actions/upload-artifact@v4
            with:
              name: jar
              path: build/libs/

          - name: Artifacts - Upload Executable
            uses: actions/upload-artifact@v4
            with:
              name: exe
              path: build/executable/
